ると，防災とは，<b>災害を未然に防止し，災害が発生した場合における被害の拡大を防ぎ，及び災害の復旧を図ること</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。防災とは「災害を未然に防止」「被害の拡大を防ぐ」「災害の復旧を図る」の3段階の活動を指すと法律で定義されています。","pattern":"正しい法定事項の確認（定義）","law":"災害対策基本法 第2条 第2号","source":"past"},{"id":"50-15-d","round":50,"qNum":"15","choice":"d","tag":"予報業務の許可","q":"民間気象事業者などが予報業務の許可を受けるためには，<b>当該予報業務の目的及び範囲に係る気象庁の警報事項を迅速に受けることができる施設及び要員</b>を有するものである必要がある。","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可要件である。「気象庁の警報事項を迅速に受けることができる施設及び要員」は、法定の許可の審査基準として明確に規定されています。","pattern":"正しい法定事項の確認（許可要件）","law":"気象業務法 第18条 第1項 第2号","source":"past"},{"id":"50-15-c","round":50,"qNum":"15","choice":"c","tag":"予報と警報","q":"気象庁が行う地面現象警報とは，大雨，大雪等による山崩れ，地滑り等の地面現象に関する警報をいい，<b>その警報事項を気象警報に含めて発表している。</b>","a":"〇","lawChanged":true,"explanation":"気象庁は実務上、地面現象（土砂災害）や浸水に関する警報事項を、大雨警報などの「気象警報」の枠組みの中に含めて一括して発表しています。","pattern":"法改正（名称変更による陳腐化）","law":"気象業務法施行令 第4条 第1項","source":"past"},{"id":"50-15-b","round":50,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"市町村長は，都道府県の機関から気象庁の警報事項の通知を受けたときは，災害対策基本法の規定に基づき，必要と認める地域の居住者，滞在者その他の者に対し，<b>避難のための立退きを勧告しなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 勧告しなければならない（義務） → 〇 指示することができる（任意）。「避難勧告」は法改正で廃止され「指示」に一本化されました。また、発令は義務ではなく市町村長の任意判断です。","pattern":"法改正（勧告廃止）＋義務と任意のすり替え","law":"災害対策基本法 第60条 第1項","source":"past"},{"id":"50-15-a","round":50,"qNum":"15","choice":"a","tag":"予報と警報","q":"地方公共団体は，<b>高潮の警報をしてはならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 してはならない。気象庁以外の者が行うことが許される警報は例外的な；市町村の長が行う「津波警報（政令で定める場合）」等に限られ、高潮警報を行うことは禁止されています。","pattern":"正しい法定事項の確認（禁止事項）","law":"気象業務法 第23条、気象業務法施行令 第10条","source":"past"},{"id":"50-14-d","round":50,"qNum":"14","choice":"d","tag":"気象観測","q":"気象庁長官は，気象観測の施設の設置の届け出をした者に対し，<b>観測の成果の報告を求めることができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告を求め得る。観測網の確立のため必要があるときは、施設設置の届出者に対し、観測成果の報告を求める権限が気象庁長官にあります。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第4項","source":"past"},{"id":"50-14-c","round":50,"qNum":"14","choice":"c","tag":"気象測器の検定","q":"船舶から気象庁長官に対してその成果の報告を行わなければならない気象の観測に用いる気象測器は，<b>検定に合格したものでなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 検定合格必須。成果の報告が義務付けられている船舶での観測に用いる指定測器は、検定合格品の使用が義務付けられています。","pattern":"正しい法定事項の確認","law":"気象業務法 第9条 第1項","source":"past"},{"id":"50-14-b","round":50,"qNum":"14","choice":"b","tag":"気象観測","q":"河川管理者が流域住民に洪水が発生を通知する目安とするため河川に水位観測施設を設置する場合，<b>気象庁長官に届け出なくともよい。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出不要。陸水の水位の観測は「水象」の観測であり、「気象」の観測ではないため、気象業務法上の届出義務の対象外です。","pattern":"正しい法定事項の確認（定義による除外）","law":"気象業務法 第2条 第3項、気象業務法施行規則 第1条の2 第1号・第6号 ト","source":"past"},{"id":"50-14-a","round":50,"qNum":"14","choice":"a","tag":"気象観測","q":"学会に発表する論文に掲載するデータを得るため大学が風速観測施設を国内に設置する場合は，<b>その旨を気象庁長官に届け出なくともよい。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出不要。「研究のため」の観測は法定の技術基準に従う義務から除外されており、それに伴い観測施設の設置届出も不要です。","pattern":"正しい法定事項の確認（例外規定）","law":"気象業務法 第6条 第1項 第1号、同条 第3項","source":"past"},{"id":"50-13-c","round":50,"qNum":"13","choice":"c","tag":"予報業務の許可","q":"複数の気象予報士を配置しなければならない事業所で 1 名の欠員が出た場合，<b>2週間</b>以内に補充しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 2週間以内。規定の人数を満たさなくなった場合、「2週間以内」に必要な措置（人員補充等）をとらなければなりません。","pattern":"正しい法定事項の確認（猶予期間）","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"50-13-b","round":50,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けた者は，事業所ごとに，1 日当たりの現象の予想を行う時間に応じて専任の気象予報士を置かなければならない。予想を行う時間が 21 時間のときには<b>4</b>名以上配置しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 4名以上。1日の予想時間が「16時間を超える」場合（21時間など）、専任の気象予報士は「4名」必要です。","pattern":"正しい法定事項の確認（人数の規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"50-13-a","round":50,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けた者は，事業所ごとに，1 日当たりの現象の予想を行う時間に応じて専任の気象予報士を置かなければならない。予想を行う時間が 15 時間のときには<b>3</b>名以上配置しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 3名以上。1日の予想時間が「8時間を超え16時間以下」の場合（15時間など）、専任の気象予報士は「3名」必要です。","pattern":"正しい法定事項の確認（人数の規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"50-12-d","round":50,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務に用いる現象の予想の方法の変更を行うときは，<b>あらかじめ気象庁長官の認可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 認可を受ける → 〇 30日前までに報告書を提出。現象の予想の方法の変更は、認可事項ではなく、事前の「報告書の提出（30日前まで）」で足ります。","pattern":"用語の混同（認可と報告）","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"50-12-c","round":50,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けていた者がその名称を変更したときは，予報業務の目的および範囲に変更がなければ，<b>名称の変更について気象庁長官に報告書を提出する必要はない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 報告書提出は不要 → 〇 遅滞なく報告書を提出。事業者の「名称」は法定の記載事項であり、変更があった場合は遅滞なく報告書を提出しなければなりません。","pattern":"法定事項の架空免除","law":"気象業務法施行規則 第50条 第1項 第4号、同条 第2項 第2号","source":"past"},{"id":"50-12-b","round":50,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務の全部または一部を廃止したときは，<b>廃止した日から 30 日以内に，気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 事後の届出でよい。予報業務の休止や廃止については、事前の許可や認可は不要で、事後（30日以内）の届出で足ります。","pattern":"正しい法定事項の確認（廃止の手続き）","law":"気象業務法 第22条","source":"past"},{"id":"50-12-a","round":50,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の目的又は範囲を変更しようとするときは，その 30 日前までに，<b>気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 事前の届出 → 〇 事前の認可。予報業務の目的や範囲の変更は、届出（ただ知らせるだけ）ではなく、気象庁長官の「認可（OKをもらうこと）」が必要です。","pattern":"用語の混同（認可と届出）","law":"気象業務法 第19条 第1項","source":"past"},{"id":"49-15-c","round":49,"qNum":"15","choice":"c","tag":"予報と警報","q":"気象，高潮，波浪の特別警報は，<b>府県予報区のほか地方予報区に対しても発表される。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 地方予報区にも発表 → 〇 府県予報区に発表。特別警報（気象・高潮・波浪）は「府県予報区」を対象として発表され、「地方予報区」向けには発表されません。","pattern":"予報区のすり替え","law":"気象業務法施行規則 第8条 第1項","source":"past"},{"id":"49-15-b","round":49,"qNum":"15","choice":"b","tag":"予報と警報","q":"気象庁から警報事項の通知を受けた都道府県の機関は，警報，特別警報いずれについても直ちにその通知された事項を関係市町村長に<b>通知しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× いずれも通知の義務 → 〇 警報は努力義務、特別警報は義務。特別警報は「通知しなければならない」ですが、通常の警報は「通知するように努めなければならない」です。","pattern":"義務と努力義務の混同（一括りにする）","law":"気象業務法 第15条 第2項、同法 第15条の2 第2項","source":"past"},{"id":"49-15-a","round":49,"qNum":"15","choice":"a","tag":"予報と警報","q":"気象業務法および気象業務法施行令に基づいて気象庁が直ちに警報事項を通知すべき対象機関は，気象庁が一般の利用に適合する気象，高潮，波浪の警報をしたときも，気象庁が気象，高潮，波浪の<b>特別警報をしたときも同じである。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 通知先は同じ。気象等の警報と特別警報で、政令で定める直ちに通知すべき対象機関（消防庁、海上保安庁、都道府県、NTT、NHK）は完全に同一です。","pattern":"正しい法定事項の確認（例外があると思わせる）","law":"気象業務法施行令 第8条 第1号、同令 第9条","source":"past"},{"id":"49-14-d","round":49,"qNum":"14","choice":"d","tag":"罰則","q":"気象庁長官の命を受け，私有地で観測を行おうとした気象庁職員の立ち入りを，土地所有者が<b>正当な理由なく拒んだ。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 罰則適用。気象庁長官の権限に基づく私有地等への立ち入りを拒む行為には、30万円以下の罰金が科されます。","pattern":"正しい罰則事例の確認","law":"気象業務法 第38条 第1項、同法 第47条 第2号","source":"past"},{"id":"49-14-c","round":49,"qNum":"14","choice":"c","tag":"罰則","q":"気象庁以外の者が自ら行った気象の観測の成果を，気象庁長官の許可を得ずに<b>船舶又は航空機において受信されることを目的とした無線通信による発表業務を行った。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 罰則適用。船舶・航空機向けの無線通信による発表業務は許可制であり、無許可で行うと50万円以下の罰金が科されます。","pattern":"正しい罰則事例の確認","law":"気象業務法 第26条 第1項、同法 第46条 第7号","source":"past"},{"id":"49-14-b","round":49,"qNum":"14","choice":"b","tag":"罰則","q":"気象予報士が死亡したときに，その相続人が<b>その旨を気象庁長官に届け出ることを怠った。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 罰則適用 → 〇 罰則適用外。死亡等の届出義務違反について、気象業務法上に罰則（罰金等）の規定は存在しません。","pattern":"罰則の架空追加（義務違反＝罰則という思い込み）","law":"気象業務法 第7章（第44条〜第50条）","source":"past"},{"id":"49-14-a","round":49,"qNum":"14","choice":"a","tag":"罰則","q":"地方公共団体が気象庁に届出をして使用している雨量計を，通行人が<b>正当な理由がないのに壊した。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 罰則適用。技術上の基準に従う観測の気象測器を正当な理由なく壊す行為には、3年以下の拘禁刑又は100万円以下の罰金が科されます。","pattern":"正しい罰則事例の確認","law":"気象業務法 第37条、同法 第44条","source":"past"},{"id":"49-13-c","round":49,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士となる資格を有し，気象業務法が規定する欠格事由に該当しない者が気象予報士名簿への登録を申請するとき，<b>気象予報士試験に合格してから登録するまでの期間の長さおよび年齢には制約はない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 制約なし。気象予報士試験合格から登録までの期間制限や年齢制限は法律に規定されていません。","pattern":"正しい法定事項の確認（架空の制限がないことの確認）","law":"気象業務法 第24条の4、同法 第24条の20","source":"past"},{"id":"49-13-b","round":49,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士が予報業務の許可を受けた事業者の下で現象の予想を含む予報業務に従事するときには，<b>気象予報士は予め気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士が届け出る → 〇 届け出不要（事業者が申請時に記載）。気象予報士本人が従事する際に自ら届け出る義務は法律上存在しません。","pattern":"義務の架空追加（主体と義務のすり替え）","law":"気象業務法施行規則 第10条 第2項 第2号","source":"past"},{"id":"49-13-a","round":49,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士が気象業務法の規定により罰金以上の刑に処せられたときには，その気象予報士の登録は抹消され，<b>その後 3 年間は再び登録を受けることができない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 3年間 → 〇 2年間。罰金以上の刑に処せられたことによる欠格期間（再び登録できない期間）は、刑の執行終了等から2年間です。","pattern":"数字の引っかけ（欠格期間）","law":"気象業務法 第24条の21 第1号、同法 第24条の25 第1項 第2号","source":"past"},{"id":"49-12-d","round":49,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務の許可を受けている者が、<b>利用者に予報事項を迅速に伝達するための施設</b>を変更する場合は、気象庁長官に報告書を提出しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 報告書提出 → 〇 提出不要。利用者に伝達するための施設はそもそも法定の記載事項に含まれておらず、変更時の報告義務はありません。","pattern":"法定事項の架空追加（不要な報告）","law":"気象業務法施行規則 第10条 第2項","source":"past"},{"id":"49-12-c","round":49,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けている者が、<b>現象の予想の方法</b>を変更する場合は、気象庁長官に報告書を提出しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告義務あり。現象の予想の方法は予報業務計画書の記載事項であり、変更の30日前までに報告書の提出が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号、第10条 第2項 第1号 ニ","source":"past"},{"id":"49-12-b","round":49,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けている者が、<b>予報業務を行う事業所の所在地</b>を変更する場合は、気象庁長官に報告書を提出しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告義務あり。事業所の所在地は予報業務計画書の記載事項であり、変更があった場合は遅滞なく報告書の提出が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第1号 イ","source":"past"},{"id":"49-12-a","round":49,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けている者が、<b>予報の対象区域</b>を変更する場合は、気象庁長官に報告書を提出しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 事後の報告書提出 → 〇 事前の認可。対象区域は「予報業務の範囲」に含まれ、変更には気象庁長官の認可が必要です。","pattern":"報告と認可のすり替え","law":"気象業務法 第19条 第1項、気象業務法施行規則 第10条 第1項 第3号 ロ","source":"past"},{"id":"48-15-c","round":48,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"災害が発生するおそれがある異常な現象を発見した者は，遅滞なく，その旨を<b>市町村長又は警察官若しくは気象台長に通報しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象台長 → 〇 海上保安官。災害対策基本法上の通報先は「市町村長」「警察官」「海上保安官」であり、「気象台長」は含まれません。","pattern":"名詞のすり替え（通報先）","law":"災害対策基本法 第54条 第1項","source":"past"},{"id":"48-15-b","round":48,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"非常災害が発生した場合において，当該災害の規模その他の状況により当該災害に係る災害応急対策を推進するため特別の必要があると認めるときは，<b>内閣総理大臣は，臨時に内閣府に非常災害対策本部を設置することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 設置できる。内閣総理大臣は、特別の必要があると認めるときは内閣府に非常災害対策本部を設置することができます。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第24条 第1項","source":"past"},{"id":"48-15-a","round":48,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"都道府県の地域について災害が発生した場合において，防災の推進を図るため必要があると認めるときは，都道府県知事は，<b>都道府県地域防災計画の定めるところにより，災害対策本部を設置することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 設置できる。都道府県知事は、必要があると認めるときは都道府県災害対策本部を設置することができます。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第23条 第1項","source":"past"},{"id":"48-14-e","round":48,"qNum":"14","choice":"e","tag":"定義","q":"「警報」とは，<b>重大な災害の起るおそれのある旨を警告して行う予報</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。「警報」は重大な災害の起こるおそれのある旨を警告して行う予報と法的に定義されています。","pattern":"正しい法定事項の確認（定義）","law":"気象業務法 第2条 第7項","source":"past"},{"id":"48-14-d","round":48,"qNum":"14","choice":"d","tag":"定義","q":"「予報」とは，<b>観測の成果に基く現象の予測</b>をいう。","a":"×","lawChanged":false,"explanation":"【対比】× 現象の予測 → 〇 現象の予想の発表。心の中で予測（予想）しただけではダメで、「発表」して初めて「予報」になります。","pattern":"用語のすり替え・要素の欠落（発表の有無）","law":"気象業務法 第2条 第6項","source":"past"},{"id":"48-14-c","round":48,"qNum":"14","choice":"c","tag":"定義","q":"「観測」とは，<b>自然科学的方法による現象の観察及び測定</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。「観測」は自然科学的方法による現象の観察・測定と法的に定義されています。","pattern":"正しい法定事項の確認（定義）","law":"気象業務法 第2条 第5項","source":"past"},{"id":"48-14-b","round":48,"qNum":"14","choice":"b","tag":"定義","q":"「水象」とは，<b>気象又は地震に密接に関連する</b>陸水及び海洋の諸現象をいう。","a":"×","lawChanged":true,"explanation":"【対比】× 気象又は地震 → 〇 気象、地震又は火山現象。水象の定義には「火山現象」に密接に関連する諸現象も含まれます（火山現象は2023年法改正で追加）。","pattern":"要素の欠落","law":"気象業務法 第2条 第3項","source":"past"},{"id":"48-14-a","round":48,"qNum":"14","choice":"a","tag":"定義","q":"「気象」とは，<b>大気(電離層を除く。)の諸現象</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。「気象」は大気（電離層を除く）の諸現象と法的に定義されています。","pattern":"正しい法定事項の確認（定義）","law":"気象業務法 第2条 第1項","source":"past"},{"id":"48-13-c","round":48,"qNum":"13","choice":"c","tag":"気象予報士","q":"<b>気象予報士が交通事故を起こして罰金以上の刑に処せられたときには，気象予報士の登録は抹消される。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 交通事故の罰金で抹消 → 〇 抹消されない。登録抹消事由の罰金刑は「気象業務法」に違反した場合に限られ、刑法や道交法による罰金は該当しません。","pattern":"条件のすり替え（他法令の罰金）","law":"気象業務法 第24条の25 第1項 第2号、同法 第24条の21 第1号","source":"past"},{"id":"48-13-b","round":48,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士が死亡したとき，<b>その相続人は，遅滞なく，その旨を気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出義務あり。気象予報士が死亡した場合は、その相続人が遅滞なく気象庁長官に届け出る義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の25 第2項","source":"past"},{"id":"48-13-a","round":48,"qNum":"13","choice":"a","tag":"気象予報士","q":"他の者の行う予報業務に，その者が予報業務の許可を受けていないことを知らずに従事していたときは，<b>気象予報士の登録は抹消されない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 抹消事由ではない。無許可の予報業務に知らずに従事したことは、気象予報士の登録抹消の法定事由には規定されていません。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の25 第1項","source":"past"},{"id":"48-12-c","round":48,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務に必要な観測資料やその他の予報資料の収集施設を変更するときには，<b>気象庁長官の許可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 許可（認可）を受ける → 〇 遅滞なく報告。観測施設や収集施設は法定の記載事項であり、変更があった場合は遅滞なく「報告書を提出」しなければなりません。","pattern":"用語の混同（許可と報告）","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第5号 イ","source":"past"},{"id":"48-12-b","round":48,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"ある県の気象の予報業務の許可を受けている者が，新たに同県内の桜の開花予想を行う場合は，<b>予報業務の範囲の変更について気象庁長官の認可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 範囲の変更として認可が必要 → 〇 気象ではないので許可不要。桜の開花は植物の現象であり「気象」に該当しないため、そもそも予報業務の対象外（認可不要）です。","pattern":"定義のすり替え（気象以外の現象）","law":"気象業務法 第2条 第1項、同法 第17条 第1項","source":"past"},{"id":"48-12-a","round":48,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"小売業者との契約により当該業者の商品仕入れに用いるための気象の予報を提供する業務について許可を受けている者が，新たに一般に発表する気象の予報をインターネットで提供する業務を開始しようとする場合は，<b>気象庁長官の認可を受けなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 認可が必要。特定向け（小売業者等）から一般向けへの変更は予報業務の「目的」の変更に該当し、気象庁長官の認可が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法 第19条 第1項","source":"past"},{"id":"47-15-c","round":47,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"市町村長は，災害が発生し又は発生するおそれのある場合において，急を要すると認めるとき，<b>地域の居住者，滞在者等に対して避難のための立退きを指示することができる。</b>","a":"〇","lawChanged":true,"explanation":"【対比】〇 指示できる。市町村長は、災害から保護するため特に必要があると認めるときは、居住者等に対して避難のための立退きを指示することができます（法改正で「勧告」は廃止され「指示」に一本化）。","pattern":"法改正（避難勧告の廃止）","law":"災害対策基本法 第60条 第1項","source":"past"},{"id":"47-15-b","round":47,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"都道府県知事は，気象庁から災害に関する警報の通知を受けたときには，法令又は地域防災計画の定めるところにより予想される災害の事態及びこれに対しとるべき措置について，<b>市町村長等の関係者に対して，必要な通知又は要請をするものとされている。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 通知や要請を行う。都道府県知事は、警報通知を受けた際に、関係機関や市町村長等に対して必要な通知又は要請を行うと定められています。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第55条","source":"past"},{"id":"47-15-a","round":47,"qNum":"15","choice":"a","tag":"予報と警報","q":"日本放送協会の機関は，気象庁から気象，地象，津波，高潮，波浪及び洪水の警報の事項を通知されたときには，<b>通知された事項の放送をしなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 放送の義務。NHK（日本放送協会）は、気象庁から警報事項の通知を受けたときは、直ちに放送しなければならない（絶対の義務）と規定されています。","pattern":"正しい法定事項の確認","law":"気象業務法 第15条 第6項","source":"past"},{"id":"47-14-d","round":47,"qNum":"14","choice":"d","tag":"気象測器の検定","q":"気象庁長官に対して気象観測の成果を報告しなければならない船舶に備え付ける気圧計は，<b>登録検定機関の検定に合格したものでなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 検定合格が必要。成果の報告義務がある船舶での観測に用いる指定測器（気圧計等）は、検定に合格したものでなければなりません。","pattern":"正しい法定事項の確認","law":"気象業務法 第9条 第1項、同法 別表","source":"past"},{"id":"47-14-c","round":47,"qNum":"14","choice":"c","tag":"気象観測","q":"気象庁長官は，気象の観測施設の設置の届出をした者に対し，<b>観測成果の報告を求めることができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告を求め得る。気象庁長官は、観測網確立のために必要があると認めるときは、届出者に対して観測成果の報告を求めることができます。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第4項","source":"past"},{"id":"47-14-b","round":47,"qNum":"14","choice":"b","tag":"気象観測","q":"遊園地を所有する法人が園内の展望タワーに風の観測施設を設置し，観測値を同園のホームページで公表する場合，この法人は風の観測施設の設置について<b>気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出が必要。「成果を発表するための気象の観測」に該当し技術基準に従う義務があるため、施設を設置したときは気象庁長官への届出が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第2項 第1号、同条 第3項","source":"past"},{"id":"47-14-a","round":47,"qNum":"14","choice":"a","tag":"気象観測","q":"鉄道事業者が列車の安全な運行に利用するために降水量の観測施設を設置する場合は，<b>国土交通省令で定める技術上の基準に従って観測を行わなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 基準に従う。「災害の防止に利用するための気象の観測」に該当するため、法定の技術上の基準に従って観測を行う義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第2項 第2号","source":"past"},{"id":"47-13-c","round":47,"qNum":"13","choice":"c","tag":"予報業務の許可","q":"複数の気象予報士の配置が規定されている事業所において規定数の気象予報士から1名が欠員となった場合には，<b>二週間以内</b>に，同項の規定に適合させるため必要な措置をとらなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 2週間以内。規定人数を満たさなくなった場合、2週間以内に人員補充等の必要な措置をとらなければなりません。","pattern":"正しい法定事項の確認（猶予期間）","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"47-13-b","round":47,"qNum":"13","choice":"b","tag":"気象予報士","q":"事業所において現象の予想に携わる気象予報士は，<b>気象庁長官から発行された気象予報士登録通知書を事業所の見やすい場所に掲示しておかなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 登録証を掲示する → 〇 掲示義務なし。気象予報士の登録通知書（登録証）を事業所に掲示する法定の義務は存在しません。","pattern":"法定事項の架空追加（他の資格のルールの混同）","law":"気象業務法および同法施行規則（該当なし）","source":"past"},{"id":"47-13-a","round":47,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"同じ予報業務許可事業者の複数の事業所に国土交通省令で定められている人数の気象予報士がそれぞれ配置されているとき，緊急の必要が生じた場合には，<b>各気象予報士は配置されている事業所とは別の事業所の気象予報士の職務に従事することができる。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 別事業所と兼任できる → 〇 兼任不可（専任が必要）。気象予報士は事業所ごとに「専任」で配置しなければならず、緊急時であっても他事業所との兼任は認められません。","pattern":"原則と例外の引っかけ（架空の例外規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"47-12-c","round":47,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務計画書に記載した気象庁の警報事項を受ける方法に変更が生じたときは，その旨を記載した報告書を<b>気象庁長官に提出しなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告書を提出。警報事項を受ける方法などは予報業務計画書の記載事項であり、変更があった場合は遅滞なく報告書を提出します。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第1号 ホ","source":"past"},{"id":"47-12-b","round":47,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"当該予報業務の一部を休止しようとする場合は，<b>気象庁長官の認可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 事前の認可 → 〇 事後の届出（30日以内）。予報業務の休止・廃止は事前の認可・許可は不要で、事後の届出で足ります。","pattern":"認可と届出のすり替え、事前事後のすり替え","law":"気象業務法 第22条","source":"past"},{"id":"47-12-a","round":47,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"許可を受けた区域とは別の区域を対象に予報業務を行おうとする場合は，改めて<b>気象庁長官の認可を受けなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 認可が必要。対象区域は「予報業務の範囲」であり、その変更には気象庁長官の認可が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法 第19条 第1項、気象業務法施行規則 第10条 第1項 第3号 ロ","source":"past"},{"id":"46-15-c","round":46,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"市町村が災害のためその全部又は大部分の事務を行うことができなくなり，市町村長が避難のための立退きの勧告あるいは指示をできなくなったときは，当該市町村長に代わって<b>都道府県知事がそれを実施しなければならない。</b>","a":"〇","lawChanged":true,"explanation":"【対比】〇 都道府県知事が代行する。市町村長が事務不能になった場合、都道府県知事が避難指示等を代行します。（※法改正により「勧告」は廃止され「指示」に一本化されましたが、知事が代行する規定自体は現在も正しいです）","pattern":"法改正（避難勧告の廃止）＋正しい法定事項の確認（知事の代行）","law":"災害対策基本法 第60条 第6項","source":"past"},{"id":"46-15-b","round":46,"qNum":"15","choice":"b","tag":"水防法","q":"洪水，津波又は高潮により国民経済上重大な損害または相当な損害を生ずるおそれがあるとして指定された河川，湖沼又は海岸については，<b>都道府県知事が水防警報をしなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 都道府県知事がする → 〇 国土交通大臣がする。「重大な損害」を生ずるおそれがある指定河川等の水防警報は、都道府県知事ではなく国土交通大臣が行います。","pattern":"主語のすり替え（権限主体の混同）","law":"水防法 第16条 第1項","source":"past"},{"id":"46-15-a","round":46,"qNum":"15","choice":"a","tag":"消防法","q":"気象庁長官，気象台長又は測候所長が，気象の状況が火災予防上危険であると認め，その状況を都道府県知事に通報し，この通報を市町村長が知事から受けたとき，<b>市町村長は火災に関する警報を発することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 発することができる（任意）。火災に関する気象状況の通報を受けた市町村長は、火災に関する警報を発することができます。","pattern":"正しい法定事項の確認","law":"消防法 第22条 第1項から第3項","source":"past"},{"id":"46-14-c","round":46,"qNum":"14","choice":"c","tag":"気象業務法の目的","q":"気象業務法は，気象業務に関する<b>国際的協力</b>を行うことを目的とする。","a":"〇","lawChanged":false,"explanation":"【対比】〇 法第1条の目的。気象業務に関する国際的協力を行うことも、気象業務法の重要な目的の一つです。","pattern":"正しい法定事項の確認（目的条文）","law":"気象業務法 第1条","source":"past"},{"id":"46-14-b","round":46,"qNum":"14","choice":"b","tag":"気象業務法の目的","q":"気象業務法は，気象業務に関する基本的制度を定めることによって，気象業務の健全な発達を図り，もって<b>産業の興隆等公共の福祉の増進</b>に寄与することを目的とする。","a":"〇","lawChanged":false,"explanation":"【対比】〇 法第1条の目的。産業の興隆等公共の福祉の増進は気象業務法の重要な目的です。","pattern":"正しい法定事項の確認（目的条文）","law":"気象業務法 第1条","source":"past"},{"id":"46-14-a","round":46,"qNum":"14","choice":"a","tag":"気象業務法の目的","q":"気象業務法は，気象業務に関する基本的制度を定めることによって，気象業務の健全な発達を図り，もって災害の予防，<b>交通の安全の確保</b>に寄与することを目的とする。","a":"〇","lawChanged":false,"explanation":"【対比】〇 法第1条の目的。災害の予防、交通の安全の確保は気象業務法の重要な目的です。","pattern":"正しい法定事項の確認（目的条文）","law":"気象業務法 第1条","source":"past"},{"id":"46-13-d","round":46,"qNum":"13","choice":"d","tag":"気象予報士","q":"気象予報士は，その氏名または住所に変更があったときは，<b>遅滞なくその旨を気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出義務あり。氏名や住所は法定の登録事項であり、変更があった場合は遅滞なく届け出る義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の24、気象業務法施行規則 第34条 第1項","source":"past"},{"id":"46-13-c","round":46,"qNum":"13","choice":"c","tag":"気象予報士","q":"予報業務の許可を受けた事業者が，自らが行った現象の予想に基づき利用者に予報を行う場合，その予報の<b>解説を行う者は，気象予報士でなくてもよい。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 気象予報士でなくてもよい。「現象の予想」は気象予報士が行う必要がありますが、発表された予報の「解説」は誰が行っても構いません。","pattern":"正しい法定事項の確認（資格不要な行為）","law":"気象業務法 第19条の2","source":"past"},{"id":"46-13-b","round":46,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けた事業者は，予報業務を行う事業所に専任の気象予報士を複数配置している場合，そのうちの1名に欠員が生じたときは，<b>直ちに予報業務を停止しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 直ちに停止 → 〇 2週間以内に措置をとる。規定人数を満たさなくなった場合でも直ちに停止する義務はなく、2週間以内に人員補充等を行えば足ります。","pattern":"原則と例外の引っかけ（過剰なペナルティ）","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"46-13-a","round":46,"qNum":"13","choice":"a","tag":"気象予報士","q":"予報業務の許可を受けた事業者の下で予報業務に従事しようとするとき，気象予報士は，<b>その旨を気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士本人が届け出る → 〇 届け出不要（事業者が手続する）。気象予報士本人が従事する際に自ら気象庁に届け出る法定の義務はありません。","pattern":"義務の架空追加（主体と義務のすり替え）","law":"気象業務法施行規則 第10条 第2項 第2号等","source":"past"},{"id":"46-12-d","round":46,"qNum":"12","choice":"d","tag":"予報業務の記録","q":"記録は，<b>2年間保存</b>しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 2年間保存。作成した予報業務の記録は、2年間保存する義務があります。","pattern":"正しい法定事項の確認（保存期間）","law":"気象業務法施行規則 第12条の2","source":"past"},{"id":"46-12-c","round":46,"qNum":"12","choice":"c","tag":"予報業務の記録","q":"記録は，<b>現象の予想を担当した気象予報士が行わなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士が行う → 〇 許可を受けた者（事業者）が行う。記録・保存の義務を負うのは事業者であり、気象予報士本人ではありません。","pattern":"義務の架空追加（主体と義務のすり替え）","law":"気象業務法施行規則 第12条の2","source":"past"},{"id":"46-12-b","round":46,"qNum":"12","choice":"b","tag":"予報業務の記録","q":"気象庁の警報事項の利用者への伝達の状況 (当該許可を受けた予報業務の目的及び範囲に係るものに限る )を<b>記録しなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 記録義務あり。警報事項の伝達状況についても記録義務が規定されています。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第12条の2 第3号","source":"past"},{"id":"46-12-a","round":46,"qNum":"12","choice":"a","tag":"予報業務の記録","q":"予報事項の内容と発表時刻を<b>記録しなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 記録義務あり。予報業務を行った場合、事業所ごとに予報内容と発表時刻を記録する義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第12条の2 第1号","source":"past"},{"id":"45-15-c","round":45,"qNum":"15","choice":"c","tag":"予報と警報","q":"気象庁は，特別警報をする場合は，<b>報道機関の協力を求めて，公衆に周知させるように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 周知の努力義務。特別警報を発表した場合は、報道機関の協力を求めて公衆に周知する努力義務が気象庁に課されています。","pattern":"正しい法定事項の確認","law":"気象業務法 第13条の2 第5項、同法 第13条 第3項","source":"past"},{"id":"45-15-b","round":45,"qNum":"15","choice":"b","tag":"予報と警報","q":"特別警報の基準を定めようとするときは，気象庁は，<b>あらかじめ関係都道府県知事の意見を聴かなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 意見聴取義務あり。特別警報の基準設定時には、関係都道府県知事の意見を聴取することが法的に義務付けられています。","pattern":"正しい法定事項の確認","law":"気象業務法 第13条の2 第2項","source":"past"},{"id":"45-15-a","round":45,"qNum":"15","choice":"a","tag":"予報と警報","q":"気象，地象，津波，高潮及び波浪についての特別警報のうち，気象特別警報の種類は，気象についての警報と同じく，<b>暴風，暴風雪，大雨，大雪の四種である。</b>","a":"〇","lawChanged":false,"explanation":"特別警報・気象警報ともに暴風雨、暴風雪、大雨、大雪等に関する警報の4つである。通常の警報には「洪水警報」が存在しますが、特別警報には「洪水特別警報」という独立した区分はなく、大規模な洪水が予想される場合は、原因となる「大雨特別警報」などで対応する形になります","pattern":"用語のすり替え（暴風と暴風雨）と限定の引っかけ","law":"気象業務法施行令 第5条、同令 第4条 第1項","source":"past"},{"id":"45-14-d","round":45,"qNum":"14","choice":"d","tag":"予報と警報","q":"気象の予報業務の許可を受けた者は，当該予報業務の目的及び範囲に係る気象庁の警報事項を，<b>その範囲内にある市町村長に迅速に伝達しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 市町村長に伝達しなければならない → 〇 利用者に伝達するよう努めなければならない。予報業務許可事業者の伝達先は「利用者」であり、かつ「努力義務」です。","pattern":"対象者のすり替え＋義務と努力義務のすり替え","law":"気象業務法 第20条","source":"past"},{"id":"45-14-c","round":45,"qNum":"14","choice":"c","tag":"予報と警報","q":"警報事項の通知を受けた海上保安庁の機関は，直ちにその通知された事項を航海中及び入港中の船舶に<b>周知させるように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 努力義務である。海上保安庁から船舶への周知は「努めなければならない（努力義務）」と規定されています。","pattern":"正しい法定事項の確認（努力義務）","law":"気象業務法 第15条 第5項","source":"past"},{"id":"45-14-b","round":45,"qNum":"14","choice":"b","tag":"予報と警報","q":"警報事項の通知を受けた国土交通省の機関は，直ちにその通知された事項を航行中の航空機に<b>周知させなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 周知させなければならない（義務） → 〇 周知させるように努めなければならない（努力義務）。国交省から航空機への周知は努力義務です。","pattern":"義務と努力義務のすり替え","law":"気象業務法 第15条 第4項","source":"past"},{"id":"45-14-a","round":45,"qNum":"14","choice":"a","tag":"予報と警報","q":"警報事項の通知を受けた東日本電信電話株式会社及び西日本電信電話株式会社の機関は，直ちにその通知された事項を関係市町村長に<b>通知しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 通知しなければならない（義務） → 〇 通知するように努めなければならない（努力義務）。NTT（電信電話株式会社）から市町村長への通知は努力義務です。","pattern":"義務と努力義務のすり替え","law":"気象業務法 第15条 第2項","source":"past"},{"id":"45-13-c","round":45,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士は，<b>登録から10年後に登録の更新手続きをしなかったとき</b>には，その登録を抹消される。","a":"×","lawChanged":false,"explanation":"気象業務法において、気象予報士の登録には有効期限や更新手続きの制度は存在しません。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の25 第1項","source":"past"},{"id":"45-13-b","round":45,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士が，<b>気象業務法の規定により罰金以上の刑に処せられたとき</b>には，その登録を抹消される。","a":"〇","lawChanged":false,"explanation":"【対比】〇 登録抹消される。気象業務法違反による罰金以上の刑の確定は、法定の登録抹消事由（及び欠格事由）に該当します。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の25 第1項 第2号、同法 第24条の21 第1号","source":"past"},{"id":"45-13-a","round":45,"qNum":"13","choice":"a","tag":"気象予報士","q":"不正な手段により気象予報士試験に合格したために，試験の合格を取り消された者は，<b>以後最長 2年間は気象予報士試験を受けることができない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 最長2年間。不正等による合格取消者に対し、気象庁長官は情状により2年以内の期間、試験の受験を禁止することができます。","pattern":"正しい法定事項の確認（欠格期間）","law":"気象業務法 第24条の18 第3項","source":"past"},{"id":"45-12-d","round":45,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務許可申請書に添付する予報業務計画書には、<b>利用者へ自社の予報を伝達する方法</b>を記載しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 利用者へ伝達する方法 → 〇 記載不要。自社の予報を利用者に伝達する方法や施設は、予報業務許可申請の法定の記載事項ではありません。","pattern":"法定事項の架空追加","law":"気象業務法施行規則 第10条 第2項","source":"past"},{"id":"45-12-c","round":45,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務許可申請書に添付する予報業務計画書には、<b>現象の予想の方法</b>を記載しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 記載事項である。予報業務計画書の法定の記載事項として規定されています。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第10条 第2項 第1号 ニ","source":"past"},{"id":"45-12-b","round":45,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務許可申請書に添付する予報業務計画書には、<b>収集しようとする予報資料の内容及びその方法</b>を記載しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 記載事項である。予報業務計画書の法定の記載事項として規定されています。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第10条 第2項 第1号 ハ","source":"past"},{"id":"45-12-a","round":45,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務許可申請書に添付する予報業務計画書には、<b>気象庁の予報を受ける方法</b>を記載しなければならない。","a":"×","lawChanged":false,"explanation":"法令で義務付けられているのは、気象庁の「予報」を受ける方法ではなく、「警報事項」を受ける方法です。「予報」と「警報事項」は厳密に区別されています。","pattern":"正しい法定事項の確認","law":"気象業務法施行規則 第10条 第2項 第1号 ホ","source":"past"},{"id":"44-15-c","round":44,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"災害が発生し，または発生するおそれがあり，人の生命又は身体を災害から保護し，災害の拡大を防止するため特に必要があると認められる場合において，市町村長が必要な指示をすることができないと認めるときは，<b>警察官又は海上保安官は，必要と認める地域の居住者，滞在者等に対して避難のための立ち退きを指示することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 代行して指示できる。原則は市町村長の権限ですが、市町村長が指示できない等の状況下では、警察官や海上保安官が避難の立退きを指示することができます。","pattern":"正しい法定事項の確認（例外的な権限代行）","law":"災害対策基本法 第61条 第1項","source":"past"},{"id":"44-15-b","round":44,"qNum":"15","choice":"b","tag":"消防法","q":"気象庁長官，気象台長，または測候所長が，気象の状況が火災予防上危険であると認め，その状況を都道府県知事に通報し，この通報を市町村長が知事から受けたときには，<b>市町村長は火災に関する警報を発することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 発することができる（任意）。気象状況の通報の最終的な受け手である市町村長は、火災に関する警報を発する権限を持っています。","pattern":"正しい法定事項の確認","law":"消防法 第22条 第1項から第3項","source":"past"},{"id":"44-15-a","round":44,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"災害が発生するおそれがある異常な現象を発見した者は，遅滞なく，その旨を，<b>当地を管轄する気象庁の機関</b>に通報しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象庁の機関 → 〇 市町村長、警察官、海上保安官。災害対策基本法における異常現象の通報先はこれら3者に限定されており、気象庁は含まれません。","pattern":"名詞のすり替え（通報先）","law":"災害対策基本法 第54条 第1項","source":"past"},{"id":"44-14-c","round":44,"qNum":"14","choice":"c","tag":"気象測器の検定","q":"登録検定機関に対して検定を申請するときは，その手続きは<b>当該気象測器の製造者がしなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 製造者がする → 〇 誰が申請してもよい。検定の申請者を測器の「製造者」に限定する法律上の規定はありません。所有者や使用者でも申請可能です。","pattern":"対象者の不当な限定","law":"気象業務法 第28条 第1項","source":"past"},{"id":"44-14-b","round":44,"qNum":"14","choice":"b","tag":"気象測器の検定","q":"気象測器の検定の有効期間は，<b>測器の種類に関わらずすべて5年間である。</b>","a":"×","lawChanged":false,"explanation":"【対比】× すべて5年間 → 〇 測器の種類ごとに個別に定められている。一律に5年間と定めている規定はありません。","pattern":"例外のない断定（すべて〜である）","law":"気象業務法 第31条","source":"past"},{"id":"44-14-a","round":44,"qNum":"14","choice":"a","tag":"気象測器の検定","q":"気象庁以外の政府機関または地方公共団体が，<b>研究または教育のため</b>の気象の観測に使用する温度計，気圧計，雨量計は，<b>登録検定機関が行う検定に合格したものでなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 検定合格必須 → 〇 検定不要（適用除外）。研究・教育目的の観測は法定の「技術上の基準」に従う義務から除外されており、それに伴い検定済測器の使用義務も免除されます。","pattern":"原則と例外の引っかけ（目的による除外）","law":"気象業務法 第6条 第1項 第1号・第2号、同法 第9条 第1項","source":"past"},{"id":"44-13-c","round":44,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士が気象庁の予報とは異なる内容の現象の予想を独自に行い，利用者に対してこれを解説する場合には，<b>その予報を作成した気象予報士が解説しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 作成した本人が解説する → 〇 解説者は誰でもよい。「現象の予想」は気象予報士が行う必要がありますが、それを「解説」する人に制限はありません。","pattern":"義務の架空追加","law":"気象業務法 第19条の2","source":"past"},{"id":"44-13-b","round":44,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けた会社が一日あたり12時間の予想を行うときには，当該の事業所に三人以上の専任の気象予報士を置き，さらに<b>そのうちの一人は3年以上の業務経験を有する者でなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 業務経験3年以上が必要 → 〇 経験不問。1日12時間なら気象予報士は「3名以上」必要ですが、実務経験に関する法定の要件はありません。","pattern":"法定事項の架空追加（他の資格のルールの混同）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"44-13-a","round":44,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"都道府県知事が，水防法の規定により指定された河川について，気象庁長官と共同して洪水についての水防活動の利用に適合する予報及び警報を行うときには，当該都道府県知事は<b>規定された数の気象予報士を配置しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士を配置する → 〇 配置義務なし（適用除外）。都道府県知事や国土交通大臣が行う洪水予報等には、予報業務の許可や気象予報士の配置義務の規定は適用されません。","pattern":"原則と例外の引っかけ（適用除外規定）","law":"気象業務法 第14条の2 第6項","source":"past"},{"id":"44-12-e","round":44,"qNum":"12","choice":"e","tag":"予報業務の許可","q":"予報業務の許可を受けている者が現象の予想の方法を変更するときは、気象庁長官に対して，<b>改めて予報業務の許可を申請しなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 改めて許可を申請 → 〇 30日前までに報告書提出。予想の方法を変更するだけで許可を取り直す必要はありません。","pattern":"手続きの過大解釈","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"44-12-d","round":44,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務の許可を受けている者が現象の予想の方法を変更するときは、変更前と変更後の方法により，過去1年間の資料を用いて作成した予想の結果の比較資料を添付して，<b>気象庁長官に変更の承認を申請しなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 比較資料を添付し承認を申請 → 〇 30日前までに報告書提出。そのような過剰な手続きは現行法には規定されていません。","pattern":"法定事項の架空追加","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"44-12-c","round":44,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けている者が現象の予想の方法を変更するときは、変更しようとする日の30日前までに，<b>気象庁長官の認可を受けなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 事前の認可 → 〇 30日前までに報告書提出。以前は事前の「認可」が必要でしたが、規制緩和等の法改正により現在は事前の「報告書の提出」のみで足りるようになっています。","pattern":"法改正（陳腐化）＋用語の混同（認可と報告）","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"44-12-b","round":44,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けている者が現象の予想の方法を変更するときは、気象庁長官に対して，その旨を記載した報告書を<b>遅滞なく提出しなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 遅滞なく提出 → 〇 30日前までに提出。現象の予想の方法の変更は、施行規則第50条により「遅滞なく」ではなく「変更の予定日の30日前まで」に報告書を提出しなければなりません。 「遅滞なく」提出すべき報告事項は、氏名・住所の変更、役員や定款の変更、または業務改善命令を実施した場合などです。 なお、予報業務の「目的又は範囲」そのものを変更しようとする場合には、報告ではなく事前に「認可」を受ける必要があります","pattern":"法改正（陳腐化）＋期限の引っかけ","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"44-12-a","round":44,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けている者が現象の予想の方法を変更するときは、<b>3年毎に行う次回の予報業務許可の更新手続きにおいて，変更の手続きを行わなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 3年ごとの更新時 → 〇 30日前までに報告書提出。予報業務の許可に「3年毎の更新」という制度はありません。また現象の予想の方法の変更は、変更予定日の30日前までに報告書を提出するルールに法改正されています。","pattern":"法改正（陳腐化）＋法定事項の架空追加（架空の更新制度）","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"43-15-d","round":43,"qNum":"15","choice":"d","tag":"水防法","q":"この洪水予報に関する通知を受けた都道府県知事は，市町村における水防を十分に果すべき責任を有する市町村長および同等の責務を有する機関の責任者に，その通知に係る事項を<b>直ちに通知するよう努めなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 通知するよう努めなければならない（努力義務） → 〇 通知しなければならない（義務）。都道府県知事から水防管理者等への通知は絶対の「義務」です。","pattern":"義務と努力義務のすり替え","law":"水防法 第10条 第3項","source":"past"},{"id":"43-15-c","round":43,"qNum":"15","choice":"c","tag":"水防法","q":"この洪水予報では，指定された河川が氾濫したときに浸水が想定される区域をあらかじめ指定し，<b>浸水した場合に想定される水深を明らかにしておかなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 明らかにする。洪水浸水想定区域の指定時には、浸水した場合に想定される水深等の事項を明らかにしておくことが義務付けられています。","pattern":"正しい法定事項の確認","law":"水防法 第14条 第1項、同条 第3項","source":"past"},{"id":"43-15-b","round":43,"qNum":"15","choice":"b","tag":"水防法","q":"この洪水予報では，指定された河川が氾濫した後は，<b>水位若しくは流量に加え，必要に応じて浸水区域とその水深を示して</b>水防活動の利用に適合する予報及び警報をしなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 加え、必要に応じて〜 → 〇 又は〜。氾濫後は「水位若しくは流量『又は』氾濫により浸水する区域及びその水深」を示して予報・警報を行うと規定されており、両方必須ではありません。","pattern":"条件のすり替え（又は と 及び の混同）","law":"気象業務法 第14条の2 第2項、水防法 第10条 第2項","source":"past"},{"id":"43-15-a","round":43,"qNum":"15","choice":"a","tag":"水防法","q":"この洪水予報では，指定された河川で洪水のおそれがあるときは，<b>水位又は流量のいずれかを示して</b>水防活動の利用に適合する予報及び警報をしなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい記述。指定河川の洪水予報では、洪水のおそれがあるときは「水位又は流量」を示して予報及び警報を行わなければなりません。","pattern":"正しい法定事項の確認","law":"気象業務法 第14条の2 第2項、水防法 第10条 第2項","source":"past"},{"id":"43-14-c","round":43,"qNum":"14","choice":"c","tag":"気象観測","q":"河川の管理者が，住民に河川の状況を知らせるために河川の水位の観測施設を設置したときには，その旨を<b>気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 水位観測も届出が必要 → 〇 届出不要。河川の水位観測は「水象」の観測であり「気象」ではないため、気象業務法上の施設設置の届出義務はありません。","pattern":"定義のすり替え（気象と水象の混同）","law":"気象業務法 第2条 第3項、同法 第6条 第3項、気象業務法施行規則 第1条の2 第6号 ト","source":"past"},{"id":"43-14-b","round":43,"qNum":"14","choice":"b","tag":"気象観測","q":"鉄道会社が，横風による事故防止のために風の観測施設を設置したときは，その旨を<b>気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出が必要。「災害の防止に利用するための気象の観測」に該当し技術基準に従う義務があるため、施設を設置したときは気象庁長官への届出が必要です。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第2項 第2号、同条 第3項","source":"past"},{"id":"43-14-a","round":43,"qNum":"14","choice":"a","tag":"気象観測","q":"地方公共団体に属する教育機関が，<b>研究のため</b>に降水量の観測施設を設置したときは，その旨を<b>気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 届出が必要 → 〇 届出不要（適用除外）。「研究や教育のため」の観測は法定の技術基準に従う義務から除外されており、それに伴い観測施設の設置届出も不要です。","pattern":"原則と例外の引っかけ（目的による除外）","law":"気象業務法 第6条 第1項 第1号、同条 第3項","source":"past"},{"id":"43-13-d","round":43,"qNum":"13","choice":"d","tag":"気象予報士","q":"気象予報士は，気象の予報業務に従事するときには，<b>自らが遅滞なく気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士本人が届け出る → 〇 届け出不要（事業者が手続する）。気象予報士本人が予報業務に従事する際に、自ら気象庁に届け出る法定の義務はありません。","pattern":"義務の架空追加（主体と義務のすり替え）","law":"気象業務法施行規則 第10条 第2項 第2号","source":"past"},{"id":"43-13-c","round":43,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士は，その氏名または登録を受けた住所に変更があったときは，<b>遅滞なく気象庁長官に届け出なければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 届出義務あり。氏名や住所は法定の登録事項であり、変更があった場合は遅滞なく気象庁長官に届け出る義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第24条の24、気象業務法施行規則 第34条 第1項","source":"past"},{"id":"43-13-b","round":43,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象庁以外の者が行う予報業務に従事する気象予報士は，<b>その予報業務の対象地域に所在する事業所に配置されなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 対象地域に所在する事業所 → 〇 所在地の制限なし。気象予報士は「現象の予想を行う事業所」に配置されればよく、事業所の所在地が予報対象地域内である必要はありません。","pattern":"条件の架空追加","law":"気象業務法 第19条の2","source":"past"},{"id":"43-13-a","round":43,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士試験に合格した者は，<b>遅滞なく</b>気象庁長官に気象予報士の登録を申請しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 遅滞なく申請する → 〇 申請期限はない。気象予報士試験の合格後、登録申請をいつまでにしなければならないという期間制限（義務）はありません。","pattern":"義務の架空追加（架空の期限）","law":"気象業務法 第24条の20","source":"past"},{"id":"43-12-d","round":43,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"気象庁が発表する気温の予報を用いて，<b>熱中症に関する注意喚起等の情報を発表するときには，予報業務の許可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 情報の発表に許可が必要 → 〇 予想していないので許可不要。気象庁の予報をそのまま用いて注意喚起するだけなら、自ら現象の「予想」を行っていないため予報業務には該当しません。","pattern":"定義のすり替え（予想の有無）","law":"気象業務法 第2条 第6項","source":"past"},{"id":"43-12-c","round":43,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"レジャーや野外イベント等での利用を想定して，空間的・時間的にきめ細かな独自の局地天気予報を定期的に行うときには，<b>それが特定の旅行会社だけに提供する場合であっても，予報業務の許可を受けなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可が必要。提供先が特定の旅行会社のみ（特定向け）であっても、気象の予報業務を行う場合には許可が必要です。","pattern":"原則と例外の引っかけ（特定向けなら例外という誤認）","law":"気象業務法 第17条 第1項","source":"past"},{"id":"43-12-b","round":43,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"天気によって売れ行きが大きく変動する商品に関して，気象に関する専門知識に基づいて<b>最適な需要予測を作成し業界に広く提供するときには，予報業務の許可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 需要予測に許可が必要 → 〇 気象ではないので許可不要。商品の需要予測は「気象現象（大気の諸現象）」そのものの予想ではないため、予報業務には該当しません。","pattern":"定義のすり替え（気象以外の現象）","law":"気象業務法 第2条 第1項、同条 第6項、同法 第17条 第1項","source":"past"},{"id":"43-12-a","round":43,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"会社員が自社の屋外作業の計画を立てるために，気象庁から入手した資料を使って作業現場周辺のきめ細かな天気予報を行うときには，<b>予報業務の許可を受けなければならない。</b>","a":"×","lawChanged":false,"explanation":"気象庁以外の者が気象などの「予報の業務」を行おうとする場合には、気象庁長官の許可を受けなければならない（気象業務法第17条第1項）。 しかし、この「業務」とは、一般の利用に供するため、または特定の他者（例：特定の旅行会社など）に対して継続的に予報を提供することを指すため、会社員が自社の屋外作業の計画を立てるために行うなど、自社内での利用に限定される場合は、法に定める「業務」には該当しないため、予報業務の許可を受ける必要はありません。","pattern":"","law":"気象業務法 第2条 第6項、同法 第17条 第1項","source":"past"},{"id":"42-15-d","round":42,"qNum":"15","choice":"d","tag":"予報と警報","q":"都道府県知事が高潮予報を行うには，<b>気象庁長官の許可が必要である。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可が必要。地方公共団体（都道府県知事等）であっても「気象庁以外の者」に該当するため、高潮予報等の予報業務を行うには気象庁長官の許可が必須です。","pattern":"原則と例外の引っかけ（公的機関なら例外という誤認）","law":"気象業務法 第17条 第1項","source":"past"},{"id":"42-15-c","round":42,"qNum":"15","choice":"c","tag":"水防法","q":"水防警報は，洪水・津波のほか，<b>高潮によって災害が発生するおそれがあるときにも発表される。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 高潮でも発表される。水防警報は、洪水、津波又は高潮によって災害が発生するおそれがあるときに、水防を行う必要がある旨を警告して行われます。","pattern":"正しい法定事項の確認（適用範囲）","law":"水防法 第2条 第8項、同法 第16条 第1項","source":"past"},{"id":"42-15-b","round":42,"qNum":"15","choice":"b","tag":"予報と警報","q":"気象庁以外の者は，<b>高潮警報を発表してはならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 発表してはならない。気象庁以外の者が発表できる警報は政令で定める一部の「津波警報」等に限られ、高潮警報を発表することは法的に禁止されています。","pattern":"正しい法定事項の確認（禁止事項）","law":"気象業務法 第23条、気象業務法施行令 第10条","source":"past"},{"id":"42-15-a","round":42,"qNum":"15","choice":"a","tag":"予報と警報","q":"高潮のため河川の水位が上昇してはん濫などの重大な災害のおそれがある場合は，<b>高潮警報が発表される。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい記述。高潮（異常潮位）が原因で河口付近の河川水位が上昇し、氾濫のおそれがある場合の警報は「高潮警報」が発表されます（洪水警報ではありません）。","pattern":"正しい法定事項の確認（警報の対象現象）","law":"気象庁予報警報規程等","source":"past"},{"id":"42-14-d","round":42,"qNum":"14","choice":"d","tag":"罰則","q":"気象庁長官の命を受けて私人の所有地で観測を行おうとした気象庁職員に対して<b>土地への立ち入りを拒んだ所有者は処罰の対象となる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 処罰の対象。気象庁長官の権限に基づく観測のための私有地等への立ち入りを拒む行為には、30万円以下の罰金が科されます。","pattern":"正しい罰則事例の確認","law":"気象業務法 第38条 第1項、同法 第47条 第2号","source":"past"},{"id":"42-14-c","round":42,"qNum":"14","choice":"c","tag":"罰則","q":"気象予報士が死亡したときに，<b>その旨を気象庁長官に届け出ることを怠った相続人は処罰の対象となる。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 処罰の対象となる → 〇 対象とならない。死亡の届出義務はありますが、それを怠ったことに対する気象業務法上の罰則（罰金や懲役）規定はありません。","pattern":"罰則の架空追加（義務違反＝罰則という思い込み）","law":"気象業務法 第7章（第44条〜第50条）","source":"past"},{"id":"42-14-b","round":42,"qNum":"14","choice":"b","tag":"罰則","q":"予報許可を受けている事業者が，1年間の長期間にわたり予報業務の休止をするにあたって，<b>休止に先立ちその許可を気象庁長官に申請しなかったときには，その事業者は処罰の対象となる。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 事前の許可が必要で違反すると罰則 → 〇 事前の許可不要（事後届出）。予報業務の休止は事後の「届出」で足ります。また、届出を怠った場合も罰金等の対象ではなく過料（行政罰）の対象です。","pattern":"手続きのすり替えと罰則の架空追加","law":"気象業務法 第22条、同法 第50条 第1号","source":"past"},{"id":"42-14-a","round":42,"qNum":"14","choice":"a","tag":"罰則","q":"地方公共団体が気象庁に届け出をして使用している防災用の雨量計の設置位置を<b>正当な理由なく移した者は処罰の対象となる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 処罰の対象。技術上の基準に従う観測の気象測器を正当な理由なく移す行為には、3年以下の拘禁刑又は100万円以下の罰金が科されます。","pattern":"正しい罰則事例の確認","law":"気象業務法 第37条、同法 第44条","source":"past"},{"id":"42-13-d","round":42,"qNum":"13","choice":"d","tag":"予報業務の許可","q":"複数の気象予報士を配置しなければならない事業所の気象予報士の数が規定を満たさなくなったときには，<b>1か月</b>以内にこれを満たすように補充しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 1か月以内 → 〇 2週間以内。規定人数を満たさなくなった場合、「2週間以内」に人員補充等の必要な措置をとらなければなりません。","pattern":"数字の引っかけ（猶予期間）","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"42-13-c","round":42,"qNum":"13","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けた者は，現象の予想を行う事業所ごとに，1日当たりの現象の予想を行う時間に応じて専任の気象予報士を置かなければならない。予想を行う時間が16時間を超えるときには<b>4</b>名以上の専任の気象予報士を置かなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 4名以上。1日の予想時間が「16時間を超える」場合、専任の気象予報士は「4名」必要です。","pattern":"正しい法定事項の確認（人数の規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"42-13-b","round":42,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けた者は，現象の予想を行う事業所ごとに，1日当たりの現象の予想を行う時間に応じて専任の気象予報士を置かなければならない。予想を行う時間が8時間を超え16時間以下のときには<b>3</b>名以上の専任の気象予報士を置かなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 3名以上。1日の予想時間が「8時間を超え16時間以下」の場合、専任の気象予報士は「3名」必要です。","pattern":"正しい法定事項の確認（人数の規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"42-13-a","round":42,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けた者は，現象の予想を行う事業所ごとに，1日当たりの現象の予想を行う時間に応じて専任の気象予報士を置かなければならない。予想を行う時間が8時間以下のときには<b>1</b>名配置しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 1名 → 〇 2名。1日の予想時間が「8時間以下」の場合でも、専任の気象予報士は最低「2名」必要です（1名でよいとする規定はありません）。","pattern":"数字の引っかけ（人数の規定）","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"42-12-e","round":42,"qNum":"12","choice":"e","tag":"予報業務の許可","q":"予報業務の許可を受けている者がその予報業務の範囲を変更するときは、<b>気象庁長官に対して，改めて予報業務の許可を申請しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 改めて許可を申請 → 〇 認可を受ける。範囲を変更するだけで、予報業務の許可そのものを最初から取り直す（申請し直す）必要はありません。","pattern":"手続きの過大解釈","law":"気象業務法 第19条 第1項","source":"past"},{"id":"42-12-d","round":42,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務の許可を受けている者がその予報業務の範囲を変更するときは、<b>事前に，気象庁長官の変更の認可を受けなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 事前の認可が必要。予報業務の目的又は範囲を変更しようとするときは、事前に気象庁長官の認可を受けなければなりません。","pattern":"正しい法定事項の確認","law":"気象業務法 第19条 第1項","source":"past"},{"id":"42-12-c","round":42,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けている者がその予報業務の範囲を変更するときは、<b>過去1年間の予報実績を添付して，気象庁長官に変更の承認を申請しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 実績を添付して承認を申請 → 〇 認可を受ける。範囲の変更には「認可」が必要ですが、過去1年間の予報実績を添付して承認を申請するという法定の手続きは存在しません。","pattern":"法定事項の架空追加","law":"気象業務法 第19条 第1項","source":"past"},{"id":"42-12-b","round":42,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けている者がその予報業務の範囲を変更するときは、<b>変更しようとする日の30日前までに，その旨を気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 事前の届出 → 〇 事前の認可。予報業務の範囲の変更は、届出（ただ知らせるだけ）ではなく、気象庁長官の「認可（OKをもらうこと）」が必要です。","pattern":"用語の混同（認可と届出）","law":"気象業務法 第19条 第1項","source":"past"},{"id":"42-12-a","round":42,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けている者がその予報業務の範囲を変更するときは、<b>変更した日から30日以内に，その旨を気象庁長官に報告しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 事後の報告 → 〇 事前の認可。予報業務の範囲の変更は、事後報告ではなく気象庁長官の「認可」を受ける必要があります。","pattern":"用語の混同（認可と報告）、事前事後のすり替え","law":"気象業務法 第19条 第1項","source":"past"},{"id":"41-15-b","round":41,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"都道府県は，当該都道府県の地域に係る防災に関する<b>計画を作成し，及び法令に基づきこれを実施する</b>とともに，その区域内の市町村等が処理する防災に関する事務又は業務の実施を助け，かつ，その総合調整を行わなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい記述。都道府県は地域防災計画を作成・実施し、市町村等の業務の総合調整を行う責務を有します。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第4条 第1項","source":"past"},{"id":"41-15-a","round":41,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"国は，災害予防，災害応急対策及び災害復旧の<b>基本となるべき計画を作成し，及び法令に基づきこれを実施する</b>とともに，地方公共団体等が処理する防災に関する事務又は業務の実施の推進とその総合調整を行わなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい記述。国は防災の基本となるべき計画（防災基本計画）を作成し実施する責務を有します。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第3条 第2項","source":"past"},{"id":"41-14-d","round":41,"qNum":"14","choice":"d","tag":"予報と警報","q":"気象庁長官の許可を受けて予報業務を行っている者は，その予報業務の目的及び範囲に係る気象庁の警報事項を<b>当該予報業務の利用者に直ちに知らせなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 直ちに知らせなければならない（義務） → 〇 迅速に伝達するように努めなければならない（努力義務）。事業者から利用者への伝達は「努力義務」です。","pattern":"義務と努力義務のすり替え","law":"気象業務法 第20条","source":"past"},{"id":"41-14-c","round":41,"qNum":"14","choice":"c","tag":"予報と警報","q":"気象庁が行う「波浪注意報」とは，<b>風浪，うねり等によって災害が起きるおそれがある場合に，その旨を注意して行う予報</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。「波浪注意報」は、風浪・うねり等による災害のおそれを注意して行う予報と法的に定義されています。","pattern":"正しい法定事項の確認（定義）","law":"気象業務法施行令 第4条 第1項","source":"past"},{"id":"41-14-b","round":41,"qNum":"14","choice":"b","tag":"災害対策基本法","q":"市町村長は，災害に関する警報の通知を受けたときは，当該警報の対象とする区域内の居住者，滞在者その他の者に対し，<b>避難のための立退きを勧告しなければならない。</b>","a":"×","lawChanged":true,"explanation":"【対比】× 勧告しなければならない（義務） → 〇 指示することができる（任意）。避難勧告は法改正で廃止されました。また、避難指示は「義務」ではなく「任意」で行うものです。","pattern":"法改正（勧告廃止）＋義務と任意のすり替え","law":"災害対策基本法 第60条 第1項","source":"past"},{"id":"41-14-a","round":41,"qNum":"14","choice":"a","tag":"予報と警報","q":"気象警報は，新たな注意報又は警報により切り替えられるとき，又は解除されるときまで，<b>その内容が継続される。</b>", }

//----- DOM helpers -----
function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'style' && typeof v === 'object') {
        for (var sk in v) n.style[sk] = v[sk];
      } else if (k.indexOf('on') === 0) {
        n.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'html') {
        n.innerHTML = v;
      } else if (typeof v === 'boolean') {
        if (v) n.setAttribute(k, '');
      } else {
        n.setAttribute(k, v);
      }
    }
  }
  appendChildren(n, children);
  return n;
}
function appendChildren(parent, children) {
  if (children == null || children === false) return;
  if (Array.isArray(children)) {
    for (var i = 0; i < children.length; i++) appendChildren(parent, children[i]);
  } else if (typeof children === 'string' || typeof children === 'number') {
    parent.appendChild(document.createTextNode(String(children)));
  } else if (children instanceof Node) {
    parent.appendChild(children);
  }
}
function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }

//----- Utils -----
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// Render question text - handle 【...】 and <b>...</b>
function renderQText(text) {
  if (!text) return document.createDocumentFragment();
  var frag = document.createDocumentFragment();
  var re = /(【[^】]*】)|(<b>[^<]*<\/b>)/g;
  var last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    var content;
    if (m[1]) content = m[1].slice(1, -1);
    else content = m[2].slice(3, -4);
    frag.appendChild(el('span', {class: 'q-em'}, content));
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

//----- Stats -----
function getStats() {
  var total = ALL_Q.length;
  var attempted = Object.keys(state.history).length;
  var totalAttempts = 0, totalCorrect = 0;
  var wrongIds = {};
  var masteredIds = {};
  for (var qid in state.history) {
    var attempts = state.history[qid];
    totalAttempts += attempts.length;
    var correctCount = 0;
    var hasWrong = false;
    for (var i = 0; i < attempts.length; i++) {
      if (attempts[i].correct) correctCount++;
      else hasWrong = true;
    }
    totalCorrect += correctCount;
    if (hasWrong) wrongIds[qid] = true;
    var last3 = attempts.slice(-3);
    if (last3.length >= 2) {
      var allCorrect = true;
      for (var j = 0; j < last3.length; j++) if (!last3[j].correct) { allCorrect = false; break; }
      if (allCorrect) masteredIds[qid] = true;
    }
  }
  return {
    total: total, attempted: attempted,
    attemptedPct: total ? Math.round((attempted/total)*100) : 0,
    totalAttempts: totalAttempts, totalCorrect: totalCorrect,
    accuracy: totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : 0,
    wrongCount: Object.keys(wrongIds).length, wrongIds: wrongIds,
    masteredCount: Object.keys(masteredIds).length, masteredIds: masteredIds
  };
}

var modeSize = 10; // persisted across nav within session
function renderModes() {
  var stats = getStats();

  function start(pool, mode, title) {
    if (!pool || pool.length === 0) { alert('該当する問題がありません'); return; }
    var n = Math.min(modeSize, pool.length);
    var shuffled = shuffle(pool).slice(0, n);
    navigate('quiz', { pool: shuffled, mode: mode, title: title + '（' + n + '問）' });
  }

  // Size selector
  var sizeRow = el('div', { class: 'size-row' });
  [5, 10, 20, 30].forEach(function(n) {
    sizeRow.appendChild(el('button', {
      class: 'tap' + (modeSize === n ? ' active' : ''),
      onClick: function() { modeSize = n; render(); }
    }, String(n)));
  });

  // Mode buttons
  function modeBtn(opts) {
    var cls = 'mode-btn tap';
    if (opts.accent === 'crimson') cls += ' crimson';
    else if (opts.accent === 'ink-2') cls += ' ink-2';
    return el('button', {
      class: cls, disabled: opts.disabled,
      onClick: opts.disabled ? null : opts.onClick
    }, [
      el('span', { class: 'ico' }, opts.icon),
      el('div', { class: 'body' }, [
        el('div', { class: 'title' }, opts.title),
        el('div', { class: 'sub' }, opts.sub)
      ]),
      el('span', { class: 'arrow' }, '→')
    ]);
  }

  // Round picker
  var roundsSet = {};
  PAST_Q.forEach(function(q) { roundsSet[q.round] = true; });
  var rounds = Object.keys(roundsSet).map(Number).sort(function(a, b) { return b - a; });
  var roundGrid = el('div', { class: 'round-grid' });
  rounds.forEach(function(r) {
    roundGrid.appendChild(el('button', {
      class: 'tap',
      onClick: function() {
        var pool = ALL_Q.filter(function(q) { return q.round === r; });
        start(pool, 'round-' + r, '第' + r + '回');
      }
    }, String(r)));
  });

  // Tag picker
  var tagCounts = {};
  ALL_Q.forEach(function(q) { tagCounts[q.tag] = (tagCounts[q.tag] || 0) + 1; });
  var tags = Object.keys(tagCounts).sort(function(a, b) { return tagCounts[b] - tagCounts[a]; });
  var tagList = el('div', { class: 'tag-list' });
  tags.forEach(function(tag) {
    tagList.appendChild(el('button', {
      class: 'tap',
      onClick: function() {
        var pool = ALL_Q.filter(function(q) { return q.tag === tag; });
        start(pool, 'tag-' + tag, tag);
      }
    }, [
      el('span', { class: 'tag-bar', style: { background: tagColor(tag) } }),
      el('span', { class: 'tag-name' }, tag),
      el('span', { class: 'tag-count' }, tagCounts[tag] + '問')
    ]));
  });

  var body = el('div', { class: 'screen-body' }, [
    el('div', { class: 'size-card' }, [
      el('div', { class: 'label' }, '出題数'),
      sizeRow
    ]),
    modeBtn({
      icon: '⚂', title: 'ランダム', sub: '全' + ALL_Q.length + '問から' + modeSize + '問',
      onClick: function() { start(ALL_Q, 'random', 'ランダム'); }
    }),
    modeBtn({
      icon: '◆', title: '苦手だけ',
      sub: '間違えたことのある' + stats.wrongCount + '問から' + Math.min(modeSize, stats.wrongCount) + '問',
      disabled: stats.wrongCount === 0, accent: 'crimson',
      onClick: function() {
        var pool = ALL_Q.filter(function(q) { return stats.wrongIds[q.id]; });
        start(pool, 'wrong', '苦手');
      }
    }),
    modeBtn({
      icon: '○', title: '未挑戦',
      sub: '未挑戦の' + (stats.total - stats.attempted) + '問から' + Math.min(modeSize, stats.total - stats.attempted) + '問',
      disabled: stats.total - stats.attempted === 0,
      onClick: function() {
        var pool = ALL_Q.filter(function(q) { return !state.history[q.id]; });
        start(pool, 'unseen', '未挑戦');
      }
    }),
    modeBtn({
      icon: '★', title: '予想問題',
      sub: '新作' + PREDICTED_Q.length + '問から' + Math.min(modeSize, PREDICTED_Q.length) + '問',
      accent: 'ink-2',
      onClick: function() { start(PREDICTED_Q, 'predicted', '予想問題'); }
    }),
    modeBtn({
      icon: '☆', title: 'ブックマーク',
      sub: '★を付けた' + Object.keys(state.starred).length + '問',
      disabled: Object.keys(state.starred).length === 0,
      onClick: function() {
        var ids = Object.keys(state.starred);
        var pool = ids.map(function(id) {
          for (var i = 0; i < ALL_Q.length; i++) if (ALL_Q[i].id === id) return ALL_Q[i];
          return null;
        }).filter(function(q) { return q; });
        start(pool, 'starred', 'ブックマーク');
      }
    }),
    el('div', { style: { marginTop: '24px' } }, [
      el('div', { class: 'section-title', style: { margin: '0 0 8px' } }, '回別出題'),
      roundGrid
    ]),
    el('div', { style: { marginTop: '24px' } }, [
      el('div', { class: 'section-title', style: { margin: '0 0 8px' } }, 'テーマ別出題'),
      tagList
    ])
  ]);

  var wrap = el('div', { class: 'screen' });
  wrap.appendChild(header('演習モード', goHome));
  wrap.appendChild(body);
  return wrap;
}

var quizState = null;
// { pool, idx, answered, results, startTs, mode, title }

function renderQuiz() {
  if (!quizState || quizState.poolKey !== screenParams.pool) {
    quizState = {
      poolKey: screenParams.pool, // reference identity check
      pool: screenParams.pool,
      mode: screenParams.mode,
      title: screenParams.title,
      idx: 0,
      answered: null,
      results: [],
      startTs: Date.now()
    };
  }

  var qs = quizState;
  if (!qs.pool || qs.pool.length === 0) {
    return el('div', { style: { padding: '32px', textAlign: 'center' } }, [
      '問題がありません ',
      el('button', { class: 'tap', style: { textDecoration: 'underline' }, onClick: goHome }, '戻る')
    ]);
  }

  if (qs.idx >= qs.pool.length) {
    // Done - transition to result
    var correctCount = qs.results.filter(function(r) { return r.correct; }).length;
    var session = {
      ts: qs.startTs, mode: qs.mode, title: qs.title,
      total: qs.pool.length, correct: correctCount,
      durationSec: Math.round((Date.now() - qs.startTs) / 1000),
      questionIds: qs.pool.map(function(q) { return q.id; })
    };
    addSession(session);
    // switch to result screen
    setTimeout(function() {
      navigate('result', { session: session, results: qs.results.slice(), pool: qs.pool.slice() });
      quizState = null;
    }, 0);
    return el('div'); // placeholder
  }

  var q = qs.pool[qs.idx];

  // Header
  var hdr = el('div', { class: 'quiz-header' }, [
    el('div', { class: 'quiz-header-inner' }, [
      el('div', { class: 'quiz-bar' }, [
        el('button', {
          class: 'quiz-close tap',
          onClick: function() {
            if (confirm('演習を中断しますか？(回答済の進捗は保存されます)')) {
              quizState = null;
              goHome();
            }
          }
        }, svgClose()),
        el('div', { class: 'quiz-title-area' }, [
          el('div', { class: 'small' }, qs.title),
          el('div', { class: 'big' }, (qs.idx + 1) + ' / ' + qs.pool.length)
        ]),
        el('button', {
          class: 'quiz-star tap',
          onClick: function() { toggleStar(q.id); render(); },
          style: { color: state.starred[q.id] ? 'var(--gold)' : 'var(--paper)' }
        }, state.starred[q.id] ? '★' : '☆')
      ]),
      el('div', { class: 'quiz-progress' }, el('div', {
        style: { width: ((qs.idx + (qs.answered ? 1 : 0)) / qs.pool.length * 100) + '%' }
      }))
    ])
  ]);

  // Meta row
  var meta = el('div', { class: 'meta-row' }, [
    el('span', { class: 'seal', style: { background: tagColor(q.tag) } }, q.tag.slice(0, 1)),
    el('span', { class: 'meta-tag', style: { color: tagColor(q.tag) } }, q.tag),
    q.source === 'predicted' ? el('span', { class: 'badge predicted' }, '予想') : null,
    q.source === 'past' ? el('span', { class: 'badge id' }, '第' + q.round + '回 問' + q.qNum + q.choice) : null,
    q.lawChanged ? el('span', { class: 'badge changed' }, '法改正') : null
  ]);

  // Question text
  var qtext = el('div', { class: 'qtext' });
  qtext.appendChild(renderQText(q.q));

  // History indicator
  var hist = state.history[q.id] || [];
  var histEl = null;
  if (hist.length > 0) {
    var histChildren = [el('span', null, '過去の挑戦:')];
    var last5 = hist.slice(-5);
    for (var i = 0; i < last5.length; i++) {
      var h = last5[i];
      histChildren.push(el('span', { class: h.correct ? 'o' : 'x' }, h.correct ? '〇' : '×'));
    }
    if (hist.length > 5) histChildren.push(el('span', { class: 'mono' }, '+' + (hist.length - 5)));
    histEl = el('div', { class: 'history-row' }, histChildren);
  }

  // Body (qtext, hist, optional reveal)
  var body = el('div', { class: 'quiz-body' }, [meta, qtext, histEl]);

  if (qs.answered) {
    var correct = qs.answered === q.a;
    var revealBody = el('div', { class: 'reveal-body' });
    if (q.explanation) {
      revealBody.appendChild(el('div', null, [
        el('div', { class: 'reveal-label' }, '解説'),
        el('div', { class: 'reveal-text' }, q.explanation)
      ]));
    }
    if (q.pattern) {
      revealBody.appendChild(el('div', { class: 'reveal-inline' }, [
        el('div', { class: 'lbl' }, '引っかけ'),
        el('div', null, q.pattern)
      ]));
    }
    if (q.law) {
      revealBody.appendChild(el('div', { class: 'reveal-inline reveal-law' }, [
        el('div', { class: 'lbl' }, '根拠'),
        el('div', { class: 'text' }, q.law)
      ]));
    }
    body.appendChild(el('div', { class: 'reveal' }, [
      el('div', { class: 'reveal-banner ' + (correct ? 'correct' : 'wrong') }, [
        el('span', { class: 'big' }, correct ? '正解' : '誤答'),
        el('span', { class: 'sub' }, 'あなた:' + qs.answered + '　/　正答:' + q.a)
      ]),
      revealBody
    ]));
  }

  // Footer (answer buttons / next)
  var footer;
  if (!qs.answered) {
    footer = el('div', { class: 'quiz-footer' }, el('div', { class: 'answer-grid' }, [
      el('button', {
        class: 'answer-btn o tap',
        onClick: function() {
          qs.answered = '〇';
          var c = '〇' === q.a;
          recordAnswer(q.id, c);
          qs.results.push({ qid: q.id, correct: c, userAnswer: '〇' });
          render();
        }
      }, '〇 正しい'),
      el('button', {
        class: 'answer-btn x tap',
        onClick: function() {
          qs.answered = '×';
          var c = '×' === q.a;
          recordAnswer(q.id, c);
          qs.results.push({ qid: q.id, correct: c, userAnswer: '×' });
          render();
        }
      }, '× 誤り')
    ]));
  } else {
    var isLast = (qs.idx + 1 >= qs.pool.length);
    footer = el('div', { class: 'quiz-footer' }, el('button', {
      class: 'next-btn tap',
      onClick: function() {
        qs.idx += 1;
        qs.answered = null;
        window.scrollTo(0, 0);
        render();
      }
    }, [
      isLast ? '結果を見る' : '次の問題へ',
      el('span', { class: 'arrow' }, '→')
    ]));
  }

  var wrap = el('div', { class: 'quiz-root' });
  wrap.appendChild(hdr);
  wrap.appendChild(body);
  wrap.appendChild(footer);
  return wrap;
}

// RESULT

var resultShowAll = false;

function renderResult() {
  var sp = screenParams;
  var session = sp.session;
  var results = sp.results;
  var pool = sp.pool;

  var pct = Math.round((session.correct / session.total) * 100);
  var mm = Math.floor((session.durationSec || 0) / 60);
  var ss = (session.durationSec || 0) % 60;

  var hero = el('div', { class: 'result-hero' }, [
    el('div', { class: 'hero-bg' }, '結'),
    el('div', { class: 'hero-label' }, 'RESULT'),
    el('div', { class: 'hero-title', style: { fontSize: '24px' } }, session.title),
    el('div', { class: 'result-score' }, [
      el('span', { class: 'big' }, String(session.correct)),
      el('span', { class: 'total' }, ' / ' + session.total),
      el('div', { class: 'right' }, [
        el('div', { class: 'pct' }, [pct, el('span', { style: { fontSize: '14px', opacity: 0.6 } }, '%')]),
        el('div', { class: 'time' }, mm + ':' + pad(ss))
      ])
    ])
  ]);

  // Wrong-only or all
  var wrongResults = [];
  for (var i = 0; i < results.length; i++) {
    if (!results[i].correct) wrongResults.push({ r: results[i], q: pool[i], idx: i + 1 });
  }
  var allResults = results.map(function(r, i) { return { r: r, q: pool[i], idx: i + 1 }; });

  function makeItem(entry, showIdx) {
    var s = el('summary', null, [
      showIdx ? el('span', { class: 'item-num' }, String(entry.idx)) : null,
      el('span', { class: 'item-mark ' + (entry.r.correct ? 'o' : 'x') }, entry.r.correct ? '〇' : '×'),
      el('span', { class: 'item-tag', style: { color: tagColor(entry.q.tag) } }, entry.q.tag),
      el('span', { class: 'item-caret' }, '▼')
    ]);
    var bodyDiv = el('div', { class: 'item-body' });
    var qDiv = el('div', { class: 'q' });
    qDiv.appendChild(renderQText(entry.q.q));
    bodyDiv.appendChild(qDiv);
    bodyDiv.appendChild(el('div', { class: 'meta' }, [
      'あなた: ', el('strong', null, entry.r.userAnswer), ' / 正答: ', el('strong', null, entry.q.a)
    ]));
    if (entry.q.explanation) bodyDiv.appendChild(el('div', { class: 'meta' }, entry.q.explanation));
    if (entry.q.law) bodyDiv.appendChild(el('div', { class: 'law' }, entry.q.law));
    return el('details', { class: 'item' }, [s, bodyDiv]);
  }

  var listSection;
  if (wrongResults.length === 0) {
    listSection = el('div', { class: 'result-perfect' }, [
      el('div', { class: 'big' }, '全問正解'),
      el('div', { class: 'sub' }, 'お見事です')
    ]);
  } else if (resultShowAll) {
    var listDiv = el('div');
    allResults.forEach(function(e) { listDiv.appendChild(makeItem(e, true)); });
    listSection = el('div', null, [
      el('div', { class: 'result-section-head' }, [
        el('div', { class: 'title' }, '問題ごとの結果'),
        el('button', {
          class: 'tap',
          onClick: function() { resultShowAll = false; render(); }
        }, '誤答のみ')
      ]),
      listDiv
    ]);
  } else {
    var listDiv2 = el('div');
    wrongResults.forEach(function(e) { listDiv2.appendChild(makeItem(e, false)); });
    listSection = el('div', null, [
      el('div', { class: 'result-section-head' }, [
        el('div', { class: 'title' }, '間違えた問題（' + wrongResults.length + '問）'),
        el('button', {
          class: 'tap',
          onClick: function() { resultShowAll = true; render(); }
        }, 'すべて表示')
      ]),
      listDiv2
    ]);
  }

  var bodySection = el('div', { class: 'screen-body' }, listSection);
  var footer = el('div', {
    style: {
      borderTop: '1px solid var(--rule)', padding: '12px 16px 16px',
      paddingBottom: 'calc(16px + env(safe-area-inset-bottom))'
    }
  }, el('button', {
    class: 'next-btn tap',
    onClick: function() { resultShowAll = false; goHome(); }
  }, 'ホームに戻る'));

  var wrap = el('div', { class: 'screen', style: { paddingBottom: 0 } });
  wrap.appendChild(hero);
  wrap.appendChild(bodySection);
  wrap.appendChild(footer);
  return wrap;
}

var SUMMARY_THEMES_DATA = null; // populated from THEMES object embedded in page
var SUMMARY_TAB = 'themes'; // 'themes' | 'patterns'

//==============================
// SUMMARY (Theme index) - NEW RICH VERSION
//==============================
var summarySelTheme = null;

function renderSummary() {
  // Lazy-init summary theme data from the THEMES constant defined below
  if (!SUMMARY_THEMES_DATA) {
    SUMMARY_THEMES_DATA = typeof THEMES !== 'undefined' ? THEMES : null;
  }

  var wrap = el('div', { class: 'screen' });
  wrap.appendChild(header('テーマ別まとめ', goHome));

  var body = el('div', { class: 'screen-body' });

  // Tab row
  var tabRow = el('div', { class: 'sm-tab-row' }, [
    el('button', {
      class: 'sm-tab tap' + (SUMMARY_TAB === 'themes' ? ' active' : ''),
      onClick: function() { SUMMARY_TAB = 'themes'; render(); }
    }, 'テーマ別'),
    el('button', {
      class: 'sm-tab tap' + (SUMMARY_TAB === 'patterns' ? ' active' : ''),
      onClick: function() { SUMMARY_TAB = 'patterns'; render(); }
    }, '引っかけパターン')
  ]);
  body.appendChild(tabRow);

  if (SUMMARY_TAB === 'patterns') {
    body.appendChild(renderPatternsTab());
    wrap.appendChild(body);
    return wrap;
  }

  // Theme grid
  if (!SUMMARY_THEMES_DATA) {
    body.appendChild(el('div', { class: 'empty' }, 'データが読み込めませんでした'));
    wrap.appendChild(body);
    return wrap;
  }

  var themeNames = Object.keys(SUMMARY_THEMES_DATA);
  if (!summarySelTheme) summarySelTheme = themeNames[0];

  // Compute per-theme stats from questions
  var themeStats = {};
  ALL_Q.forEach(function(q) {
    if (!themeStats[q.tag]) themeStats[q.tag] = { total: 0, attempted: 0 };
    themeStats[q.tag].total++;
    if (state.history[q.id]) themeStats[q.tag].attempted++;
  });

  var grid = el('div', { class: 'sm-theme-grid' });
  themeNames.forEach(function(name) {
    var t = SUMMARY_THEMES_DATA[name];
    var stats = themeStats[name] || { total: 0, attempted: 0 };
    var isSel = (summarySelTheme === name);
    var btn = el('button', {
      class: 'sm-tc tap' + (isSel ? ' sel' : ''),
      style: isSel ? { borderColor: t.color || 'var(--ink)' } : {}
    }, [
      el('div', { class: 'sm-tc-name' }, (t.icon || '') + ' ' + name),
      el('div', { class: 'sm-tc-desc' }, t.desc ? t.desc.slice(0, 40) + '…' : ''),
      el('span', { class: 'sm-tc-badge' }, stats.total + '問')
    ]);
    btn.addEventListener('click', function() {
      summarySelTheme = name;
      render();
    });
    grid.appendChild(btn);
  });
  body.appendChild(grid);

  // Detail panel
  if (summarySelTheme && SUMMARY_THEMES_DATA[summarySelTheme]) {
    body.appendChild(renderThemeDetail(summarySelTheme));
  }

  wrap.appendChild(body);
  return wrap;
}

function renderThemeDetail(name) {
  var t = SUMMARY_THEMES_DATA[name];
  if (!t) return el('div');

  var panel = el('div', { class: 'sm-detail' });

  // Header
  var hdRow = el('div', { style: { display:'flex', alignItems:'center', gap:'8px', marginBottom:'12px', paddingBottom:'10px', borderBottom:'1px solid var(--rule)' } }, [
    el('span', { style: { fontSize: '22px' } }, t.icon || ''),
    el('div', { style: { flex: 1 } }, [
      el('div', { style: { fontFamily:'"Hiragino Mincho ProN","Yu Mincho",serif', fontSize:'16px', fontWeight:600 } }, name),
      el('div', { style: { fontSize:'12px', opacity:0.65, marginTop:'2px' } }, t.desc || '')
    ])
  ]);
  panel.appendChild(hdRow);

  // Key points
  if (t.kps && t.kps.length) {
    var kpDiv = el('div', { style: { marginBottom:'14px' } });
    t.kps.forEach(function(p) {
      kpDiv.appendChild(el('div', { class: 'sm-kp' }, [
        el('span', { class: 'sm-kp-ico' }, p.icon),
        el('div', null, [
          el('div', { class: 'sm-kp-label' }, p.label),
          el('div', { class: 'sm-kp-text' }, p.text)
        ])
      ]));
    });
    panel.appendChild(kpDiv);
  }

  // Deep-dive clusters
  if (t.dd && t.dd.clusters && t.dd.clusters.length) {
    panel.appendChild(el('div', { class: 'sm-section-divider' }));
    panel.appendChild(el('div', { class: 'sm-section-label' }, '深掘り解説'));

    t.dd.clusters.forEach(function(c) {
      var clDiv = el('div', { class: 'sm-cluster' });

      // Title
      clDiv.appendChild(el('div', { class: 'sm-cl-title' }, c.title));

      // Intro
      if (c.intro) clDiv.appendChild(el('div', { class: 'sm-cl-intro' }, c.intro));

      // Alert (red)
      if (c.alert) {
        clDiv.appendChild(el('div', { class: c.alert.t === 'g' ? 'sm-alert-g' : 'sm-alert-r' },
                             el('span', { html: c.alert.text })));
      }

      // Table
      if (c.table) {
        var tblWrap = el('div', { class: 'sm-tbl-wrap' });
        var tbl = el('table', { class: 'sm-tbl' });
        var thead = el('tr');
        c.table.h.forEach(function(h) { thead.appendChild(el('th', null, h)); });
        tbl.appendChild(el('thead', null, thead));
        var tbody = el('tbody');
        c.table.r.forEach(function(row) {
          var tr = el('tr', { class: row.hl ? 'hl' : '' });
          row.c.forEach(function(cellText) {
            // Process special prefixes
            var cell = document.createElement('td');
            var processed = cellText
              .replace(/^✅\s?/, '<span class="sm-badge-o">○</span>')
              .replace(/^❌\s?/, '<span class="sm-badge-x">×</span>')
              .replace(/^⚠️\s?/, '');
            cell.innerHTML = processed;
            tr.appendChild(cell);
          });
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        tblWrap.appendChild(tbl);
        clDiv.appendChild(tblWrap);
      }

      // Tip (green)
      if (c.tip) clDiv.appendChild(el('div', { class: 'sm-alert-g' }, el('span', { html: c.tip })));

      // Past question examples
      if (c.qs && c.qs.length) {
        clDiv.appendChild(el('div', { style: { fontSize:'11px', fontWeight:600, opacity:0.6, marginBottom:'6px', letterSpacing:'.04em', textTransform:'uppercase' } }, '代表的な過去問'));
        c.qs.forEach(function(qid) {
          var q = null;
          for (var i = 0; i < ALL_Q.length; i++) {
            if (ALL_Q[i].id === qid) { q = ALL_Q[i]; break; }
          }
          if (!q) return;
          var hist = state.history[q.id] || [];
          var lastAttempt = hist.length > 0 ? hist[hist.length-1] : null;
          clDiv.appendChild(el('div', { class: 'sm-q' }, [
            el('div', { class: 'sm-q-id' }, [
              qid + ' ',
              el('span', { style: { color: q.a === '〇' ? 'var(--moss)' : 'var(--crimson)', fontWeight:600 } }, q.a === '〇' ? '○（正）' : '×（誤）'),
              lastAttempt ? el('span', { style: { marginLeft:'8px', opacity:0.6 } }, lastAttempt.correct ? '✓直近正解' : '✗直近誤答') : null
            ]),
            el('div', { class: 'sm-q-text' }, el('span', { html: q.q.replace(/【([^】]*)】/g, '<span class="q-em">$1</span>') })),
            el('div', { class: 'sm-q-exp' }, q.explanation || '')
          ]));
        });
      }

      panel.appendChild(clDiv);
    });
  }

  // Drill button
  var drillBtn = el('button', {
    class: 'sm-drill-btn tap',
    onClick: function() {
      var pool = shuffle(ALL_Q.filter(function(q) { return q.tag === name; }));
      var n = Math.min(20, pool.length);
      navigate('quiz', { pool: pool.slice(0, n), mode: 'tag-' + name, title: name + '（' + n + '問）' });
    }
  }, [
    el('span', null, '🔥 このテーマで演習する'),
    el('span', { class: 'arrow' }, '→')
  ]);
  panel.appendChild(drillBtn);

  return panel;
}

function renderPatternsTab() {
  // Use PATTERNS data if available, otherwise derive from question data
  var patternGroups = {};
  ALL_Q.forEach(function(q) {
    var p = q.pattern || '（記載なし）';
    if (!patternGroups[p]) patternGroups[p] = [];
    patternGroups[p].push(q);
  });
  var patList = Object.keys(patternGroups)
    .filter(function(p) { return p !== '引っかけなし' && p !== '（記載なし）'; })
    .sort(function(a, b) { return patternGroups[b].length - patternGroups[a].length; });

  // If PATTERNS data has descriptions, use them
  var patDesc = (typeof PATTERNS !== 'undefined') ? PATTERNS : {};

  var container = el('div');
  container.appendChild(el('div', { style: { fontSize:'12px', opacity:0.6, marginBottom:'12px' } },
    'どのパターンが多いか把握して、ひっかからない目を鍛えましょう'));

  patList.forEach(function(pat) {
    var qs = patternGroups[pat];
    var desc = patDesc[pat] ? patDesc[pat].desc : null;
    var cardDiv = el('div', { class: 'sm-pat-card' }, [
      el('div', { style: { display:'flex', alignItems:'center', gap:'8px', marginBottom:'6px' } }, [
        el('div', { class: 'sm-pat-name', style: { flex:1 } }, pat),
        el('span', { style: { fontFamily:'monospace', fontSize:'11px', opacity:0.6 } }, qs.length + '問')
      ])
    ]);
    if (desc) cardDiv.appendChild(el('div', { class: 'sm-pat-desc' }, desc));

    // Bar
    var pct = (qs.length / ALL_Q.length) * 100;
    cardDiv.appendChild(el('div', { style: { height:'4px', background:'rgba(15,23,41,0.06)', borderRadius:'999px', overflow:'hidden', marginBottom:'10px' } },
      el('div', { style: { height:'100%', width: pct + '%', background: 'var(--crimson)', borderRadius:'999px' } })
    ));

    // Sample questions (collapsed)
    var dets = el('details');
    dets.appendChild(el('summary', { style: { fontSize:'11px', opacity:0.6, cursor:'pointer', padding:'4px 0', listStyle:'none' } }, '代表問題を見る ▼'));
    var sampleDiv = el('div', { style: { marginTop:'8px' } });
    qs.slice(0, 5).forEach(function(q) {
      sampleDiv.appendChild(el('div', { class: 'sm-q' }, [
        el('div', { class: 'sm-q-id' }, [
          q.id + ' ',
          el('span', { style: { color: q.a === '〇' ? 'var(--moss)' : 'var(--crimson)', fontWeight:600 } }, q.a === '〇' ? '○' : '×')
        ]),
        el('div', { class: 'sm-q-text' }, el('span', { html: q.q.replace(/【([^】]*)】/g, '<span class="q-em">$1</span>') })),
        el('div', { class: 'sm-q-exp' }, q.explanation || '')
      ]));
    });
    dets.appendChild(sampleDiv);
    cardDiv.appendChild(dets);

    // Quick drill button
    cardDiv.appendChild(el('button', {
      class: 'tap',
      style: { marginTop:'10px', width:'100%', padding:'10px', borderRadius:'6px', background:'var(--ink)', color:'var(--paper)', fontFamily:'"Hiragino Mincho ProN","Yu Mincho",serif', fontSize:'13px' },
      onClick: function() {
        var pool = shuffle(qs).slice(0, Math.min(10, qs.length));
        navigate('quiz', { pool: pool, mode: 'pattern-' + pat, title: pat + '（' + pool.length + '問）' });
      }
    }, 'このパターンで演習 →'));

    container.appendChild(cardDiv);
  });

  return container;
}

// SummaryDetail screen is now handled inline in summary - keep a minimal redirect
function renderSummaryDetail() {
  summarySelTheme = screenParams.tag;
  SUMMARY_TAB = 'themes';
  return renderSummary();
