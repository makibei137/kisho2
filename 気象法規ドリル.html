<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1729">
<title>気象予報士 法規ドリル</title>
<style>
  :root {
    --ink: #0f1729; --ink-2: #1a2540;
    --paper: #f4ede0; --paper-2: #ebe2cf;
    --gold: #c89545; --gold-dark: #9c6e2a;
    --crimson: #9c3835; --moss: #4a6b3a;
    --rule: #d6c9ad;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper); color: var(--ink); font-size: 16px;
    overscroll-behavior: none; min-height: 100vh;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  body {
    background-image:
      radial-gradient(at 20% 10%, rgba(200,149,69,0.06) 0%, transparent 50%),
      radial-gradient(at 80% 90%, rgba(15,23,41,0.04) 0%, transparent 50%);
    background-attachment: fixed;
  }
  button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; font-size: inherit; }
  input { font-family: inherit; }

  .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", "ヒラギノ明朝 ProN W3", "MS PMincho", serif; }
  .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; }

  .app { max-width: 42rem; margin: 0 auto; min-height: 100vh; position: relative; }

  /* Header */
  .header {
    background: var(--ink); color: var(--paper);
    padding-top: env(safe-area-inset-top);
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .header-inner { display: flex; align-items: center; padding: 12px 16px; gap: 12px; }
  .header-back { opacity: 0.8; line-height: 0; padding: 4px; margin-left: -4px; }
  .header-back svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
  .header-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 18px; flex: 1; }

  /* Hero */
  .hero {
    background: var(--ink); color: var(--paper);
    padding: 32px 20px 28px; padding-top: calc(32px + env(safe-area-inset-top));
    position: relative; overflow: hidden;
  }
  .hero-bg {
    position: absolute; top: -8px; right: 8px;
    font-size: 128px; line-height: 1; opacity: 0.1; color: var(--gold);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  .hero-label { font-family: monospace; font-size: 11px; opacity: 0.5; letter-spacing: 0.1em; }
  .hero-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 30px; margin: 4px 0; }
  .hero-sub { font-size: 12px; opacity: 0.6; }

  .progress-card {
    margin-top: 24px;
    background: rgba(244,237,224,0.07);
    border: 1px solid rgba(244,237,224,0.15);
    border-radius: 8px; padding: 16px;
  }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-row .label { font-size: 11px; opacity: 0.7; }
  .progress-row .value { font-family: monospace; font-size: 13px; color: var(--gold); }
  .progress-track { height: 8px; background: rgba(244,237,224,0.1); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); transition: width 0.5s; }
  .stat-grid { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; }
  .stat-label { opacity: 0.6; }
  .stat-value { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 22px; margin-top: 2px; }
  .stat-unit { font-size: 11px; opacity: 0.6; }

  .home-body { padding: 0 16px; }
  .tap { transition: transform 0.08s, opacity 0.15s; }
  .tap:active { transform: scale(0.97); }

  .primary-btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--paper);
    width: 100%; padding: 20px; border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    margin-top: 20px; text-align: left;
  }
  .primary-btn .ico { font-size: 30px; color: var(--gold); font-family: "Hiragino Mincho ProN", serif; }
  .primary-btn .body { flex: 1; }
  .primary-btn .title { font-family: "Hiragino Mincho ProN", serif; font-size: 20px; }
  .primary-btn .sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .primary-btn .more { font-family: monospace; font-size: 11px; color: var(--gold); }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .card-btn {
    background: var(--paper-2); border: 1px solid var(--rule);
    padding: 16px; border-radius: 8px; text-align: left;
    display: flex; flex-direction: column;
  }
  .card-btn.row { flex-direction: row; align-items: center; gap: 12px; padding: 12px; }
  .card-btn .ico { font-size: 24px; opacity: 0.6; font-family: "Hiragino Mincho ProN", serif; }
  .card-btn .title { font-family: "Hiragino Mincho ProN", serif; font-size: 15px; margin-top: 4px; }
  .card-btn.row .title { margin-top: 0; font-size: 13px; }
  .card-btn .sub { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .card-btn.row .ico { font-size: 20px; }
  .card-btn.crimson { background: var(--crimson); color: var(--paper); border: none; }
  .card-btn.crimson .ico { color: var(--gold); opacity: 1; }
  .card-btn.crimson .sub { opacity: 0.8; }
  .card-btn.dashed { background: rgba(15,23,41,0.04); border: 1px dashed var(--rule); opacity: 0.75; }

  .full-row-btn {
    width: 100%; padding: 16px; border-radius: 8px;
    background: var(--paper-2); border: 1px solid var(--rule);
    display: flex; align-items: center; gap: 12px;
    text-align: left; margin-top: 12px;
  }
  .full-row-btn .ico { font-size: 24px; opacity: 0.6; font-family: "Hiragino Mincho ProN", serif; }
  .full-row-btn .body { flex: 1; }
  .full-row-btn .title { font-family: "Hiragino Mincho ProN", serif; font-size: 15px; }
  .full-row-btn .sub { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .full-row-btn .arrow { font-family: "Hiragino Mincho ProN", serif; font-size: 18px; opacity: 0.4; }

  .section-title {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 13px; opacity: 0.7; margin: 32px 0 8px; padding-left: 4px;
  }
  .recent-list > * + * { margin-top: 8px; }
  .recent-item {
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 4px; padding: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .recent-item .name { font-size: 14px; }
  .recent-item .ts { font-size: 11px; opacity: 0.6; font-family: monospace; margin-top: 2px; }
  .recent-item .score { font-family: "Hiragino Mincho ProN", serif; font-size: 18px; text-align: right; }

  .home-footer {
    text-align: center; margin: 48px 0 16px;
    opacity: 0.3; font-size: 11px; font-family: monospace;
  }

  .screen { padding-bottom: 32px; }
  .screen-body { padding: 16px; }
  .screen-body > * + * { margin-top: 16px; }

  .mode-btn {
    width: 100%; padding: 16px; border-radius: 8px;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    background: var(--paper-2); border: 1px solid var(--rule);
  }
  .mode-btn.crimson { background: var(--crimson); color: var(--paper); border: none; }
  .mode-btn.ink-2 { background: var(--ink-2); color: var(--paper); border: none; }
  .mode-btn .ico { font-size: 24px; font-family: "Hiragino Mincho ProN", serif; opacity: 0.7; }
  .mode-btn.crimson .ico, .mode-btn.ink-2 .ico { color: var(--gold); opacity: 1; }
  .mode-btn .body { flex: 1; }
  .mode-btn .title { font-family: "Hiragino Mincho ProN", serif; font-size: 15px; }
  .mode-btn .sub { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .mode-btn.crimson .sub, .mode-btn.ink-2 .sub { opacity: 0.75; }
  .mode-btn .arrow { font-family: "Hiragino Mincho ProN", serif; opacity: 0.5; font-size: 18px; }
  .mode-btn[disabled] { opacity: 0.4; pointer-events: none; }

  .size-card { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; }
  .size-card .label { font-size: 12px; opacity: 0.6; margin-bottom: 8px; }
  .size-row { display: flex; gap: 8px; }
  .size-row button {
    flex: 1; padding: 8px 0; border-radius: 4px;
    font-family: monospace; font-size: 14px;
    background: rgba(15,23,41,0.06);
  }
  .size-row button.active { background: var(--ink); color: var(--paper); }

  .round-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .round-grid button {
    padding: 8px 0; border-radius: 4px;
    background: var(--paper-2); border: 1px solid var(--rule);
    font-family: monospace; font-size: 14px;
  }
  .tag-list > * + * { margin-top: 8px; }
  .tag-list button {
    width: 100%; padding: 12px 16px; border-radius: 4px;
    background: var(--paper-2); border: 1px solid var(--rule);
    display: flex; align-items: center; text-align: left;
  }
  .tag-bar { width: 4px; height: 24px; border-radius: 2px; margin-right: 12px; flex-shrink: 0; }
  .tag-name { font-family: "Hiragino Mincho ProN", serif; flex: 1; font-size: 14px; }
  .tag-count { font-family: monospace; font-size: 11px; opacity: 0.6; }

  /* Quiz */
  .quiz-root { display: flex; flex-direction: column; min-height: 100vh; background: var(--paper); }
  .quiz-header {
    background: var(--ink); color: var(--paper);
    padding-top: env(safe-area-inset-top);
  }
  .quiz-header-inner { padding: 12px 16px; }
  .quiz-bar { display: flex; align-items: center; gap: 12px; }
  .quiz-close { opacity: 0.7; line-height: 0; padding: 4px; }
  .quiz-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  .quiz-title-area { flex: 1; min-width: 0; }
  .quiz-title-area .small { font-size: 11px; font-family: monospace; opacity: 0.6;
                            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quiz-title-area .big { font-size: 14px; font-family: "Hiragino Mincho ProN", serif; margin-top: 2px; }
  .quiz-star { padding: 4px; font-size: 24px; line-height: 1; }
  .quiz-progress { margin-top: 8px; height: 4px; background: rgba(244,237,224,0.15); border-radius: 999px; overflow: hidden; }
  .quiz-progress > div { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); transition: width 0.5s; }

  .quiz-body { flex: 1; padding: 20px 16px; overflow-y: auto; }
  .meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .seal {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    background: var(--crimson); color: var(--paper);
    border-radius: 3px; font-weight: 700; font-size: 12px;
  }
  .meta-tag { font-size: 11px; font-family: "Hiragino Mincho ProN", serif; }
  .badge { font-family: monospace; font-size: 11px; padding: 2px 6px; border-radius: 3px; }
  .badge.predicted { background: var(--ink-2); color: var(--gold); }
  .badge.id { opacity: 0.5; background: none; padding: 0; }
  .badge.changed { background: var(--crimson); color: var(--paper); }

  .qtext {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 16px; line-height: 1.95;
  }
  .q-em {
    background: linear-gradient(transparent 60%, rgba(200,149,69,0.35) 60%);
    font-weight: 500; padding: 0 0.05em;
  }
  .history-row { margin-top: 12px; display: flex; gap: 4px; align-items: center; font-size: 11px; opacity: 0.5; }
  .history-row .o { color: var(--moss); }
  .history-row .x { color: var(--crimson); }

  .reveal { margin-top: 24px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .reveal { animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .reveal-banner { padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: var(--paper); }
  .reveal-banner.correct { background: var(--moss); }
  .reveal-banner.wrong { background: var(--crimson); }
  .reveal-banner .big { font-family: "Hiragino Mincho ProN", serif; font-size: 22px; }
  .reveal-banner .sub { font-family: monospace; font-size: 13px; opacity: 0.85; }
  .reveal-body { background: var(--paper-2); padding: 16px; }
  .reveal-body > * + * { margin-top: 12px; }
  .reveal-label { font-family: "Hiragino Mincho ProN", serif; font-size: 11px; opacity: 0.6; margin-bottom: 4px; }
  .reveal-text { font-size: 14px; line-height: 1.7; }
  .reveal-inline { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
  .reveal-inline .lbl { font-family: "Hiragino Mincho ProN", serif; font-size: 11px; opacity: 0.6; padding-top: 2px; flex-shrink: 0; }
  .reveal-law { padding-top: 8px; border-top: 1px solid var(--rule); }
  .reveal-law .text { font-family: monospace; font-size: 11px; color: var(--gold-dark); }

  .quiz-footer {
    background: var(--paper); border-top: 1px solid var(--rule);
    padding: 8px 16px 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answer-btn {
    padding: 20px 0; border-radius: 8px;
    font-family: "Hiragino Mincho ProN", serif; font-size: 22px;
    color: var(--paper);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .answer-btn.o { background: var(--moss); }
  .answer-btn.x { background: var(--crimson); }
  .next-btn {
    width: 100%; padding: 16px;
    background: var(--ink); color: var(--paper);
    border-radius: 8px;
    font-family: "Hiragino Mincho ProN", serif; font-size: 18px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .next-btn .arrow { color: var(--gold); }

  .result-hero {
    background: var(--ink); color: var(--paper);
    padding: 32px 20px 24px;
    padding-top: calc(32px + env(safe-area-inset-top));
    position: relative; overflow: hidden;
  }
  .result-score { margin-top: 24px; display: flex; align-items: baseline; gap: 8px; }
  .result-score .big { font-family: "Hiragino Mincho ProN", serif; font-size: 60px; color: var(--gold); line-height: 1; }
  .result-score .total { opacity: 0.7; font-family: monospace; }
  .result-score .right { margin-left: auto; text-align: right; }
  .result-score .pct { font-family: "Hiragino Mincho ProN", serif; font-size: 30px; }
  .result-score .time { font-family: monospace; font-size: 12px; opacity: 0.6; }
  .result-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .result-section-head .title { font-family: "Hiragino Mincho ProN", serif; font-size: 13px; opacity: 0.7; }
  .result-section-head button { font-size: 11px; opacity: 0.6; text-decoration: underline; }
  .result-perfect { text-align: center; padding: 32px 0; }
  .result-perfect .big { font-family: "Hiragino Mincho ProN", serif; font-size: 30px; color: var(--moss); margin-bottom: 8px; }
  .result-perfect .sub { font-size: 14px; opacity: 0.6; }

  details.item {
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 4px;
  }
  details.item + details.item { margin-top: 8px; }
  details.item > summary {
    padding: 8px 12px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; list-style: none;
  }
  details.item > summary::-webkit-details-marker { display: none; }
  .item-num { font-family: monospace; font-size: 11px; opacity: 0.6; width: 24px; flex-shrink: 0; }
  .item-mark { font-family: "Hiragino Mincho ProN", serif; font-size: 18px; flex-shrink: 0; }
  .item-mark.o { color: var(--moss); }
  .item-mark.x { color: var(--crimson); }
  .item-tag { font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-caret { font-family: monospace; font-size: 11px; opacity: 0.5; }
  .item-body { padding: 12px; border-top: 1px solid var(--rule); }
  .item-body .q { font-family: "Hiragino Mincho ProN", serif; line-height: 1.7; margin-bottom: 8px; font-size: 14px; }
  .item-body .meta { font-size: 12px; opacity: 0.75; }
  .item-body .meta + .meta { margin-top: 4px; }
  .item-body .law { font-family: monospace; font-size: 11px; color: var(--gold-dark); margin-top: 4px; }

  /* Summary detail */
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .stats4 .num { font-family: "Hiragino Mincho ProN", serif; font-size: 20px; }
  .stats4 .lbl { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  .pattern-row + .pattern-row { margin-top: 10px; }
  .pattern-row .top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .pattern-row .top > span:first-child { padding-right: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pattern-row .top > span:last-child { font-family: monospace; opacity: 0.6; flex-shrink: 0; }
  .pattern-bar { height: 6px; background: rgba(15,23,41,0.06); border-radius: 999px; overflow: hidden; }
  .pattern-bar > div { height: 100%; }
  .law-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; }
  .law-row > span:first-child { font-family: monospace; opacity: 0.8; color: var(--gold-dark);
                                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
  .law-row > span:last-child { font-family: monospace; opacity: 0.6; flex-shrink: 0; }

  details.card { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; }
  details.card > summary {
    padding: 16px; cursor: pointer; list-style: none;
    display: flex; align-items: center;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary > .title { flex: 1; font-family: "Hiragino Mincho ProN", serif; font-size: 13px; opacity: 0.7; }
  details.card > summary > .caret { font-family: monospace; font-size: 11px; opacity: 0.5; }
  details.card > .content { padding: 12px 16px 16px; border-top: 1px solid var(--rule); }
  details.card > .content > * + * { margin-top: 12px; }

  .theme-tile { width: 100%; padding: 16px; border-radius: 8px;
                background: var(--paper-2); border: 1px solid var(--rule);
                text-align: left; }
  .theme-tile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .theme-tile-name { font-family: "Hiragino Mincho ProN", serif; font-size: 15px; flex: 1; }
  .theme-tile-count { font-family: monospace; font-size: 13px; opacity: 0.6; }
  .theme-tile-stats { margin-left: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 11px; }
  .theme-tile-stats .num { font-family: "Hiragino Mincho ProN", serif; font-size: 16px; margin-top: 2px; }

  /* Browse */
  .search-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); padding: 12px 16px; border-bottom: 1px solid var(--rule);
  }
  .search-bar input {
    width: 100%; padding: 8px 12px; border-radius: 4px;
    background: var(--paper-2); border: 1px solid var(--rule);
    font-size: 14px; outline: none;
  }
  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 8px; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill-row.wrap { flex-wrap: wrap; overflow: visible; }
  .pill {
    flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 11px;
    background: rgba(15,23,41,0.06);
  }
  .pill.small { padding: 4px 10px; }
  .pill.active { background: var(--ink); color: var(--paper); }
  .pill.active.crimson { background: var(--crimson); }
  .pill.active.gold { background: var(--gold); color: var(--ink); }
  .filter-section { margin-top: 8px; }
  .filter-section > * + * { margin-top: 8px; }
  .filter-toggle {
    font-size: 11px; opacity: 0.6; cursor: pointer;
    margin-top: 8px; background: none; padding: 0;
  }

  .browse-go-btn {
    background: var(--ink); color: var(--paper);
    width: 100%; padding: 12px; border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 12px;
  }
  .browse-go-btn .arrow { color: var(--gold); }
  .browse-go-btn .text { font-family: "Hiragino Mincho ProN", serif; }

  .browse-list > * + * { margin-top: 8px; }
  .browse-item {
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 4px;
  }
  .browse-item > summary {
    padding: 10px 12px; display: flex; align-items: flex-start; gap: 8px;

<script>
window.__PAST_QUESTIONS__ = [{"id":"63-15-d","round":63,"qNum":"15","choice":"d","tag":"災害対策基本法","q":"中央防災会議は、災害及び災害の防止に関する科学的研究の成果並びに発生した災害の状況やこれに対して行われた災害応急対策の効果を勘案して、【5年ごとに防災基本計画に検討を加え、必要があると認めるときには修正しなければならない。】","a":"×","lawChanged":false,"explanation":"【対比】× 5年ごと → 〇 毎年（理由：状況の変化に即応するため、防災基本計画は毎年検討を加える必要があるため）","pattern":"数字・期限の引っかけ","law":"災害対策基本法 第34条 第1項","source":"past"},{"id":"63-15-c","round":63,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"都道府県の地域について災害が発生し、又は発生するおそれがある場合において、防災の推進を図るため必要があると認めるときは、【都道府県知事は、都道府県地域防災計画の定めるところにより、都道府県災害対策本部を設置することができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）都道府県知事の判断で災害対策本部を設置できることが規定されている","pattern":"引っかけなし","law":"災害対策基本法 第23条 第1項","source":"past"},{"id":"63-15-b","round":63,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"市町村内の一定の地区内の居住者及び当該地区に事業所を有する事業者は、共同して、市町村防災会議に対し、【市町村地域防災計画に、当該地区における防災活動に関する計画である地区防災計画を定めることを提案することができる。この場合においては、当該提案に係る地区防災計画の素案を添えなければならない。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）住民や事業者が主体的に防災計画を提案できる制度が設けられている","pattern":"引っかけなし","law":"災害対策基本法 第42条の2 第1項","source":"past"},{"id":"63-15-a","round":63,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"市町村は、基礎的な地方公共団体として、【当該市町村の地域に係る防災に関する計画（市町村地域防災計画）を作成し、法令に基づきこれを実施する責務を有する。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）基礎的自治体である市町村の最も基本的な責務である","pattern":"引っかけなし","law":"災害対策基本法 第5条 第1項","source":"past"},{"id":"63-14-d","round":63,"qNum":"14","choice":"d","tag":"予報と警報","q":"警報事項の通知を受けた国土交通省の機関は、【直ちにその通知された事項を航行中の航空機に周知させなければならない。】","a":"×","lawChanged":false,"explanation":"【対比】× 周知させなければならない（義務） → 〇 周知させるように努めなければならない（努力義務）（理由：国土交通省機関から航空機への周知は努力義務であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第15条 第4項","source":"past"},{"id":"63-14-c","round":63,"qNum":"14","choice":"c","tag":"予報と警報","q":"気象庁は、気象、地象(地震にあっては地震動に限る)、津波、高潮及び波浪についての【航空機及び船舶の利用に適合する予報及び警報をすることができる。】","a":"×","lawChanged":false,"explanation":"【対比】× することができる（任意） → 〇 しなければならない（義務）（理由：航空機や船舶の安全に直結する極めて重要な情報であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第14条 第1項","source":"past"},{"id":"63-14-b","round":63,"qNum":"14","choice":"b","tag":"予報と警報","q":"予報業務の許可を受けた者は、当該予報業務の目的及び範囲に係る気象庁の警報事項を【当該予報業務の利用者に迅速に伝達するように努めなければならない。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）利用者を災害から守るための努力義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第20条","source":"past"},{"id":"63-14-a","round":63,"qNum":"14","choice":"a","tag":"予報と警報","q":"警報事項の通知を受けた都道府県は、【直ちにその通知された事項を関係市町村長に通知しなければならない。】","a":"×","lawChanged":false,"explanation":"【対比】× 通知しなければならない（義務） → 〇 通知するように努めなければならない（努力義務）（理由：都道府県から市町村長への通知は努力義務であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第15条 第2項","source":"past"},{"id":"63-13-c","round":63,"qNum":"13","choice":"c","tag":"気象予報士","q":"複数の専任の気象予報士の設置が規定されている事業所において規定された人数から1名が欠員となった場合に、1日当たりの現象の予想を行う時間を変更せずに予報業務を継続するためには、1カ月以内に欠員を補充しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 1カ月以内 → 〇 2週間以内（理由：業務品質を保つため、速やかな欠員補充が求められるため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"63-13-b","round":63,"qNum":"13","choice":"b","tag":"気象予報士","q":"現象の予想を毎日12時間行う予報業務許可事業者は、当該業務を行う事業所に4名以上の専任の気象予報士を置かなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 4名以上 → 〇 3名以上（理由：予想時間が8時間を超え16時間以下の場合は3名と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"63-13-a","round":63,"qNum":"13","choice":"a","tag":"気象予報士","q":"予報業務の許可を受けた事業者の下で予報業務に従事しようとする気象予報士は、その旨を予め気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士は（自ら届出） → 〇 事業者は（理由：気象予報士の配置を報告する義務は、雇用する事業者側にあるため）","pattern":"主語のすり替え","law":"気象業務法施行規則 第10条 第2項 第2号、第50条 第1項 第6号、同条 第2項 第2号","source":"past"},{"id":"63-12-c","round":63,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務を行う事業所の名称を変更しようとするときは、変更の予定日の30日前までに、気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 変更予定日の30日前までに → 〇 報告事由の発生した後遅滞なく（理由：名称の変更は許可申請事項の変更にあたり、事後の遅滞ない報告で足りるため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号","source":"past"},{"id":"63-12-b","round":63,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務の全部または一部を廃止したときは、廃止した日から30日以内に、気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）事後30日以内の届出で完了する","pattern":"引っかけなし","law":"気象業務法 第22条","source":"past"},{"id":"63-12-a","round":63,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の目的又は範囲を変更しようとするときは、変更の予定日の30日前までに、気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 届け出 → 〇 認可（理由：目的や範囲の変更は新規許可と同等の厳格な審査が必要なため）","pattern":"用語の混同","law":"気象業務法 第19条 第1項","source":"past"},{"id":"62-15-d","round":62,"qNum":"15","choice":"d","tag":"水防法","q":"当該河川の状況を 【関係都道府県知事】に通知するとともに、","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）国土交通大臣から関係都道府県知事へ通知するルートとして正しい","pattern":"引っかけなし","law":"水防法 第10条 第2項","source":"past"},{"id":"62-15-c","round":62,"qNum":"15","choice":"c","tag":"水防法","q":"国土交通大臣は、二以上の都道府県の区域にわたる河川その他の流域面積が大きい河川で洪水により 【国民経済上重大な損害を生ずるおそれがあるものとして指定した河川】について、","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）国土交通大臣が自ら水防警報等を行うべき重要な指定河川の基準として正しく記述されている","pattern":"引っかけなし","law":"水防法 第10条 第2項","source":"past"},{"id":"62-15-b","round":62,"qNum":"15","choice":"b","tag":"水防法","q":"必要に応じ 【報道機関の協力を求めて、これを市町村長に】周知させなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 市町村長に → 〇 一般に（理由：報道機関の協力を求める目的は、広く一般（国民）に周知させることであるため）","pattern":"主語のすり替え","law":"水防法 第10条 第1項、同条 第2項","source":"past"},{"id":"62-15-a","round":62,"qNum":"15","choice":"a","tag":"水防法","q":"気象庁長官は、気象等の状況により洪水、津波又は高潮のおそれがあると認められるときは、その状況を【内閣総理大臣及び関係都道府県知事】に通知するとともに、","a":"×","lawChanged":false,"explanation":"【対比】× 内閣総理大臣 → 〇 国土交通大臣（理由：洪水や水防に関する主務大臣は国土交通大臣であるため）","pattern":"主語のすり替え","law":"水防法 第10条 第1項","source":"past"},{"id":"62-14-c","round":62,"qNum":"14","choice":"c","tag":"罰則","q":"スキー場を運営する事業者が、登録検定機関による検定を受けた温度計と風向・風速計をゲレンデに設置して、観測した値をホームページに掲示した際に、気象庁長官に届け出ていなかった。（※罰則が適用される事項として）","a":"×","lawChanged":false,"explanation":"【対比】× 罰則対象 → 〇 対象外（理由：成果を発表するための観測施設設置の届出義務違反には、直接の罰則規定は設けられていないため）","pattern":"罰則の有無の引っかけ","law":"気象業務法 第7章（第44条〜第50条）","source":"past"},{"id":"62-14-b","round":62,"qNum":"14","choice":"b","tag":"罰則","q":"ある小学校が、登録検定機関による検定を受けていない温度計と風向風速計を校庭に設置して、毎日決まった時刻に生徒に観測を行わせ、その結果を授業で発表させた。（※罰則が適用される事項として）","a":"×","lawChanged":false,"explanation":"【対比】× 罰則対象 → 〇 対象外（理由：教育機関が教育の目的で行う観測は、検定済測器の使用義務から除外されているため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第6条 第1項 第2号、同法 第9条 第1項","source":"past"},{"id":"62-14-a","round":62,"qNum":"14","choice":"a","tag":"罰則","q":"ある地方公共団体が気象庁に届出をして観測を行っている雨量計を、正当な理由がないのに壊した。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象庁や届出をして設置された気象測器を破壊する行為は、罰則（拘禁刑や罰金）の対象となる","pattern":"引っかけなし","law":"気象業務法 第37条、同法 第44条","source":"past"},{"id":"62-13-d","round":62,"qNum":"13","choice":"d","tag":"気象予報士","q":"気象予報士が死亡したとき、その相続人は、遅滞なくその旨を気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）本人が死亡した場合、相続人が遅滞なく届け出ることが義務付けられている","pattern":"引っかけなし","law":"気象業務法 第24条の25 第2項","source":"past"},{"id":"62-13-c","round":62,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士は、気象の予報業務の許可を受けた事業者のもとで気象の予報を行おうとするときには、予めその旨を気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士は（自ら届出） → 〇 事業者は（理由：気象予報士の配置等を報告する義務は、雇用する事業者側に課せられているため）","pattern":"主語のすり替え","law":"気象業務法 及び同法施行規則の全体","source":"past"},{"id":"62-13-b","round":62,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士は、住所を変更したときには遅滞なく気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）登録事項である住所や氏名の変更は事後の遅滞ない届出でよい","pattern":"引っかけなし","law":"気象業務法 第24条の24、同法施行規則 第34条 第1項","source":"past"},{"id":"62-13-a","round":62,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士試験に合格した者が気象予報士となるためには、気象庁長官の承認を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 承認 → 〇 登録（理由：試験合格後、気象庁に備えられる名簿に登録されることで資格が発生するため）","pattern":"用語の混同","law":"気象業務法 第24条の20","source":"past"},{"id":"62-12-d","round":62,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が、気象庁長官の許可を受けようとする際に、以前に気象の予報業務の許可の取消しを受けた者である場合、その取消しの日から2年を経過していること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）許可の取消しから2年間は再許可を受けられない欠格期間となる","pattern":"引っかけなし","law":"気象業務法 第18条 第2項 第2号","source":"past"},{"id":"62-12-c","round":62,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が、気象庁長官の許可を受けようとする際に、当該予報業務に必要な予報資料の解析の施設及び要員を有すること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）収集と同様に、解析の施設と要員も許可の要件として定められている","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"62-12-b","round":62,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が、気象庁長官の許可を受けようとする際に、当該予報業務に必要な予報資料の収集の施設及び要員を有すること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務を的確に遂行するための観測・収集・解析の施設と要員が要件となる","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"62-12-a","round":62,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が、気象庁長官の許可を受けようとする際に、当該予報業務における予報を迅速に利用者に伝達する施設及び要員を有すること。","a":"×","lawChanged":false,"explanation":"【対比】× 予報を利用者に伝達する → 〇 気象庁の警報事項を受ける（理由：許可要件は予報の伝達ではなく、防災上重要な警報を受信する体制が求められるため）","pattern":"用語の混同","law":"気象業務法 第18条 第1項 第2号","source":"past"},{"id":"61-15-c","round":61,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"また、市町村長は、災害の発生に際して、避難のための立ち退きを行うことによりかえって人の生命又は身体に危険が及ぶおそれがあり、緊急を要すると認めるときは、高所への移動、近傍の堅固な建物への退避その他の 【緊急に安全を確保するための措置（緊急安全確保措置）を居住者等に指示することができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）立ち退き避難が危険な場合の緊急安全確保措置の指示も市町村長の権限である","pattern":"引っかけなし","law":"災害対策基本法 第60条 第3項","source":"past"},{"id":"61-15-b","round":61,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"市町村長は、災害が発生し、または発生する恐れがある場合には、【避難のための立ち退きを居住者等に指示することができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）市町村長の権限として、避難指示を発令することが規定されている","pattern":"引っかけなし","law":"災害対策基本法 第60条 第1項","source":"past"},{"id":"61-15-a","round":61,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"災害対策基本法において、市町村は、当該市町村の住民の生命、身体及び財産を災害から保護するため、【地域防災計画を作成し、実施する責務】を有しており、","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）基礎的自治体である市町村の最も基本的な責務として定められている","pattern":"引っかけなし","law":"災害対策基本法 第5条 第1項","source":"past"},{"id":"61-14-d","round":61,"qNum":"14","choice":"d","tag":"気象観測","q":"気象庁長官は、気象観測の施設の設置の届け出をした者に対し、観測の成果の報告を求めることができる。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象庁長官は、届出をして観測を行う者に対して、データの報告を求める権限を持つ","pattern":"引っかけなし","law":"気象業務法 第6条 第4項","source":"past"},{"id":"61-14-c","round":61,"qNum":"14","choice":"c","tag":"気象観測","q":"船舶から気象庁長官に対してその成果の報告を行わなければならない気象の観測に用いる気象測器は、検定に合格したものでなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）正確なデータ収集が義務付けられている観測（船舶など）では、検定合格測器の使用が義務付けられている","pattern":"引っかけなし","law":"気象業務法 第9条 第1項","source":"past"},{"id":"61-14-b","round":61,"qNum":"14","choice":"b","tag":"気象観測","q":"国立大学が研究のためのデータを得るために風速観測施設を国内に設置する場合は、その旨を気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 届出が必要 → 〇 不要（理由：研究や教育の目的で行う観測は特例として義務から除外されており、届出も不要なため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第6条 第1項 第1号、同条 第3項","source":"past"},{"id":"61-14-a","round":61,"qNum":"14","choice":"a","tag":"気象観測","q":"駅に隣接する商業施設が駅前の気温を電光掲示板で市民に発表するために温度計を設置する場合は、温度計の設置について気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）観測の成果を発表するための気象観測施設の設置は、事前の届出が必要であるため","pattern":"引っかけなし","law":"気象業務法 第6条 第2項 第1号、同条 第3項、同法施行規則 第1条の4","source":"past"},{"id":"61-13-d","round":61,"qNum":"13","choice":"d","tag":"予報業務の許可","q":"気象予報士が、自宅周辺の独自の天気予報を定期的に個人のホームページに掲載するときには、予報業務の許可を受けなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）個人であっても、反復継続して予想を発表する行為は「予報の業務」に該当するため許可が必要となる","pattern":"引っかけなし","law":"気象業務法 第17条 第1項","source":"past"},{"id":"61-13-c","round":61,"qNum":"13","choice":"c","tag":"予報業務の許可","q":"建設会社が、気象予報士の資格を持つ社員に自社の工事現場周辺のきめ細かな天気予報を行わせ、社内で共有するときには、自社だけの使用であっても予報業務の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"「予報」は予想の「発表」と定義されており、社内での自己使用は発表に該当しない。 許可が必要なのは「予報の業務」ですが、自社のみの利用は情報の提供者と利用者が同一のため「業務」に当たりません。 ","pattern":"引っかけなし","law":"気象業務法 第17条 第1項","source":"past"},{"id":"61-13-b","round":61,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"旅館で働く気象予報士が、気象庁が発表した天気、気温及び風の予報を、旅館のホームページに毎日掲載するときには、予報業務の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 許可が必要 → 〇 不要（理由：自ら予想を行わず、気象庁の予報をそのまま転載・伝達するだけなら「予報の業務」には該当しないため）","pattern":"用語の混同","law":"気象業務法 第2条 第6項、同法 第17条 第1項","source":"past"},{"id":"61-13-a","round":61,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"ある町の桜の開花予測を行い、地元観光協会のホームページに掲載するときには、予報業務の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 許可が必要 → 〇 不要（理由：桜の開花などの植物の現象は気象業務法上の「気象」に含まれず、予報業務の対象外となるため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第2条 第1項、同法 第17条 第1項","source":"past"},{"id":"61-12-d","round":61,"qNum":"12","choice":"d","tag":"気象予報士","q":"気象予報士が、刑法の規定により罰金以上の刑に処せられたときには、気象予報士の登録を抹消される。","a":"×","lawChanged":false,"explanation":"【対比】× 刑法の規定 → 〇 気象業務法の規定（理由：登録抹消の欠格事由となるのは「気象業務法」に違反して処罰された場合のみであるため）","pattern":"用語の混同","law":"気象業務法 第24条の25 第1項 第2号、同法 第24条の21 第1号","source":"past"},{"id":"61-12-c","round":61,"qNum":"12","choice":"c","tag":"気象予報士","q":"気象の予報業務の許可を受けた事業者は、当該予報業務のうち現象の予想とその発表については、気象予報士に行わせなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 予想とその発表 → 〇 予想のみ（理由：気象予報士の独占業務は「現象の予想」のみであり、「発表」についてまで行わせる規定はないため）","pattern":"用語の混同","law":"気象業務法 第19条の2","source":"past"},{"id":"61-12-b","round":61,"qNum":"12","choice":"b","tag":"気象予報士","q":"不正な手段により気象予報士試験に合格したために、試験の合格を取り消された者は、最長3年間は気象予報士試験を受けることができない。","a":"×","lawChanged":false,"explanation":"【対比】× 3年間 → 〇 2年間以内（理由：不正受験者に対する受験禁止期間は最長2年以内と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第24条の18 第3項","source":"past"},{"id":"61-12-a","round":61,"qNum":"12","choice":"a","tag":"気象予報士","q":"気象予報士になるためには、気象庁長官の行う気象予報士試験に合格し、国土交通大臣の登録を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 国土交通大臣 → 〇 気象庁長官（理由：気象予報士の登録権者は気象庁長官であるため）","pattern":"主語のすり替え","law":"気象業務法 第24条の20","source":"past"},{"id":"60-15-d","round":60,"qNum":"15","choice":"d","tag":"予報と警報","q":"気象庁以外の者が、高潮、波浪又は洪水の警報を行おうとする場合は、気象庁長官の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 許可を受けなければならない → 〇 してはならない（全面禁止）（理由：混乱を防ぐため、気象庁以外の者による警報の発表は一切禁止されているため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第23条","source":"past"},{"id":"60-15-c","round":60,"qNum":"15","choice":"c","tag":"予報と警報","q":"気象庁は、気象、津波、高潮及び洪水についての水防活動の利用に適合する警報をすることができる。","a":"×","lawChanged":false,"explanation":"【対比】× することができる（任意） → 〇 しなければならない（義務）（理由：水防活動に直結する重要な情報であり、発表は義務と規定されているため）","pattern":"義務と任意のすり替え","law":"気象業務法 第14条の2 第1項","source":"past"},{"id":"60-15-b","round":60,"qNum":"15","choice":"b","tag":"予報と警報","q":"気象庁から特別警報に係る警報事項の通知を受けた都道府県の機関は、直ちにその通知された事項を関係市町村長に通知するように努めなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 努めなければならない（努力義務） → 〇 通知しなければならない（義務）（理由：特別警報は極めて重要度が高く、市町村長への通知は法的義務であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第15条の2 第2項","source":"past"},{"id":"60-15-a","round":60,"qNum":"15","choice":"a","tag":"予報と警報","q":"特別警報は、予想される現象が特に異常であるため重大な災害の起こるおそれが著しく大きい場合に発表される。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）特別警報の定義として正しく記述されている","pattern":"引っかけなし","law":"気象業務法 第13条の2 第1項","source":"past"},{"id":"60-14-c","round":60,"qNum":"14","choice":"c","tag":"用語の定義","q":"「予報」とは、観測の成果に基く現象の予想をいう。","a":"×","lawChanged":false,"explanation":"【対比】× 予想をいう → 〇 予想の「発表」をいう（理由：心の中で予想するだけでは予報ではなく、発表して初めて予報となるため）","pattern":"用語の混同","law":"気象業務法 第2条 第6項","source":"past"},{"id":"60-14-b","round":60,"qNum":"14","choice":"b","tag":"用語の定義","q":"「観測」とは、自然科学的方法による現象の観察及び測定をいう。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象業務法における「観測」の定義として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第5項","source":"past"},{"id":"60-14-a","round":60,"qNum":"14","choice":"a","tag":"用語の定義","q":"「気象」とは、大気（電離層を除く。）の諸現象をいう。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象業務法における「気象」の定義として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第1項","source":"past"},{"id":"60-13-c","round":60,"qNum":"13","choice":"c","tag":"気象予報士","q":"複数の気象予報士の配置が規定されている事業所において、規定数の気象予報士から1名が欠員となった場合には、4週間以内に、規定に適合させるため必要な措置をとらなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 4週間以内 → 〇 2週間以内（理由：業務の品質を保つため、速やかな欠員補充が求められるため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"60-13-b","round":60,"qNum":"13","choice":"b","tag":"気象予報士","q":"予報業務許可事業者は、当該予報業務を行った場合は、予報事項の内容と発表の時刻、及び予想を行った気象予報士の氏名を記録し、2年間保存しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務の記録（内容、時刻、気象予報士の氏名など）は2年間の保存義務がある","pattern":"引っかけなし","law":"気象業務法施行規則 第12条の2 第1号・第2号","source":"past"},{"id":"60-13-a","round":60,"qNum":"13","choice":"a","tag":"気象予報士","q":"現象の24時間先から1週間先までの予報作業を毎日12時間行う予報業務許可事業者は、当該業務を行う事業所に4名以上の専任の気象予報士を配置しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 4名以上 → 〇 3名以上（理由：予想時間が8時間超〜16時間以下の場合は3名と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"60-12-d","round":60,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"気象に関する予報業務の許可について、許可申請時に提出した事項に変更があった場合、変更後に気象庁長官に報告書を提出しなければならない事項として、予報業務の許可を受けている者から利用者に予報事項を伝達するための施設","a":"×","lawChanged":false,"explanation":"【対比】× 報告対象 → 〇 対象外（理由：利用者へ予報を伝達する施設は、そもそも予報業務計画書の記載事項に含まれていないため）","pattern":"法定事項の引っかけ","law":"気象業務法施行規則 第10条 第2項","source":"past"},{"id":"60-12-c","round":60,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"気象に関する予報業務の許可について、許可申請時に提出した事項に変更があった場合、変更後に気象庁長官に報告書を提出しなければならない事項として、気象庁の警報事項を受ける方法","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）警報事項を受ける方法も予報業務計画書の記載事項であり、事後遅滞ない報告で足りるため","pattern":"引っかけなし","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第1号 ホ","source":"past"},{"id":"60-12-b","round":60,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"気象に関する予報業務の許可について、許可申請時に提出した事項に変更があった場合、変更後に気象庁長官に報告書を提出しなければならない事項として、予報業務を行う事業所の名称及び所在地","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）名称・所在地は予報業務計画書の記載事項であり、事後遅滞ない報告で足りるため","pattern":"引っかけなし","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第1号 イ","source":"past"},{"id":"60-12-a","round":60,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"気象に関する予報業務の許可について、許可申請時に提出した事項に変更があった場合、変更後に気象庁長官に報告書を提出しなければならない事項として、予報の対象区域","a":"×","lawChanged":false,"explanation":"【対比】× 変更後の報告 → 〇 事前の認可（理由：「対象区域」は予報業務の範囲に含まれ、変更には気象庁長官の認可が必要なため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第19条 第1項、気象業務法施行規則 第10条 第1項 第3号 ロ","source":"past"},{"id":"59-15-d","round":59,"qNum":"15","choice":"d","tag":"災害対策基本法","q":"災害が発生するおそれがある異常な現象を発見した者は、遅滞なく、その旨を【市町村長又は気象台長若しくは警察官に通報しなければならない。】","a":"×","lawChanged":false,"explanation":"【対比】× 気象台長 → 〇 海上保安官（理由：通報先は「市町村長」「警察官」「海上保安官」であり、気象台長は含まれないため）","pattern":"法定事項の引っかけ","law":"災害対策基本法 第54条 第1項","source":"past"},{"id":"59-15-c","round":59,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"市町村長は、市町村地域防災計画の定めるところにより、災害地で市町村災害対策本部の事務の一部を行う組織として、【市町村現地災害対策本部を置くことができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）災害地に設置される市町村現地災害対策本部について正しく規定されている","pattern":"引っかけなし","law":"災害対策基本法 第23条の2 第5項","source":"past"},{"id":"59-15-b","round":59,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"都道府県知事は、都道府県の地域について災害が発生した場合において、防災の推進を図るため必要があると認めるときは、都道府県地域防災計画の定めるところにより、【都道府県災害対策本部を設置することができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）都道府県知事による都道府県災害対策本部の設置要件として正しく記述されている","pattern":"引っかけなし","law":"災害対策基本法 第23条 第1項","source":"past"},{"id":"59-15-a","round":59,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"内閣総理大臣は、非常災害が発生した場合において、当該災害の規模その他の状況により当該災害に係る災害応急対策を推進するため特別の必要があると認めるときは、【臨時に内閣府に非常災害対策本部を設置することができる。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）内閣総理大臣による非常災害対策本部の設置要件として正しく記述されている","pattern":"引っかけなし","law":"災害対策基本法 第24条 第1項","source":"past"},{"id":"59-14-d","round":59,"qNum":"14","choice":"d","tag":"予報と警報","q":"日本放送協会の機関は、気象庁から通知された警報事項を、直ちに放送しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）NHK（日本放送協会）に対する警報事項の放送は、法的な義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第15条 第6項","source":"past"},{"id":"59-14-c","round":59,"qNum":"14","choice":"c","tag":"予報と警報","q":"都道府県の機関は、気象庁から通知された警報事項を、直ちに関係市町村長に通知するように努めなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）都道府県から市町村長への通常の警報の伝達は、努力義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第15条 第2項","source":"past"},{"id":"59-14-b","round":59,"qNum":"14","choice":"b","tag":"予報と警報","q":"気象庁は、気象、地象(地震にあっては地震動に限る)、津波、高潮及び波浪についての航空機及び船舶の利用に適合する予報及び警報をすることができる。","a":"×","lawChanged":false,"explanation":"【対比】× することができる（任意） → 〇 しなければならない（義務）（理由：航空機や船舶の安全運航に直結するため、実施は法的な義務であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第14条 第1項","source":"past"},{"id":"59-14-a","round":59,"qNum":"14","choice":"a","tag":"予報と警報","q":"気象庁は、気象、地象(地震にあっては地震動に限る)、津波、高潮、波浪及び洪水についての一般の利用に適合する予報及び警報をしなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）一般向けの予報及び警報は気象庁の義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第13条 第1項","source":"past"},{"id":"59-13-d","round":59,"qNum":"13","choice":"d","tag":"気象予報士","q":"気象予報士は、その氏名または住所に変更があったときは、遅滞なく気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）氏名や住所は登録事項であり、変更時は事後の遅滞ない届出が必要である","pattern":"引っかけなし","law":"気象業務法 第24条の24、同法 第24条の23 第2号・第3号、気象業務法施行規則 第34条 第1項","source":"past"},{"id":"59-13-c","round":59,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象庁以外の者が行う予報業務に従事する気象予報士は、その予報業務の対象地域に所在する事業所に配置されなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 対象地域に所在する事業所 → 〇 場所の規定なし（理由：現象の予想を行う事業所ごとに配置する義務はあるが、その事業所が予報対象地域内にある必要はないため）","pattern":"法定事項の引っかけ","law":"気象業務法 第19条の2","source":"past"},{"id":"59-13-b","round":59,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士は、気象の予報業務に従事するときには、自ら遅滞なく気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 自ら届け出 → 〇 規定なし（事業者が報告）（理由：気象予報士の配置を報告する義務は、雇用する予報業務許可事業者側にあるため）","pattern":"主語のすり替え","law":"気象業務法 及び同法施行規則の全体","source":"past"},{"id":"59-13-a","round":59,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士になるためには、気象予報士試験に合格し、気象庁長官の承認を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 承認 → 〇 登録（理由：気象予報士となるには気象庁長官の登録を受ける必要があるため）","pattern":"用語の混同","law":"気象業務法 第24条の20","source":"past"},{"id":"59-12-d","round":59,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"当該予報業務における予報を迅速に利用者に伝達する施設と要員。","a":"×","lawChanged":false,"explanation":"【対比】× 利用者に伝達する施設と要員 → 〇 要件に含まれない（理由：許可要件で求められるのは警報の「受信」体制であり、自らの予報の「伝達」体制ではないため）","pattern":"法定事項の引っかけ","law":"気象業務法 第18条 第1項","source":"past"},{"id":"59-12-c","round":59,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"当該予報業務の目的および範囲に係る気象庁の警報事項を迅速に受け取ることができる施設と要員。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）防災上重要な警報を受信するための施設と要員が許可の基準として求められる","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第2号","source":"past"},{"id":"59-12-b","round":59,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"当該予報業務に必要な予報資料の解析の施設と要員。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）収集と同様に、解析に必要な施設と要員も許可の基準として規定されている","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"59-12-a","round":59,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"当該予報業務に必要な予報資料の収集の施設と要員。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報資料の収集に必要な施設と要員は許可の基準として規定されている","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"58-15-d","round":58,"qNum":"15","choice":"d","tag":"消防法","q":"火災に関する警報が発せられたときは、該当する区域内にある者は、条例で定める【火の使用の制限】に従わなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）警報発令時の措置として「火の使用の制限」が規定されている","pattern":"引っかけなし","law":"消防法 第22条","source":"past"},{"id":"58-15-c","round":58,"qNum":"15","choice":"c","tag":"消防法","q":"市町村長は、都道府県知事からの通報を受けたとき又は気象の状況が火災の予防上危険であると認めるときは、火災に関する【警報】を発することができる。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）市町村長の権限として「警報」を発令することが規定されている","pattern":"引っかけなし","law":"消防法 第22条","source":"past"},{"id":"58-15-b","round":58,"qNum":"15","choice":"b","tag":"消防法","q":"通報を受けた都道府県知事は、直ちにこれを【市町村長】に通報しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）都道府県知事から市町村長への通報義務ルートとして正しい","pattern":"引っかけなし","law":"消防法 第22条","source":"past"},{"id":"58-15-a","round":58,"qNum":"15","choice":"a","tag":"消防法","q":"気象庁長官等は気象の状況が火災の予防上危険であると認めるときは、その状況を直ちにその地を管轄する【都道府県知事】に通報しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象庁から都道府県知事への通報義務ルートとして正しい","pattern":"引っかけなし","law":"消防法 第22条","source":"past"},{"id":"58-14-c","round":58,"qNum":"14","choice":"c","tag":"罰則","q":"遊園地の運営者が，検定済の気象測器を遊園地内に設置し，気温と風向・風速の観測値を最寄り駅に電光掲示し，気象庁長官に届け出ていなかった。（※罰則が適用される事例として）","a":"×","lawChanged":false,"explanation":"【対比】× 罰則対象 → 〇 罰則適用外（理由：観測施設設置の届出義務違反そのものには罰則規定が設けられていないため）","pattern":"罰則の有無の引っかけ","law":"気象業務法 第7章（第44条〜第50条）","source":"past"},{"id":"58-14-b","round":58,"qNum":"14","choice":"b","tag":"罰則","q":"予報業務の許可を受けた事業者が，検定を受けていない気圧計を用いて，当該予報業務のための気象観測を行っていた。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務のために行う観測には、検定済みの測器を使用する義務があり、違反すると罰則がある","pattern":"引っかけなし","law":"気象業務法 第9条 第1項、同法 第46条 第1号","source":"past"},{"id":"58-14-a","round":58,"qNum":"14","choice":"a","tag":"罰則","q":"気象庁が観測を行っている雨量計を，土地の所有者が無断で別な場所に移設した。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象庁や届出をして設置された気象測器を移設・破壊する行為は処罰対象となる","pattern":"引っかけなし","law":"気象業務法 第37条、同法 第44条","source":"past"},{"id":"58-13-c","round":58,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象業務法の規定により罰金以上の刑に処せられて3年を経過しない者は，気象庁長官による気象予報士の登録を受けることができない。","a":"×","lawChanged":false,"explanation":"【対比】× 3年を経過しない者 → 〇 2年を経過しない者（理由：登録の欠格事由となる期間は刑の執行終了等から2年間であるため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第24条の21 第1号","source":"past"},{"id":"58-13-b","round":58,"qNum":"13","choice":"b","tag":"気象予報士","q":"気象予報士の登録を申請するとき，気象業務法が規定する欠格事由に該当している場合を除き，気象予報士試験に合格してから登録までの期間に制約はない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）試験合格から登録までの期間に関する制限規定はない","pattern":"引っかけなし","law":"気象業務法 第24条の4、同法 第24条の20","source":"past"},{"id":"58-13-a","round":58,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士試験において，不正な手段によって試験を受けようとして試験を停止された者は，以後3年間，気象予報士試験を受けることができない。","a":"×","lawChanged":false,"explanation":"【対比】× 3年間 → 〇 2年以内（理由：不正受験者に対する受験禁止期間は最長2年以内と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第24条の18 第1項、同条 第3項","source":"past"},{"id":"58-12-c","round":58,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"リゾート会社との契約によりスキー場の運営に用いる気象の予報を提供する業務について許可を受けている者が，予報業務の目的を変更して新たに一般向けの気象の予報をインターネットで提供する業務を始めようとする場合は，気象庁長官の認可を受けなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）目的や範囲の変更は、新規許可と同等の厳格な審査（認可）が必要である","pattern":"引っかけなし","law":"気象業務法 第19条 第1項","source":"past"},{"id":"58-12-b","round":58,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"気象の予報業務の許可を受けた者は，予報業務を行った場合は，予報事項の内容や発表時刻，予想を行った気象予報士の氏名を記録し，保存しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務の記録（内容、時刻、気象予報士の氏名など）は2年間の保存義務がある","pattern":"引っかけなし","law":"気象業務法施行規則 第12条の2 第1号・第2号","source":"past"},{"id":"58-12-a","round":58,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務の許可を受けるには，当該予報業務の目的及び範囲に係る気象庁の警報事項を迅速に受けることができる施設及び要員を有しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）許可の要件として、防災上重要な警報を受信する体制が必須とされている","pattern":"引っかけなし","law":"気象業務法 第18条 第1項 第2号","source":"past"},{"id":"57-15-d","round":57,"qNum":"15","choice":"d","tag":"災害対策基本法","q":"国及び地方公共団体は，ボランティアによる防災活動が災害時において果たす役割の重要性に鑑み，ボランティアの自主性を尊重しつつ，ボランティアとの連携に努めなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）行政とボランティアの連携の努力義務について規定されている","pattern":"引っかけなし","law":"災害対策基本法 第5条の3 第1項","source":"past"},{"id":"57-15-c","round":57,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"市町村は，基礎的な地方公共団体として，当該市町村の地域に係る防災に関する計画を作成し，法令に基づきこれを実施するよう努めなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 努めなければならない（努力義務） → 〇 責務を有する（義務）（理由：地域防災計画の作成と実施は、市町村の絶対的な義務であるため）","pattern":"義務と任意のすり替え","law":"災害対策基本法 第5条 第1項","source":"past"},{"id":"57-15-b","round":57,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"都道府県の地域について災害が発生した場合において，防災の推進を図るため必要があると認めるときは，都道府県知事は，自らを長とする都道府県災害対策本部を設置することができる。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）都道府県知事は自らを長とする対策本部を設置できる権限を持つ","pattern":"引っかけなし","law":"災害対策基本法 第23条 第1項、同条 第2項","source":"past"},{"id":"57-15-a","round":57,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"中央防災会議は，災害及び災害の防止に関する科学的研究の成果並びに発生した災害の状況やこれに対して行われた災害応急対策の効果を勘案して，毎年，防災基本計画に検討を加え，必要があるときには修正しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）防災基本計画は毎年定期的に見直す必要があると規定されている","pattern":"引っかけなし","law":"災害対策基本法 第34条 第1項","source":"past"},{"id":"57-14-c","round":57,"qNum":"14","choice":"c","tag":"気象予報士","q":"気象予報士が死亡したとき，その相続人は，遅滞なく，その旨を気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）本人が死亡した場合は、相続人による事後遅滞ない届出が義務付けられている","pattern":"引っかけなし","law":"気象業務法 第24条の25 第1項 第1号、同条 第2項","source":"past"},{"id":"57-14-b","round":57,"qNum":"14","choice":"b","tag":"気象予報士","q":"気象予報士が登録を受けた住所に変更があったときは，遅滞なく，その旨を気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）住所は登録事項であり、変更時は事後遅滞なく届け出る義務がある","pattern":"引っかけなし","law":"気象業務法 第24条の24、気象業務法施行規則 第34条 第1項","source":"past"},{"id":"57-14-a","round":57,"qNum":"14","choice":"a","tag":"気象予報士","q":"気象予報士試験に合格した者が気象予報士となるには，合格した日から 2 年以内に気象庁長官の登録を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 2年以内に登録 → 〇 期限なし（理由：試験合格後、登録までの期間に関する制限規定はないため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第24条の20","source":"past"},{"id":"57-13-d","round":57,"qNum":"13","choice":"d","tag":"気象観測","q":"登録検定機関に対して検定を申請するときは，その手続きは当該気象測器の製造者がしなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 製造者が申請しなければならない → 〇 誰でも申請できる（理由：検定の申請者を製造者に限定するような規定はないため）","pattern":"法定事項の引っかけ","law":"気象業務法 第28条 第1項","source":"past"},{"id":"57-13-c","round":57,"qNum":"13","choice":"c","tag":"気象観測","q":"気象測器の検定の有効期間は，測器の種類にかかわらずすべて 5 年間である。","a":"×","lawChanged":false,"explanation":"【対比】× すべて5年間 → 〇 測器の種類ごとに定める（理由：有効期間は一律ではなく、測器の種類によって個別に定められているため）","pattern":"法定事項の引っかけ","law":"気象業務法 第31条","source":"past"},{"id":"57-13-b","round":57,"qNum":"13","choice":"b","tag":"気象観測","q":"予報業務の許可を受けている者が雨量の観測を行い，その観測データを外部には発表せずに予報業務に用いる場合でも，当該観測に用いる雨量計は登録検定機関が行う検定に合格したものでなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）外部発表の有無にかかわらず、予報業務に用いる観測であれば検定合格測器の使用義務がある","pattern":"引っかけなし","law":"気象業務法 第9条 第1項、同法 別表","source":"past"},{"id":"57-13-a","round":57,"qNum":"13","choice":"a","tag":"気象観測","q":"気象庁以外の政府機関または地方公共団体が，研究または教育のために雨量観測を行うときには，登録検定機関が行う検定に合格した雨量計を使用しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 合格した雨量計を使用 → 〇 使用義務なし（理由：研究や教育のための観測は特例として、検定合格測器の使用義務から除外されているため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第6条 第1項 第1号・第2号、同法 第9条 第1項","source":"past"},{"id":"57-12-d","round":57,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"許可を受けて実施している予報業務の一部を休止しようとする場合は，休止しようとする 30 日前までに気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 休止の30日前までに（事前） → 〇 休止した日から30日以内に（事後）（理由：業務の休止や廃止は事後報告で完了するため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第22条","source":"past"},{"id":"57-12-c","round":57,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"気象庁の警報事項を受ける方法に変更が生じたときは，その旨を記載した報告書を気象庁長官に提出しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）警報事項を受ける方法の変更は、事後遅滞ない報告で足りる","pattern":"引っかけなし","law":"気象業務法施行規則 第50条 第1項 第6号、同条 第2項 第2号、第10条 第2項 第1号 ホ","source":"past"},{"id":"57-12-b","round":57,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"許可を受けた区域とは別の区域を対象に予報業務を行おうとする場合は，変更しようとする 30 日前までに気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 30日前までに届出 → 〇 認可（理由：対象区域の変更は予報業務の範囲の変更にあたり、厳密な事前審査（認可）が必要なため）","pattern":"用語の混同","law":"気象業務法 第19条 第1項、気象業務法施行規則 第10条 第1項 第3号 ロ","source":"past"},{"id":"57-12-a","round":57,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"現象の予想の方法を変更したときには，遅滞なくその旨を記載した報告書を気象庁長官に提出し，認可を申請しなければならない。","a":"×","lawChanged":false,"explanation":"現象の予想の方法の変更は、認可申請事項ではなく気象業務法施行規則第50条第1項第7号に基づく「報告」事項。 提出期限は「遅滞なく」ではなく、同条第2項第3号により「変更の予定日の30日前まで」に提出しなければならない。 認可が必要なのは、気象業務法第19条第1項に基づき予報業務の「目的又は範囲」を変更しようとする場合のみ","pattern":"用語の混同","law":"気象業務法施行規則 第50条 第1項 第7号、同条 第2項 第3号","source":"past"},{"id":"56-15-d","round":56,"qNum":"15","choice":"d","tag":"予報と警報","q":"特別警報の基準を定めようとするときは、気象庁は、【あらかじめ関係都道府県知の意見を聴かなければならない。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）地域の実情を反映させるため、基準制定時には都道府県知事の意見聴取が義務付けられている","pattern":"引っかけなし","law":"気象業務法 第13条の2 第2項","source":"past"},{"id":"56-15-c","round":56,"qNum":"15","choice":"c","tag":"予報と警報","q":"気象庁から特別警報に係る警報事項の通知を受けた都道府県の機関は、【直ちにその通知された事項を関係市町村長に通知しなければならない。】","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）特別警報の伝達は、都道府県から市町村長へは「通知しなければならない（義務）」となる","pattern":"引っかけなし","law":"気象業務法 第15条の2 第2項","source":"past"},{"id":"56-15-b","round":56,"qNum":"15","choice":"b","tag":"予報と警報","q":"特別警報は、【予想される現象が特に異常であるため重大な災害の起こるおそれが著しく大きい場合に】発表される。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）特別警報の定義として正しい","pattern":"引っかけなし","law":"気象業務法 第13条の2 第1項","source":"past"},{"id":"56-15-a","round":56,"qNum":"15","choice":"a","tag":"予報と警報","q":"警報とは、【重大な災害の起こるおそれのある旨を警告して行う予報】をいう。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象業務法における警報の定義として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第7項","source":"past"},{"id":"56-14-d","round":56,"qNum":"14","choice":"d","tag":"気象観測","q":"鉄道事業者が列車の安全な運行に利用するために降水量の観測施設を設置する場合は、国土交通省令で定める技術上の基準に従って観測を行わなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）観測の成果を災害防止に利用するための観測は、技術上の基準に従って行う義務がある","pattern":"引っかけなし","law":"気象業務法 第6条 第2項 第2号","source":"past"},{"id":"56-14-c","round":56,"qNum":"14","choice":"c","tag":"気象観測","q":"スキー場を運営する事業者がゲレンデ付近の気温をホームページに掲載するためにスキー場内に温度計を設置する場合は、その事業者は温度計の設置について気象庁長官に届け出なければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）観測の成果を外部に発表するための観測施設設置には、事前の届出が義務付けられている","pattern":"引っかけなし","law":"気象業務法 第6条 第2項 第1号、同条 第3項","source":"past"},{"id":"56-14-b","round":56,"qNum":"14","choice":"b","tag":"気象観測","q":"学会に発表する論文に掲載するデータを得るために大学が風速観測施設を設置する場合は、その大学は観測施設の設置について気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 届出が必要 → 〇 不要（理由：教育や研究のために行う観測は、技術上の基準や届出義務から除外されているため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第6条 第1項 第1号、同条 第3項","source":"past"},{"id":"56-14-a","round":56,"qNum":"14","choice":"a","tag":"気象観測","q":"農園で果樹の管理のために農園内の苗木の間に温度計を設置する場合は、その農園の運営者は温度計の設置について気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 届出が必要 → 〇 不要（理由：苗木の間など特殊な環境下での観測は、技術上の基準に従う義務や届出義務から除外されているため）","pattern":"原則と例外の引っかけ","law":"気象業務法施行規則 第1条の4 第1号、気象業務法 第6条 第3項","source":"past"},{"id":"56-13-d","round":56,"qNum":"13","choice":"d","tag":"気象予報士","q":"予報業務の許可を受けた事業者は、予報業務を行う事業所に複数配置した気象予報士に1名の欠員が生じ、国土交通省令で定める人数に満たなくなった場合には、ただちに予報業務を停止しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 直ちに停止 → 〇 2週間以内に補充（措置）（理由：欠員が生じた場合は、直ちに停止するのではなく2週間以内に規定の人数を満たすよう措置をとればよいため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"56-13-c","round":56,"qNum":"13","choice":"c","tag":"気象予報士","q":"予報業務の許可を受けた事業者が発表した天気予報について解説を行う者は、気象予報士の資格を有していなくてもよい。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象予報士の独占業務は「現象の予想」のみであり、「解説」には資格は不要であるため","pattern":"引っかけなし","law":"気象業務法 第19条の2","source":"past"},{"id":"56-13-b","round":56,"qNum":"13","choice":"b","tag":"気象予報士","q":"予報業務の許可を受けた事業者は、配置した気象予報士の登録証を事業所に掲示しておかなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 掲示義務あり → 〇 なし（理由：気象予報士の登録証を事業所に掲示する義務は法律上存在しないため）","pattern":"法定事項の引っかけ","law":"ソースに該当なし（判定不能）","source":"past"},{"id":"56-13-a","round":56,"qNum":"13","choice":"a","tag":"気象予報士","q":"予報業務の許可を受けた事業者の下で予報業務に従事しようとする気象予報士は、事業者を通じて予めその旨を気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士は（届出義務） → 〇 規定なし（理由：気象予報士自身が就業前に届出を行う義務は規定されていないため。※事業者が氏名等を報告する義務はある）","pattern":"主語のすり替え","law":"ソースに該当なし（判定不能）、または 気象業務法施行規則 第10条 第2項 第2号","source":"past"},{"id":"56-12-d","round":56,"qNum":"12","choice":"d","tag":"罰則","q":"予報業務許可事業者が、気象庁長官の認可を受けずに予報業務の範囲を変更して業務を行った。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）目的・範囲の変更には事前の認可が必要であり、無認可での変更には罰則（50万円以下の罰金）がある","pattern":"引っかけなし","law":"気象業務法 第46条 第3号","source":"past"},{"id":"56-12-c","round":56,"qNum":"12","choice":"c","tag":"罰則","q":"予報業務許可事業者が、予報業務のうち現象の予想を気象予報士以外の者に行わせた。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）現象の予想は気象予報士の独占業務であり、違反させると罰則（50万円以下の罰金）がある","pattern":"引っかけなし","law":"気象業務法 第46条 第4号","source":"past"},{"id":"56-12-b","round":56,"qNum":"12","choice":"b","tag":"罰則","q":"気象庁長官による予報業務の改善命令を受けた予報業務許可事業者が、改善命令に違反して業務を行った。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）改善命令への違反には罰則（30万円以下の罰金）が規定されている","pattern":"引っかけなし","law":"気象業務法 第47条 第1号","source":"past"},{"id":"56-12-a","round":56,"qNum":"12","choice":"a","tag":"罰則","q":"予報業務許可事業者が、当該予報業務の目的および範囲に係る気象庁の警報事項を予報業務の利用者に伝達することを怠った。","a":"×","lawChanged":false,"explanation":"【対比】× 罰則対象 → 〇 罰則適用外（理由：利用者への警報事項の伝達は「努力義務」であり、怠っても罰則規定はないため）","pattern":"罰則の有無の引っかけ","law":"気象業務法 第20条、同法 第7章（罰則）","source":"past"},{"id":"55-15-d","round":55,"qNum":"15","choice":"d","tag":"災害対策基本法","q":"災害に備えるための措置を適切に組み合わせて一体的に講ずること並びに科学的知見及び【過去の災害から得られた教訓】を踏まえて絶えず改善を図ること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）防災対策の改善における重要な要素として「過去の災害から得られた教訓」が明記されている","pattern":"引っかけなし","law":"災害対策基本法 第2条の2 第3号","source":"past"},{"id":"55-15-c","round":55,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"住民一人一人が自ら行う防災活動及び【自主防災組織】その他の地域における多様な主体が自発的に行う防災活動を促進すること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）地域の防災活動の担い手として「自主防災組織」が明記されている","pattern":"引っかけなし","law":"災害対策基本法 第2条の2 第2号","source":"past"},{"id":"55-15-b","round":55,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"災害の発生を常に【想定する】とともに、災害が発生した場合における被害の最小化及びその迅速な回復を図ること。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）災害は発生するものとして常に「想定する」ことが基本理念に掲げられている","pattern":"引っかけなし","law":"災害対策基本法 第2条の2 第1号","source":"past"},{"id":"55-15-a","round":55,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"我が国の【自然的特性】に鑑み、人口、産業その他の社会経済情勢の変化を踏まえ、","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）災害対策の基本理念における我が国の前提条件として正しい","pattern":"引っかけなし","law":"災害対策基本法 第2条の2 第1号","source":"past"},{"id":"55-14-d","round":55,"qNum":"14","choice":"d","tag":"用語の定義","q":"「予報」とは、観測の成果に基く現象の予想の発表をいう。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予想しただけでなく「発表」して初めて予報になるという定義として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第6項","source":"past"},{"id":"55-14-c","round":55,"qNum":"14","choice":"c","tag":"用語の定義","q":"「観測」とは、自然科学的方法による現象の観察及び測定をいう。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象業務法における「観測」の定義として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第5項","source":"past"},{"id":"55-14-b","round":55,"qNum":"14","choice":"b","tag":"用語の定義","q":"「水象」とは、気象又は地震に密接に関連する陸水及び海洋の諸現象をいう。したがって「水象」には、降水現象や洪水、波浪、高潮が含まれる。","a":"×","lawChanged":false,"explanation":"【対比】× 降水現象は水象 → 〇 降水現象は「気象」（理由：降水（雨や雪）は大気中の現象として「気象」に分類されるため。また水象の定義から「火山現象」も抜けている）","pattern":"用語の混同","law":"気象業務法 第2条 第3項、気象業務法施行規則 第1条の2 第1号・第6号","source":"past"},{"id":"55-14-a","round":55,"qNum":"14","choice":"a","tag":"用語の定義","q":"「気象」とは、大気(電離層を除く。)の諸現象をいう。したがって「気象」の観測種目には、気圧や気温、相対湿度、風、雲が含まれる。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象の定義と観測種目の具体例として正しい","pattern":"引っかけなし","law":"気象業務法 第2条 第1項、気象業務法施行規則 第1条の2 第1号","source":"past"},{"id":"55-13-d","round":55,"qNum":"13","choice":"d","tag":"気象予報士","q":"気象予報士が、刑法の規定により罰金以上の刑に処せられたときには、気象予報士の登録を抹消される。","a":"×","lawChanged":false,"explanation":"【対比】× 刑法の規定 → 〇 気象業務法の規定（理由：登録抹消の欠格事由となるのは、一般の刑法ではなく「気象業務法」に違反して処罰された場合のみであるため）","pattern":"用語の混同","law":"気象業務法 第24条の21 第1号、同法 第24条の25 第1項 第2号","source":"past"},{"id":"55-13-c","round":55,"qNum":"13","choice":"c","tag":"気象予報士","q":"気象予報士試験に合格し、気象予報士となる資格を有する者が気象予報士となるには、国土交通大臣の登録を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 国土交通大臣 → 〇 気象庁長官（理由：気象予報士の登録を行うのは気象庁長官であるため）","pattern":"主語のすり替え","law":"気象業務法 第24条の20","source":"past"},{"id":"55-13-b","round":55,"qNum":"13","choice":"b","tag":"気象予報士","q":"日本国籍を持たない者は気象予報士試験を受けることができない。","a":"×","lawChanged":false,"explanation":"【対比】× 受けられない → 〇 受けられる（理由：気象予報士の受験資格や登録資格において、国籍を制限する規定はないため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第24条の4","source":"past"},{"id":"55-13-a","round":55,"qNum":"13","choice":"a","tag":"気象予報士","q":"不正な手段により気象予報士試験に合格したために、試験の合格を取り消された者は、以後最長 5 年間は気象予報士試験を受けることができない。","a":"×","lawChanged":false,"explanation":"【対比】× 5年間 → 〇 2年以内（理由：不正受験者等に対する受験禁止期間は最長2年以内と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法 第24条の18 第3項","source":"past"},{"id":"55-12-d","round":55,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"気象予報士の氏名及び生年月日","a":"×","lawChanged":false,"explanation":"【対比】× 生年月日 → 〇 登録番号（理由：気象予報士を特定するために必要なのは生年月日ではなく登録番号であるため）","pattern":"用語の混同","law":"気象業務法施行規則 第10条 第2項 第2号","source":"past"},{"id":"55-12-c","round":55,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"発表する予報を利用者に配信する施設の概要","a":"×","lawChanged":false,"explanation":"【対比】× 利用者に配信する施設 → 〇 対象外（理由：収集・解析・警報受信の施設は要件だが、利用者への伝達施設は許可要件・記載事項ではないため）","pattern":"法定事項の引っかけ","law":"気象業務法施行規則 第10条 第2項 第5号","source":"past"},{"id":"55-12-b","round":55,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"現象の予想の方法及び適中率","a":"×","lawChanged":false,"explanation":"【対比】× 適中率の記載 → 〇 記載不要（理由：現象の予想の方法は必須だが、適中率までの記載は求められていないため）","pattern":"法定事項の引っかけ","law":"気象業務法施行規則 第10条 第2項 第1号 ニ","source":"past"},{"id":"55-12-a","round":55,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"収集しようとする予報資料の内容及びその収集方法","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務計画書の記載事項として正しく規定されている","pattern":"引っかけなし","law":"気象業務法施行規則 第10条 第2項 第1号 ハ","source":"past"},{"id":"54-15-b","round":54,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"市町村長は、災害が発生し、または発生するおそれがある場合には、【避難のための立退きを居住者等に】勧告し、及び急を要すると認めるときは、避難のための立退きを指示することができる。","a":"×","lawChanged":true,"explanation":"【対比】× 勧告し、及び...指示することができる → 〇 指示することができる（理由：法改正により「避難勧告」は廃止され、「避難指示」に一本化されたため）","pattern":"法改正による陳腐化","law":"災害対策基本法 第60条 第1項","source":"past"},{"id":"54-15-a","round":54,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"災害対策基本法において、市町村は、【基礎的な】地方公共団体として、当該市町村の住民の生命、身体及び財産を災害から保護するため、【地域防災計画】を作成し、実施する責務を有しており、","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）基礎的自治体である市町村が地域防災計画を作成・実施する責務として正しい","pattern":"引っかけなし","law":"災害対策基本法 第5条 第1項","source":"past"},{"id":"54-14-c","round":54,"qNum":"14","choice":"c","tag":"罰則","q":"気象庁長官の命を受け、私有地で観測を行おうとした気象庁職員の立ち入りを、土地所有者が正当な理由なく拒んだ。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象庁職員の正当な立ち入りを拒む行為は、罰則（30万円以下の罰金）の対象となる","pattern":"引っかけなし","law":"気象業務法 第38条 第1項、同法 第47条 第2号","source":"past"},{"id":"54-14-b","round":54,"qNum":"14","choice":"b","tag":"罰則","q":"ある小学校が、気象庁長官の検定を受けていない風速計を校庭に設置して毎日一定の時刻に観測し、その成果を教育のために利用していた。（※罰則が適用される事例として）","a":"×","lawChanged":false,"explanation":"【対比】× 罰則対象 → 〇 対象外（理由：教育目的の観測は検定合格測器の使用義務から除外されており、違法ではないため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第6条 第1項 第2号、同法 第9条 第1項","source":"past"},{"id":"54-14-a","round":54,"qNum":"14","choice":"a","tag":"罰則","q":"地方公共団体が気象庁に届出をして使用している雨量計を、通行人が正当な理由がないのに壊した。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）届出をして設置された気象測器を破壊する行為は、処罰の対象となる（3年以下の拘禁刑等）","pattern":"引っかけなし","law":"気象業務法 第37条、同法 第44条","source":"past"},{"id":"54-13-d","round":54,"qNum":"13","choice":"d","tag":"気象予報士","q":"予報業務許可事業者は、予報業務のうち現象の予想を行う事業所ごとに、国土交通省令で定められた人数以上の専任の気象予報士を置かなければならない。ただし、予報業務を的確に遂行する上で支障がないと気象庁長官が認める場合は、この限りではない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）気象予報士の設置義務と、気象庁長官が認める場合の例外規定として正しい","pattern":"引っかけなし","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"54-13-c","round":54,"qNum":"13","choice":"c","tag":"気象予報士","q":"複数の気象予報士の配置が規定されている事業所において規定数の気象予報士から 1 名が欠員となった場合には、 1 か月以内であればその欠員が補充されるまでの間、残った気象予報士により予報業務を継続することができる。","a":"×","lawChanged":false,"explanation":"【対比】× 1か月以内 → 〇 2週間以内（理由：業務品質を保つため、速やかな欠員補充が求められるため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第2項","source":"past"},{"id":"54-13-b","round":54,"qNum":"13","choice":"b","tag":"気象予報士","q":"事業所において現象の予想に携わる気象予報士は、気象庁長官から発行された気象予報士登録通知書を事業所に掲示しておかなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 掲示義務あり → 〇 なし（理由：気象予報士の登録通知書を事業所に掲示する義務は法律上存在しないため）","pattern":"法定事項の引っかけ","law":"該当なし","source":"past"},{"id":"54-13-a","round":54,"qNum":"13","choice":"a","tag":"気象予報士","q":"現象の 24 時間先から 1 週間先までの予報作業を毎日 4 時間にわたり行うとして予報業務の許可を受けた者は、事業所ごとに、 3 名以上の気象予報士を配置しなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 3名以上 → 〇 2名以上（理由：1日当たりの予想を行う時間が「8時間以下」の場合は2名と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第11条の2 第1項","source":"past"},{"id":"54-12-d","round":54,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"ある町の桜の開花予想を地元観光協会のホームページで公開するときには、予報業務の許可を受ける必要はない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）植物の現象の予想は気象業務法上の「気象」の予報に該当せず、許可対象外であるため","pattern":"引っかけなし","law":"気象業務法 第2条 第1項、同法 第17条 第1項","source":"past"},{"id":"54-12-c","round":54,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"気象予報士の資格を持つ社員が、屋外作業のために現場周辺のきめ細かな天気予報を行うときには、自社だけの使用であっても予報業務の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"法第2条第6項で「予報」は予想の「発表」と定義されており、社内での自己使用はこれに該当しません。 第17条第1項で許可が必要なのは「予報の業務」ですが、外部へ提供しない自社利用は情報の提供者と利用者が同一のため、これに当たりません。 したがって、社員に自社現場周辺の予想を行わせ社内で共有する場合、予報業務の許可を受ける必要はありません。","pattern":"引っかけなし","law":"気象業務法 第17条 第1項","source":"past"},{"id":"54-12-b","round":54,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"気象予報士が、観光地の独自の天気予報を個人のホームページに公開するときには、予報業務の許可を受ける必要はない。","a":"×","lawChanged":false,"explanation":"【対比】× 許可は不要 → 〇 必要（理由：個人であっても、不特定多数に向けて独自の予報を定期的に発表する行為は「予報業務」に該当するため）","pattern":"原則と例外の引っかけ","law":"気象業務法 第17条 第1項","source":"past"},{"id":"54-12-a","round":54,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"気象庁が発表した最高気温の予報を用いて、熱中症に関する注意喚起等の情報を発表するときには、予報業務の許可を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 許可が必要 → 〇 不要（理由：気象庁の予報を用いて情報を発表するだけで、自ら現象の予想を行っていない場合は予報業務に該当しないため）","pattern":"用語の混同","law":"気象業務法 第2条 第6項、同法 第17条 第1項","source":"past"},{"id":"53-15-c","round":53,"qNum":"15","choice":"c","tag":"災害対策基本法","q":"異常な現象の通報を受けた市町村長は，【地域防災計画】の定めるところにより，その旨を【気象庁】その他の関係機関に通報しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）市町村長から気象庁等への通報義務の根拠とルートとして正しい","pattern":"引っかけなし","law":"災害対策基本法 第54条 第4項","source":"past"},{"id":"53-15-b","round":53,"qNum":"15","choice":"b","tag":"災害対策基本法","q":"異常な現象を発見した者から通報を受けた【警察官】又は海上保安官は，その旨をすみやかに市町村長に通報しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）通報を受けた関係機関から市町村長への通報ルートとして正しい","pattern":"引っかけなし","law":"災害対策基本法 第54条 第3項","source":"past"},{"id":"53-15-a","round":53,"qNum":"15","choice":"a","tag":"災害対策基本法","q":"災害が発生するおそれがある異常な現象を発見した者は，【遅滞なく】，その旨を市町村長又は警察官若しくは海上保安官に通報しなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）異常現象発見者の通報義務の期限として正しい","pattern":"引っかけなし","law":"災害対策基本法 第54条 第1項","source":"past"},{"id":"53-14-d","round":53,"qNum":"14","choice":"d","tag":"予報と警報","q":"気象庁は，気象，地象(地震にあっては，地震動に限る），津波，高潮及び波浪についての航空機及び船舶の利用に適合する予報及び警報をすることができる。","a":"×","lawChanged":false,"explanation":"【対比】× することができる（任意） → 〇 しなければならない（義務）（理由：航空機や船舶の安全運航に直結するため、実施は法的義務であるため）","pattern":"義務と任意のすり替え","law":"気象業務法 第14条 第1項","source":"past"},{"id":"53-14-c","round":53,"qNum":"14","choice":"c","tag":"予報と警報","q":"気象庁は，気象，津波，高潮及び洪水についての水防活動の利用に適合する予報及び警報をしなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）水防活動向けの重要な予報・警報は義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第14条の2 第1項","source":"past"},{"id":"53-14-b","round":53,"qNum":"14","choice":"b","tag":"予報と警報","q":"気象庁は，津波，高潮，波浪及び洪水以外の水象についての一般の利用に適合する予報及び警報をすることができる。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）特定の水象以外についての一般向け予報・警報は「任意（することができる）」と規定されている","pattern":"引っかけなし","law":"気象業務法 第13条 第2項","source":"past"},{"id":"53-14-a","round":53,"qNum":"14","choice":"a","tag":"予報と警報","q":"気象庁は，気象，地象(地震にあっては，地震動に限る)，津波，高潮，波浪及び洪水についての一般の利用に適合する予報及び警報をしなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）一般向けの予報及び警報は気象庁の義務として規定されている","pattern":"引っかけなし","law":"気象業務法 第13条 第1項","source":"past"},{"id":"53-13-c","round":53,"qNum":"13","choice":"c","tag":"気象予報士","q":"予報業務の許可を受けた事業者が発表した天気予報の解説を行う者は，事業者に所属する気象予報士でなくてはならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士でなくてはならない → 〇 資格不要（理由：独占業務は「現象の予想」のみであり、「解説」を行う者に資格は不要なため）","pattern":"用語の混同","law":"気象業務法 第19条の2","source":"past"},{"id":"53-13-b","round":53,"qNum":"13","choice":"b","tag":"気象予報士","q":"予報業務の許可を受けた事業者の下で予報業務に従事しようとする気象予報士は，その旨を予め気象庁長官に届け出なければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士は（自ら届出） → 〇 規定なし（事業者が報告）（理由：気象予報士の配置を報告する義務は、雇用する事業者側にあるため）","pattern":"主語のすり替え","law":"気象業務法施行規則 第10条 第2項 第2号等","source":"past"},{"id":"53-13-a","round":53,"qNum":"13","choice":"a","tag":"気象予報士","q":"気象予報士となるためには，気象予報士試験に合格し，気象庁長官の承認を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 承認 → 〇 登録（理由：試験合格後、気象庁長官の登録を受けることで資格が発生するため）","pattern":"用語の混同","law":"気象業務法 第24条の20","source":"past"},{"id":"53-12-d","round":53,"qNum":"12","choice":"d","tag":"予報業務の許可","q":"予報業務を行つた場合に作成した記録の3年間保存","a":"×","lawChanged":false,"explanation":"【対比】× 3年間 → 〇 2年間（理由：予報業務の記録の保存期間は2年間と規定されているため）","pattern":"数字・期限の引っかけ","law":"気象業務法施行規則 第12条の2","source":"past"},{"id":"53-12-c","round":53,"qNum":"12","choice":"c","tag":"予報業務の許可","q":"予報業務を行つた場合に記録すべき事項として、気象庁の警報事項を利用者に伝達した者の氏名(当該許可を受けた予報業務の目的及び範囲に係るものに限る)の記録","a":"×","lawChanged":false,"explanation":"【対比】× 伝達した者の氏名 → 〇 伝達の状況（理由：警報事項の伝達の「状況」は記録するが、伝達した個人の氏名までは求められていないため）","pattern":"法定事項の引っかけ","law":"気象業務法施行規則 第12条の2 第3号","source":"past"},{"id":"53-12-b","round":53,"qNum":"12","choice":"b","tag":"予報業務の許可","q":"予報業務を行つた場合に記録すべき事項として、予報事項に係る現象の予想を行った気象予報士の氏名の記録","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）現象を予想した気象予報士の氏名は記録事項として規定されている","pattern":"引っかけなし","law":"気象業務法施行規則 第12条の2 第2号","source":"past"},{"id":"53-12-a","round":53,"qNum":"12","choice":"a","tag":"予報業務の許可","q":"予報業務を行つた場合に記録すべき事項として、予報事項の内容及び発表の時刻の記録","a":"〇","lawChanged":false,"explanation":"【対比】（正しい記述）予報業務の記録事項として規定されている","pattern":"引っかけなし","law":"気象業務法施行規則 第12条の2 第1号","source":"past"},{"id":"52-15-e","round":52,"qNum":"15","choice":"e","tag":"予報と警報","q":"日本放送協会の機関は，気象庁から通知された警報事項を，<b>直ちに放送するように努めなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 努めなければならない（努力義務） → 〇 放送をしなければならない（義務）。NHKの警報放送は努力義務ではなく、絶対の「義務」として規定されています。","pattern":"義務と努力義務のすり替え","law":"気象業務法 第15条 第6項","source":"past"},{"id":"52-15-d","round":52,"qNum":"15","choice":"d","tag":"予報と警報","q":"市町村長は，都道府県の機関から通知された警報事項を，<b>直ちに公衆及び所在の官公署に周知させるように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 努力義務あり。市町村長は、通知された警報事項を公衆等に周知させるよう努める義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第15条 第3項","source":"past"},{"id":"52-15-c","round":52,"qNum":"15","choice":"c","tag":"予報と警報","q":"国土交通省の機関は，気象庁から通知された警報事項を，<b>直ちに航行中の航空機に周知させるように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 努力義務あり。国土交通省の機関は、通知された警報事項を航空機に周知させるよう努める義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第15条 第4項","source":"past"},{"id":"52-15-b","round":52,"qNum":"15","choice":"b","tag":"予報と警報","q":"海上保安庁の機関は，気象庁から通知された警報事項を，<b>直ちに航海中及び入港中の船舶に周知させるように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 努力義務あり。海上保安庁の機関は、通知された警報事項を船舶に周知させるよう努める義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第15条 第5項","source":"past"},{"id":"52-15-a","round":52,"qNum":"15","choice":"a","tag":"予報と警報","q":"予報業務の許可を受けた者は，当該予報業務の目的及び範囲に係る気象庁の警報事項を，<b>当該予報業務の利用者に迅速に伝達するように努めなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 努力義務あり。予報業務許可事業者は、関係する気象庁の警報事項を利用者に迅速に伝達するよう努める義務があります。","pattern":"正しい法定事項の確認","law":"気象業務法 第20条","source":"past"},{"id":"52-14-d","round":52,"qNum":"14","choice":"d","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が気象庁長官の許可を受ける際に、要件として求められる項目として、<b>当該予報業務の目的および範囲に係る気象庁の警報事項を迅速に受けることができる施設</b>を有することが挙げられる。","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可要件である。「気象庁の警報事項を迅速に受けることができる施設及び要員」は、法定の許可基準として規定されています。","pattern":"正しい法定事項の確認（許可要件）","law":"気象業務法 第18条 第1項 第2号","source":"past"},{"id":"52-14-c","round":52,"qNum":"14","choice":"c","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が気象庁長官の許可を受ける際に、要件として求められる項目として、<b>当該予報業務に必要な予報資料の解析の要員</b>を有することが挙げられる。","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可要件である。予報業務を適確に遂行するための「予報資料の解析の施設及び要員」は、法定の許可基準として規定されています。","pattern":"正しい法定事項の確認（許可要件）","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"52-14-b","round":52,"qNum":"14","choice":"b","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が気象庁長官の許可を受ける際に、要件として求められる項目として、<b>当該予報業務に必要な観測資料やその他の予報資料の収集の施設</b>を有することが挙げられる。","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可要件である。予報業務を適確に遂行するための「予報資料の収集の施設及び要員」は、法定の許可基準として規定されています。","pattern":"正しい法定事項の確認（許可要件）","law":"気象業務法 第18条 第1項 第1号","source":"past"},{"id":"52-14-a","round":52,"qNum":"14","choice":"a","tag":"予報業務の許可","q":"気象の予報業務を行おうとする者が気象庁長官の許可を受ける際に、要件として求められる項目として、<b>当該予報事項を迅速に利用者に伝達できる施設</b>を有することが挙げられる。","a":"×","lawChanged":false,"explanation":"【対比】× 利用者へ伝達する施設 → 〇 気象庁からの警報を受信する施設。自らの予報を利用者に伝達する施設は、許可の要件（審査基準）には含まれていません。","pattern":"法定要件のすり替え・架空追加","law":"気象業務法 第18条 第1項","source":"past"},{"id":"52-13-c","round":52,"qNum":"13","choice":"c","tag":"気象測器の検定","q":"予報業務の許可を受けている者が気温の観測を行い，<b>その観測データを外部に発表せずに予報業務に用いるときには</b>，当該観測に用いる温度計は気象庁の検定を受けたものである必要はない。","a":"×","lawChanged":false,"explanation":"【対比】× 外部発表しなければ検定不要 → 〇 予報業務に用いるなら検定必須。外部発表の有無に関わらず、予報業務の観測に用いる指定測器（温度計含む）は検定合格品でなければなりません。","pattern":"原則と例外の引っかけ（勝手な免除条件の作成）","law":"気象業務法 第9条 第1項、同法 別表","source":"past"},{"id":"52-13-b","round":52,"qNum":"13","choice":"b","tag":"気象観測","q":"気象観測の施設の設置を気象庁長官に届け出た者は，<b>気象庁長官から観測の成果の報告を求められることがある。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 報告を求められることがある。気象庁長官は、観測網確立のため必要があるときは、届出をした者に対して観測成果の報告を求めることができます。","pattern":"正しい法定事項の確認","law":"気象業務法 第6条 第4項","source":"past"},{"id":"52-13-a","round":52,"qNum":"13","choice":"a","tag":"気象観測","q":"気象業務法において，「気象」とは大気(電離層を除く。)の諸現象をいい，「観測」とは<b>自然科学的方法による現象の観察及び測定</b>をいう。","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい定義。「気象」は大気（電離層を除く）の諸現象、「観測」は自然科学的方法による現象の観察・測定と法的に定義されています。","pattern":"正しい法定事項の確認（定義）","law":"気象業務法 第2条 第1項、同条 第5項","source":"past"},{"id":"52-12-d","round":52,"qNum":"12","choice":"d","tag":"気象予報士","q":"気象予報士は予報業務の許可を受けた者のもとで現象の予想にあたっている間を除き，<b>5 年ごとに気象予報士の登録更新手続きをする必要がある。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 5年ごとに更新 → 〇 更新不要。気象予報士の登録に有効期限や更新手続きの制度は一切存在しません（一生有効です）。","pattern":"法定事項の架空追加（他の資格との混同）","law":"気象業務法 第3章の2","source":"past"},{"id":"52-12-c","round":52,"qNum":"12","choice":"c","tag":"気象予報士","q":"気象予報士が気象業務法の規定により罰金以上の刑に処せられたときには，その気象予報士の登録は抹消され，<b>その後再び登録を受けることはできない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 再び登録を受けることはできない → 〇 2年経過すれば登録可能。罰金以上の刑の執行終了等から2年を経過すれば、再び気象予報士の登録を受けることができます。","pattern":"原則と例外・条件の引っかけ（絶対不可という誤認）","law":"気象業務法 第24条の21 第1号、同法 第24条の25 第1項 第2号","source":"past"},{"id":"52-12-b","round":52,"qNum":"12","choice":"b","tag":"気象予報士","q":"気象予報士試験に合格した者は，<b>合格発表日から 2 年間に限り気象予報士となる資格を有し</b>，この間に気象庁長官に登録申請書を提出して気象予報士名簿への登録を受け，気象予報士となることができる。","a":"×","lawChanged":false,"explanation":"【対比】× 2年間に限り資格を有する → 〇 期限なし。気象予報士となる資格には有効期限がなく、試験合格から登録までの期間制限はありません。","pattern":"数字の引っかけ（架空の期限）","law":"気象業務法 第24条の4、同法 第24条の20","source":"past"},{"id":"52-12-a","round":52,"qNum":"12","choice":"a","tag":"気象予報士","q":"気象庁⻑官は，不正な⼿段によって気象予報⼠試験を受けた者，⼜は受けようとした者に対しては，試験の合格決定を取り消し，⼜はその試験を停⽌することができる","a":"〇","lawChanged":false,"explanation":"気象業務法第24条の18第1項により、不正な手段で試験を受け、又は受けようとした者に対し、気象庁長官は合格決定の取消しや試験の停止を行うことができると定められています。また、同条第2項に基づき、指定試験機関も同様の職権を行使することが可能です","pattern":"","law":"","source":"past"},{"id":"51-15-c","round":51,"qNum":"15","choice":"c","tag":"予報業務の許可","q":"気象の予報業務の許可を受けた者は，気象庁発表の予報を<b>気象予報士の確認を経ずにそのまま利用者に提供することはできない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士の確認が必要 → 〇 そのまま提供なら不要。気象庁の予報をそのまま流すだけなら自ら「予想」を行っていないため、気象予報士に行わせる義務はありません。","pattern":"義務の架空追加（不要な確認作業）","law":"気象業務法 第2条 第6項、同法 第19条の2","source":"past"},{"id":"51-15-b","round":51,"qNum":"15","choice":"b","tag":"罰則","q":"気象の予報業務について許可を受けた会社に雇用されている気象予報士が，会社の業務として同社が許可を得ていない波浪の予報を行った場合，<b>当該気象予報士のほか，法人としての会社も罰せられる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 会社も罰せられる（両罰規定）。無許可での予報業務は、実行した本人だけでなく、雇用主である法人（会社）にも罰金が科せられます。","pattern":"正しい法定事項の確認（両罰規定）","law":"気象業務法 第46条 第2号、同法 第49条","source":"past"},{"id":"51-15-a","round":51,"qNum":"15","choice":"a","tag":"予報業務の許可","q":"気象庁長官の許可を受けて気象の予報業務を行っている者は，予報事項に係る現象の予想を行った気象予報士の名前を記録し，<b>3年間保存しなければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 3年間保存 → 〇 2年間保存。現象の予想を行った気象予報士の氏名等の記録は、2年間保存する義務があります。","pattern":"数字の引っかけ（保存期間）","law":"気象業務法施行規則 第12条の2 第2号","source":"past"},{"id":"51-14-c","round":51,"qNum":"14","choice":"c","tag":"気象予報士","q":"気象予報士は，自ら気象予報士の登録の抹消を申請することができる。申請が認められた場合は，<b>再び気象予報士への登録を申請することができない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 再び申請できない → 〇 再登録可能。自ら登録抹消を申請したことによるペナルティや欠格期間はなく、いつでも再び登録申請が可能です。","pattern":"原則と例外の引っかけ（架空のペナルティ）","law":"気象業務法 第24条の25 第1項、同法 第24条の21","source":"past"},{"id":"51-14-b","round":51,"qNum":"14","choice":"b","tag":"気象予報士","q":"気象予報士は，気象の予報業務に従事するときには，<b>自らが遅滞なく気象庁長官に届け出なければならない。</b>","a":"×","lawChanged":false,"explanation":"【対比】× 気象予報士本人が届け出る → 〇 届け出不要（事業者が手続する）。気象予報士本人が従事する際に自ら気象庁に届け出る法定の義務はありません。","pattern":"義務の架空追加（主体と義務のすり替え）","law":"気象業務法施行規則 第10条 第2項 第2号等","source":"past"},{"id":"51-14-a","round":51,"qNum":"14","choice":"a","tag":"気象予報士","q":"気象予報士試験に合格した者が気象予報士となるには，<b>合格した日から 1 年以内に</b>気象庁長官の登録を受けなければならない。","a":"×","lawChanged":false,"explanation":"【対比】× 1年以内に登録 → 〇 期限なし。気象予報士試験の合格から登録申請までの期間には、法律上の制限（期限）はありません。","pattern":"数字の引っかけ（架空の期限）","law":"気象業務法 第24条の20","source":"past"},{"id":"51-13-c","round":51,"qNum":"13","choice":"c","tag":"予報業務の許可","q":"予報業務の許可を受けている者が，気象業務法に基づく命令に違反したときは，<b>気象庁長官はその許可を取り消すことができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 取消が可能。法令や命令、許可の条件等に違反した場合、気象庁長官は業務の停止や許可の取消しを行うことができます。","pattern":"正しい法定事項の確認","law":"気象業務法 第21条 第1号","source":"past"},{"id":"51-13-b","round":51,"qNum":"13","choice":"b","tag":"予報業務の許可","q":"予報業務の許可を受けている者は，行っている予報業務に係る気象庁の警報事項<b>(特別警報を含む)</b>を当該予報業務の利用者に迅速に伝達するように努めなければならない。","a":"〇","lawChanged":false,"explanation":"【対比】〇 特別警報も含む。予報業務の利用者への警報伝達の努力義務には、警報の一種である「特別警報」も含まれます。","pattern":"正しい法定事項の確認（適用範囲）","law":"気象業務法 第20条、同法 第13条の2 第5項","source":"past"},{"id":"51-13-a","round":51,"qNum":"13","choice":"a","tag":"予報業務の許可","q":"気象庁以外の者が気象，地象，津波，高潮，波浪又は洪水の予報の業務を行おうとする場合は，<b>気象庁長官の許可を受けなければならない。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 許可が必要。民間事業者等が気象や津波等の予報業務を行う場合は、原則として気象庁長官の許可が必須です。","pattern":"正しい法定事項の確認","law":"気象業務法 第17条 第1項","source":"past"},{"id":"51-12-d","round":51,"qNum":"12","choice":"d","tag":"災害対策基本法","q":"市町村の地域について災害が発生し，又は災害が発生するおそれがある場合において，防災の推進を図るため必要があると認めるときは，市町村長は，市町村地域防災計画の定めるところにより，<b>市町村災害対策本部を設置することができる。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 設置できる。災害発生時等に必要があると認めるときは、市町村長は市町村災害対策本部を設置することができます。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第23条の2 第1項","source":"past"},{"id":"51-12-c","round":51,"qNum":"12","choice":"c","tag":"災害対策基本法","q":"防災基本計画及び防災業務計画並びに地域防災計画は，<b>中央防災会議が作成する防災に関する計画である。</b>","a":"×","lawChanged":false,"explanation":"【対比】× すべて中央防災会議が作成 → 〇 中央防災会議が作成するのは防災基本計画のみ。業務計画は指定機関等、地域計画は都道府県・市町村の防災会議等が作成します。","pattern":"主語のすり替え（作成主体の混同）","law":"災害対策基本法 第2条 第8号・第9号・第10号","source":"past"},{"id":"51-12-b","round":51,"qNum":"12","choice":"b","tag":"災害対策基本法","q":"防災に関する組織として，<b>中央防災会議，都道府県防災会議，市町村防災会議の設置が災害対策基本法に定められている。</b>","a":"〇","lawChanged":false,"explanation":"【対比】〇 正しい法定機関。国（内閣府）に中央防災会議、都道府県に都道府県防災会議、市町村に市町村防災会議を置くことが規定されています。","pattern":"正しい法定事項の確認","law":"災害対策基本法 第11条 第1項、第14条 第1項、第16条 第1項","source":"past"},{"id":"51-12-a","round":51,"qNum":"12","choice":"a","tag":"災害対策基本法","q":"災害対策基本法における定義によ
