// BROWSE
//==============================
var browseFilter = { tag: 'all', round: 'all', status: 'all', text: '' };
var browseShowFilters = false;

function renderBrowse() {
  var stats = getStats();
  var tagsSet = {};
  ALL_Q.forEach(function(q) { tagsSet[q.tag] = true; });
  var tags = Object.keys(tagsSet);
  var roundsSet = {};
  PAST_Q.forEach(function(q) { roundsSet[q.round] = true; });
  var rounds = Object.keys(roundsSet).map(Number).sort(function(a, b) { return b - a; });

  // Filter
  var filtered = ALL_Q.filter(function(q) {
    if (browseFilter.tag !== 'all' && q.tag !== browseFilter.tag) return false;
    if (browseFilter.round !== 'all') {
      if (browseFilter.round === 'predicted' && q.source !== 'predicted') return false;
      if (browseFilter.round !== 'predicted' && q.round !== parseInt(browseFilter.round)) return false;
    }
    if (browseFilter.status === 'wrong' && !stats.wrongIds[q.id]) return false;
    if (browseFilter.status === 'unseen' && state.history[q.id]) return false;
    if (browseFilter.status === 'starred' && !state.starred[q.id]) return false;
    if (browseFilter.text) {
      var s = browseFilter.text.toLowerCase();
      if (q.q.toLowerCase().indexOf(s) === -1 && q.tag.toLowerCase().indexOf(s) === -1 && (q.law || '').toLowerCase().indexOf(s) === -1) return false;
    }
    return true;
  });

  function pill(text, active, color, onClick, small) {
    var cls = 'pill tap' + (small ? ' small' : '') + (active ? ' active' : '');
    if (active && color) cls += ' ' + color;
    return el('button', { class: cls, onClick: onClick }, text);
  }

  // Status pill row
  var statusRow = el('div', { class: 'pill-row' }, [
    pill('全て', browseFilter.status === 'all', null, function() { browseFilter.status = 'all'; render(); }),
    pill('誤答あり', browseFilter.status === 'wrong', 'crimson', function() { browseFilter.status = 'wrong'; render(); }),
    pill('未挑戦', browseFilter.status === 'unseen', null, function() { browseFilter.status = 'unseen'; render(); }),
    pill('★', browseFilter.status === 'starred', 'gold', function() { browseFilter.status = 'starred'; render(); })
  ]);

  var inputEl = el('input', {
    type: 'text', placeholder: '問題文/法令名で検索...',
    value: browseFilter.text
  });
  inputEl.addEventListener('input', function(e) {
    browseFilter.text = e.target.value;
    // re-render only the list to avoid losing focus
    var listEl = document.getElementById('browse-list-container');
    if (listEl) updateBrowseList(listEl, stats);
  });

  // Filter toggle
  var filterToggle = el('button', {
    class: 'filter-toggle tap',
    onClick: function() { browseShowFilters = !browseShowFilters; render(); }
  }, 'テーマ/回数で絞り込み ' + (browseShowFilters ? '▲' : '▼'));

  var filterSection = null;
  if (browseShowFilters) {
    var tagPills = [pill('テーマ:全て', browseFilter.tag === 'all', null, function() { browseFilter.tag = 'all'; render(); }, true)];
    tags.forEach(function(t) {
      tagPills.push(pill(t, browseFilter.tag === t, null, function() { browseFilter.tag = t; render(); }, true));
    });
    var roundPills = [
      pill('回:全て', browseFilter.round === 'all', null, function() { browseFilter.round = 'all'; render(); }, true),
      pill('予想', browseFilter.round === 'predicted', null, function() { browseFilter.round = 'predicted'; render(); }, true)
    ];
    rounds.forEach(function(r) {
      roundPills.push(pill(String(r), browseFilter.round === String(r), null, function() { browseFilter.round = String(r); render(); }, true));
    });
    filterSection = el('div', { class: 'filter-section' }, [
      el('div', { class: 'pill-row wrap' }, tagPills),
      el('div', { class: 'pill-row wrap' }, roundPills)
    ]);
  }

  var searchBar = el('div', { class: 'search-bar' }, [
    inputEl,
    statusRow,
    filterToggle,
    filterSection
  ]);

  // Body container
  var listContainer = el('div', { id: 'browse-list-container', class: 'screen-body' });
  updateBrowseList(listContainer, stats);

  var rightEl = el('span', { class: 'mono', style: { fontSize: '11px', opacity: 0.7, color: 'var(--paper)' } }, filtered.length + '問');

  var wrap = el('div', { class: 'screen' });
  wrap.appendChild(header('問題集', goHome, rightEl));
  wrap.appendChild(searchBar);
  wrap.appendChild(listContainer);
  return wrap;
}

function updateBrowseList(container, stats) {
  clearNode(container);
  var filtered = ALL_Q.filter(function(q) {
    if (browseFilter.tag !== 'all' && q.tag !== browseFilter.tag) return false;
    if (browseFilter.round !== 'all') {
      if (browseFilter.round === 'predicted' && q.source !== 'predicted') return false;
      if (browseFilter.round !== 'predicted' && q.round !== parseInt(browseFilter.round)) return false;
    }
    if (browseFilter.status === 'wrong' && !stats.wrongIds[q.id]) return false;
    if (browseFilter.status === 'unseen' && state.history[q.id]) return false;
    if (browseFilter.status === 'starred' && !state.starred[q.id]) return false;
    if (browseFilter.text) {
      var s = browseFilter.text.toLowerCase();
      if (q.q.toLowerCase().indexOf(s) === -1 && q.tag.toLowerCase().indexOf(s) === -1 && (q.law || '').toLowerCase().indexOf(s) === -1) return false;
    }
    return true;
  });

  if (filtered.length > 0) {
    container.appendChild(el('button', {
      class: 'browse-go-btn tap',
      onClick: function() {
        var n = Math.min(20, filtered.length);
        var pool = shuffle(filtered).slice(0, n);
        navigate('quiz', { pool: pool, mode: 'filtered', title: '絞り込み演習（' + n + '問）' });
      }
    }, [
      el('span', { class: 'text' }, 'この条件で演習'),
      el('span', { class: 'arrow' }, '▶')
    ]));
  }

  var list = el('div', { class: 'browse-list' });
  if (filtered.length === 0) {
    list.appendChild(el('div', { class: 'empty' }, '該当する問題がありません'));
  } else {
    filtered.slice(0, 200).forEach(function(q) {
      list.appendChild(makeBrowseItem(q));
    });
    if (filtered.length > 200) {
      list.appendChild(el('div', { class: 'more-msg' }, '＋他' + (filtered.length - 200) + '問（フィルタを絞ってください）'));
    }
  }
  container.appendChild(list);
}

function makeBrowseItem(q) {
  var hist = state.history[q.id];
  var starred = state.starred[q.id];
  var preview = q.q.replace(/【|】|<b>|<\/b>/g, '').slice(0, 60) + '...';

  var summary = el('summary', null, [
    el('span', { class: 'id' }, q.source === 'past' ? (q.round + '-' + q.qNum + q.choice) : '予想'),
    el('span', { class: 'mark ' + (q.a === '〇' ? 'o' : 'x') }, q.a),
    el('span', { class: 'preview' }, preview),
    el('button', {
      class: 'star tap ' + (starred ? 'on' : 'off'),
      onClick: function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleStar(q.id);
        render();
      }
    }, starred ? '★' : '☆')
  ]);

  var meta = el('div', { class: 'meta' }, [
    el('span', { class: 'meta-tag', style: { color: tagColor(q.tag) } }, '● ' + q.tag),
    q.lawChanged ? el('span', { class: 'badge changed' }, '法改正') : null,
    hist ? el('span', { style: { fontFamily: 'monospace', fontSize: '11px', opacity: 0.6 } },
              '挑戦' + hist.length + '回 · 直近 ' + hist.slice(-3).map(function(h) { return h.correct ? '〇' : '×'; }).join('')) : null
  ]);

  var qf = el('div', { class: 'qf' });
  qf.appendChild(renderQText(q.q));

  var bodyDiv = el('div', { class: 'body' }, [meta, qf]);
  if (q.explanation) {
    bodyDiv.appendChild(el('div', { class: 'exp' }, [
      el('div', { class: 'exp-label' }, '解説'),
      el('div', { class: 'exp-text' }, q.explanation)
    ]));
  }
  if (q.pattern) bodyDiv.appendChild(el('div', { class: 'pat' }, '引っかけ: ' + q.pattern));
  if (q.law) bodyDiv.appendChild(el('div', { class: 'law' }, q.law));

  return el('details', { class: 'browse-item' }, [summary, bodyDiv]);
}

//==============================
// HISTORY
//==============================
function renderHistory() {
  var stats = getStats();
  var sessions = state.sessions.slice().reverse();

  // Group by day
  var byDayMap = {};
  state.sessions.forEach(function(s) {
    var d = new Date(s.ts);
    var key = d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
    if (!byDayMap[key]) byDayMap[key] = { count: 0, correct: 0, total: 0 };
    byDayMap[key].count++;
    byDayMap[key].correct += s.correct;
    byDayMap[key].total += s.total;
  });
  var byDay = Object.keys(byDayMap).reverse().map(function(k) { return [k, byDayMap[k]]; });

  var overall = el('details', { class: 'card', open: true }, [
    el('summary', null, [el('span', { class: 'title' }, '通算'), el('span', { class: 'caret' }, '▼')]),
    el('div', { class: 'content' }, [
      el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', fontSize: '14px' } }, [
        el('div', null, [el('span', { class: 'stat-label' }, 'セッション '), el('span', { class: 'mincho', style: { fontSize: '18px', marginLeft: '4px' } }, String(state.sessions.length))]),
        el('div', null, [el('span', { class: 'stat-label' }, '解答回数 '), el('span', { class: 'mincho', style: { fontSize: '18px', marginLeft: '4px' } }, String(stats.totalAttempts))]),
        el('div', null, [el('span', { class: 'stat-label' }, '正答率 '), el('span', { class: 'mincho', style: { fontSize: '18px', marginLeft: '4px' } }, stats.accuracy + '%')]),
        el('div', null, [el('span', { class: 'stat-label' }, 'カバー率 '), el('span', { class: 'mincho', style: { fontSize: '18px', marginLeft: '4px' } }, stats.attemptedPct + '%')])
      ])
    ])
  ]);

  var byDayCard = null;
  if (byDay.length > 0) {
    var dayDiv = el('div');
    byDay.slice(0, 14).forEach(function(entry) {
      var day = entry[0], d = entry[1];
      dayDiv.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: '14px', alignItems: 'center', padding: '4px 0' } }, [
        el('span', { class: 'mono', style: { opacity: 0.7 } }, day),
        el('div', { style: { textAlign: 'right' } }, [
          el('span', { class: 'mincho' }, String(d.correct)),
          el('span', { style: { opacity: 0.5, fontSize: '11px' } }, ' / ' + d.total),
          el('span', { style: { opacity: 0.6, fontSize: '11px', marginLeft: '8px' } }, '(' + d.count + 'セッション)')
        ])
      ]));
    });
    byDayCard = el('details', { class: 'card', open: true }, [
      el('summary', null, [el('span', { class: 'title' }, '日別'), el('span', { class: 'caret' }, '▼')]),
      el('div', { class: 'content' }, dayDiv)
    ]);
  }

  var sessionList = el('div', { class: 'session-list' });
  if (sessions.length === 0) {
    sessionList.appendChild(el('div', { class: 'empty' }, 'まだ履歴がありません'));
  } else {
    sessions.slice(0, 50).forEach(function(s) {
      var pct = Math.round((s.correct / s.total) * 100);
      var mm = Math.floor((s.durationSec || 0) / 60);
      var ss = (s.durationSec || 0) % 60;
      var color = pct >= 70 ? 'var(--moss)' : (pct >= 50 ? 'var(--gold-dark)' : 'var(--crimson)');
      sessionList.appendChild(el('div', { class: 'session-row' }, [
        el('div', { class: 'body' }, [
          el('div', { class: 'name' }, s.title || s.mode),
          el('div', { class: 'ts' }, fmtDate(s.ts) + ' · ' + mm + ':' + pad(ss))
        ]),
        el('div', null, [
          el('div', { class: 'score' }, [
            el('span', { style: { color: color } }, String(s.correct)),
            el('span', { style: { opacity: 0.5, fontFamily: 'monospace', fontSize: '14px' } }, ' / ' + s.total)
          ]),
          el('div', { class: 'pct' }, pct + '%')
        ])
      ]));
    });
  }

  var body = el('div', { class: 'screen-body' }, [
    overall,
    byDayCard,
    el('div', null, [
      el('div', { class: 'section-title', style: { margin: '0 0 8px', padding: '0 4px' } }, 'セッション履歴'),
      sessionList
    ]),
    el('button', { class: 'reset-btn tap', onClick: resetAll }, 'すべてリセット')
  ]);

  var wrap = el('div', { class: 'screen' });
  wrap.appendChild(header('取り組み履歴', goHome));
  wrap.appendChild(body);
  return wrap;
}

//==============================
// COLLECTIONS
//==============================
function renderCollections() {
  var body = el('div', { class: 'screen-body' }, [
    el('div', { class: 'coll-active' }, [
      el('span', { class: 'ico' }, '⚖'),
      el('div', { style: { flex: 1 } }, [
        el('div', { class: 'mincho' }, '法規（現在使用中）'),
        el('div', { style: { fontSize: '11px', opacity: 0.6, marginTop: '2px' } }, '一般科目・気象業務法等')
      ]),
      el('span', { class: 'mono', style: { fontSize: '11px', opacity: 0.6 } }, 'ACTIVE')
    ]),
    el('div', { class: 'coll-future' }, [
      el('div', { class: 'coll-future-head' }, [
        el('span', { class: 'ico' }, '✎'),
        el('div', { style: { flex: 1 } }, [
          el('div', { class: 'mincho', style: { opacity: 0.7 } }, '実技 暗記項目'),
          el('div', { style: { fontSize: '11px', opacity: 0.6, marginTop: '2px' } }, '準備中')
        ])
      ]),
      el('div', { class: 'desc' },
        '実技試験の暗記項目（天気記号、気象現象の閾値、警報・注意報基準、台風スケール等）を、' +
        '同じ仕組み（演習・履歴・苦手抽出）で学習できるようにする予定です。' +
        'データ形式を法規と統一しているため、CSVを追加するだけで取り込み可能です。')
    ]),
    el('div', { class: 'coll-hint' }, [
      el('strong', null, '【拡張方法】'),
      el('br'),
      '実技用のCSVを用意して、同じ「問題ID／テーマタグ／問題文／正誤／解説／引っかけ／根拠」の形式にすれば、' +
      'このアプリ内に同じ機能セット（ランダム演習、苦手だけ、テーマ別まとめ、履歴）を実技用としてもう一つ追加できます。' +
      'データはコレクション別に分離管理されるため、法規の進捗と混ざりません。'
    ])
  ]);

  var wrap = el('div', { class: 'screen' });
  wrap.appendChild(header('コレクション', goHome));
  wrap.appendChild(body);
  return wrap;
}

//==============================
// BOOT
//==============================
render();

})();
</script>
</body>
</html>
